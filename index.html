<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Applications compagnon du cours de mathématiques, pour réviser et se préparer pour les D.S.">
  <title>Applications compagnon du cours · Fabien Boyer</title>
  <link rel="stylesheet" href="style.css">
  <script src="applications.js" defer></script>
  <script src="page.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#activites">Aller aux applications</a>
  <main class="container">
    <header>
      <p class="author">Fabien Boyer · Mathématiques · Collège</p>
      <h1>Applications compagnon du cours</h1>
      <p class="intro">Pour réviser et se préparer pour les D.S.</p>
    </header>
    <section id="activites" aria-labelledby="activities-title">
      <div class="section-heading">
        <h2 id="activities-title">Applications disponibles</h2>
        <p id="results" role="status" aria-live="polite"></p>
      </div>
      <div id="filters" class="filters" hidden>
        <fieldset class="levels"><legend class="sr-only">Filtrer par niveau</legend>
          <button type="button" data-level="tous" aria-pressed="true">Tous les niveaux</button>
          <button type="button" data-level="6e" aria-pressed="false">6<sup>e</sup></button>
          <button type="button" data-level="5e" aria-pressed="false">5<sup>e</sup></button>
          <button type="button" data-level="4e" aria-pressed="false">4<sup>e</sup></button>
          <button type="button" data-level="3e" aria-pressed="false">3<sup>e</sup></button>
        </fieldset>
        <div class="search-wrap"><label class="sr-only" for="search">Rechercher une application ou un chapitre</label>
          <input type="search" id="search" placeholder="Rechercher une application…" autocomplete="off">
        </div>
      </div>
      <div id="app-grid" class="app-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <h3 id="empty-title">Aucune application disponible</h3>
        <p id="empty-text">Les applications seront ajoutées ici.</p>
        <button id="reset" class="reset" type="button" hidden>Afficher toutes les applications</button>
      </div>
      <noscript><p>Active JavaScript dans ton navigateur pour afficher les applications.</p></noscript>
      <p id="copy-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
    <footer>Fabien Boyer · Mathématiques</footer>
  </main>
</body>
</html>
