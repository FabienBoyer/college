 const [X,S,Y]=ex?['T','U','V']:letters(3),nm=an(X+S+Y);
 const tasks=[{guide:true,q:`Compare ${m}° avec 0°, 90° et 180°. La mesure est…`,a:CMP[z],options:CMP,keep:true,hint:'Un angle droit mesure 90°. Un angle plat mesure 180°.',corr:`${m}° est ${CMP[z]}.`},
  {q:`Quelle est la nature de l’angle ${nm} ?`,a:NATO[z],options:NATO,keep:true,hint:'Un angle aigu mesure entre 0° et 90°. Un angle obtus mesure entre 90° et 180°.',corr:`${nm} = ${m}° : c’est ${NATO[z]}.`}];
 return {head:`<p>On sait que ${nm} = ${m}°.</p>`,tasks,correction:L(`${nm} = ${m}°`,`${nm} est ${NATO[z]}.`)};}
function natureFigure(ex){const kind=ex?'obtus':pick(['aigu','aigu','obtus','obtus','droit','plat']),z=KIND.indexOf(kind);
 const m=ex?140:{aigu:R(20,70),obtus:R(110,165),droit:90,plat:180}[kind],b=ex?20:R(0,359);
 const [X,S,Y]=ex?['E','F','G']:letters(3),nm=an(X+S+Y);
 const f=figRays({S:pt(200,120,S,b+m/2+180),W:400,H:240,rays:[{a:b,n:X,L:88},{a:b+m,n:Y,L:88}],marks:[kind==='droit'?{right:true,a1:b,col:C.orange}:{a1:b,a2:b+m,r:30,col:C.orange}]});
 const cmp=['plus petit qu’un angle droit','égal à un angle droit','plus grand qu’un angle droit'],ci=kind==='aigu'?0:kind==='droit'?1:2;

/* =================== 3. Rapporteur =================== */
const GRAD=['la graduation extérieure','la graduation intérieure'];
function rapp1(ex){const right=ex?false:Math.random()<.5,m=ex?50:rnd(15,170,5);if(m===90)return rapp1(ex);
 const [S,A,B]=ex?['O','A','B']:letters(3),nm=an(A+S+B),g=right?0:1,sens=right?'à droite':'à gauche';
 const f=protractor({S,right:right?A:null,left:right?null:A,rays:[{a:right?m:180-m,n:B}],mark:right?[0,m]:[180-m,180]});
 const tasks=[{guide:true,q:`Le centre du rapporteur est sur le sommet ${S}. Le côté [${S}${A}) passe par le 0 de quelle graduation ?`,a:GRAD[g],options:GRAD,keep:true,hint:`Suis le côté [${S}${A}) jusqu’au bord du rapporteur : quel 0 rencontre-t-il ?`,corr:`Le côté [${S}${A}) est ${sens} : il passe par le 0 de ${GRAD[g]}. C’est elle que je lis.`},
  {guide:true,q:`L’angle ${nm} est-il aigu ou obtus ?`,a:m<90?'aigu':'obtus',options:['aigu','obtus'],keep:true,hint:'Compare l’angle orange avec le coin de ton équerre.',corr:`${nm} est ${m<90?'plus petit':'plus grand'} qu’un angle droit : il est ${m<90?'aigu':'obtus'}.`},
  {q:`Quelle est la mesure de l’angle ${nm} ?`,a:String(m),unit:'°',hint:`Pars du 0 de ${GRAD[g]} et suis cette graduation jusqu’au côté [${S}${B}).`,corr:`Sur ${GRAD[g]}, le côté [${S}${B}) passe par ${m}. L’angle est ${m<90?'aigu':'obtus'} et ${m}° est ${m<90?'plus petit':'plus grand'} que 90° : c’est cohérent.`}];
 return {head:`<p>On mesure l’angle ${nm} avec le rapporteur.</p>${f}`,tasks,correction:L(`Le côté [${S}${A}) passe par le 0 de ${GRAD[g]}.`,`${nm} = ${m}°`)};}
function rapp2(ex){const [S,X,Y,B,Cc,D]=ex?['O','E','F','G','H','K']:letters(6);
 let a;if(ex)a=[25,80,135];else for(;;){a=[rnd(15,60,5),rnd(65,115,5),rnd(120,165,5)];if(a[1]-a[0]>=25&&a[2]-a[1]>=25&&a[1]!==90)break;}
 const N=[B,Cc,D],i=ex?1:R(0,2),j=ex?2:pick([0,1,2].filter(z=>z!==i)),m1=a[i],m2=180-a[j];
 const f=protractor({S,right:X,left:Y,rays:a.map((v,z)=>({a:v,n:N[z]}))});
 const n1=an(X+S+N[i]),n2=an(Y+S+N[j]);
 const tasks=[{guide:true,q:`Pour mesurer ${n1}, quelle graduation faut-il lire ?`,a:GRAD[0],options:GRAD,keep:true,hint:`Le côté [${S}${X}) part vers la droite. Quel 0 est de ce côté ?`,corr:`[${S}${X}) passe par le 0 de la graduation extérieure.`},
  {q:`Quelle est la mesure de l’angle ${n1} ?`,a:String(m1),unit:'°',hint:`Pars du 0 de la graduation extérieure et va jusqu’au côté [${S}${N[i]}).`,corr:`${n1} = ${m1}°`},
  {guide:true,q:`Pour mesurer ${n2}, quelle graduation faut-il lire ?`,a:GRAD[1],options:GRAD,keep:true,hint:`Le côté [${S}${Y}) part vers la gauche. Quel 0 est de ce côté ?`,corr:`[${S}${Y}) passe par le 0 de la graduation intérieure.`},
  {q:`Quelle est la mesure de l’angle ${n2} ?`,a:String(m2),unit:'°',hint:`Pars du 0 de la graduation intérieure et va jusqu’au côté [${S}${N[j]}).`,corr:`${n2} = ${m2}°. L’angle est ${m2<90?'aigu':'obtus'} : c’est cohérent.`}];
 return {head:`<p>Le centre du rapporteur est sur le point ${S}. Lis les mesures demandées.</p>${f}`,tasks,correction:L(`${n1} = ${m1}°`,`${n2} = ${m2}°`)};}

/* =================== 4. Angles particuliers =================== */
const PAIRES=['opposés par le sommet','adjacents','correspondants','alternes-internes'];
function paires(ex){const th=ex?60:pick([R(50,70),R(110,130)]),kind=ex?'alternes-internes':pick(PAIRES);let p;
 const v=R(0,1),k=R(1,4);
 if(kind==='opposés par le sommet')p=[[v,k],[v,(k+1)%4+1]];
 else if(kind==='adjacents')p=[[v,k],[v,k%4+1]];
 else if(kind==='correspondants')p=[[0,k],[1,k]];
 else p=ex?[[0,4],[1,2]]:pick([[[0,3],[1,1]],[[0,4],[1,2]]]);
 const same=p[0][0]===p[1][0];
 const f=figPara(th,[{v:p[0][0],k:p[0][1],col:C.orange},{v:p[1][0],k:p[1][1],col:C.bleu}]);
 const why={'opposés par le sommet':'Ils ont le même sommet et leurs côtés se prolongent : ils sont opposés par le sommet. Ils ont donc la même mesure.',adjacents:'Ils ont le même sommet, un côté commun, et ils ne se superposent pas : ils sont adjacents.',correspondants:'Ils sont du même côté de la sécante, et à la même place sur chaque droite : ils sont correspondants.','alternes-internes':'Ils sont de part et d’autre de la sécante, et entre les deux droites : ils sont alternes-internes.'}[kind];
 const tasks=[{guide:true,q:'Les angles orange et bleu ont-ils le même sommet ?',a:same?'Oui':'Non',options:['Oui','Non'],keep:true,hint:'Le sommet est le point d’où partent les côtés de l’angle coloré.',corr:same?'Oui : ils sont au même point d’intersection.':'Non : ils sont sur deux points d’intersection différents.'},
  {q:'Les angles orange et bleu sont…',a:kind,options:PAIRES,keep:true,hint:same?'Même sommet : ils sont opposés par le sommet si leurs côtés se prolongent, adjacents s’ils ont un côté commun.':'Deux sommets différents : correspondants s’ils sont à la même place, alternes-internes s’ils sont entre les deux droites, de part et d’autre de la sécante.',corr:why}];
 return {head:`<p>Une sécante (en vert) coupe deux droites. Observe les angles orange et bleu.</p>${f}`,tasks,correction:L(`Les angles orange et bleu sont ${kind}.`)};}
const CS=['complémentaires','supplémentaires','ni complémentaires ni supplémentaires'];
function compReco(ex){const kind=ex?0:pick([0,0,1,1,2]);let a,s;
 if(ex){a=58;s=90;}else if(kind<2){s=kind?180:90;a=rnd(kind?25:10,kind?155:80);}else{s=pick([90,180])+pick([-1,1])*R(4,15);a=rnd(10,s-10);}
 const b=s-a;if(!ex&&AV.has(b))return compReco(ex);
 const tasks=[{guide:true,q:'Calcule la somme de leurs mesures.',a:String(s),unit:'°',hint:'Additionne les deux mesures.',corr:`${a}° + ${b}° = ${s}°`},
  {q:'Ces deux angles sont…',a:CS[kind],options:CS,keep:true,hint:'Complémentaires : la somme fait 90°. Supplémentaires : la somme fait 180°.',corr:kind===0?'La somme est égale à 90° : ils sont complémentaires.':kind===1?'La somme est égale à 180° : ils sont supplémentaires.':`La somme n’est égale ni à 90° ni à 180° : ils ne sont ni complémentaires ni supplémentaires.`}];
 return {head:`<p>Deux angles mesurent ${a}° et ${b}°.</p>`,tasks,correction:L(`${a}° + ${b}° = ${s}°`,`Les deux angles sont ${CS[kind]}.`)};}
function compCalc(ex){const sup=ex?true:Math.random()<.5,T=sup?180:90,a=ex?72:rnd(sup?20:8,sup?160:82),b=T-a;
 const [P,Q,S,U,V,W]=ex?['A','B','C','D','E','F']:letters(6),n1=an(P+Q+S),n2=an(U+V+W),typ=sup?'supplémentaires':'complémentaires';
 const tasks=[{guide:true,q:`La somme des mesures de deux angles ${typ} est égale à…`,a:T+'°',options:['90°','180°','360°'],keep:true,hint:'COMplémentaires → « Ke » → quatre-vingt-dix. SUpplémentaires → « Se » → cent-quatre-vingts.',corr:`Deux angles ${typ} : ${n1} + ${n2} = ${T}°.`},
  {q:`Calcule la mesure de l’angle ${n2}.`,a:String(b),unit:'°',hint:`${a}° + ${n2} = ${T}° : quel nombre faut-il ajouter à ${a} pour obtenir ${T} ?`,corr:`${n2} = ${T}° − ${a}° = ${b}°`}];

/* =================== 5. Calculer une mesure =================== */

function adjSomme(ex){const a=ex?27:rnd(18,60),b=ex?44:rnd(18,60),a0=ex?8:R(0,20),s=a+b;if(!ex&&AV.has(s))return adjSomme(ex);

 return {head:`<p>Calcule la mesure de l’angle ${z}.</p>${f}`,tasks,correction:L(`${z} = ${x} + ${y}`,`${z} = ${a}° + ${b}°`,box(`${z} = ${s}°`))};}
function adjDiff(ex){const c=ex?96:rnd(60,150),a=ex?31:rnd(15,c-18),b=c-a,a0=ex?6:R(0,20);if(!ex&&AV.has(b))return adjDiff(ex);
 const [S,A,B,Cc]=ex?['O','A','B','C']:letters(4),x=an(A+S+B),y=an(B+S+Cc),z=an(A+S+Cc);
 const f=adjFig({x:150,y:205},[S,A,B,Cc],a0,a,b,[a+'°','?',c+'°']);
 const tasks=[{guide:true,q:'Quelle égalité est juste ?',a:`${x} + ${y} = ${z}`,options:[`${x} + ${y} = ${z}`,`${x} + ${z} = ${y}`,`${y} + ${z} = ${x}`],keep:true,hint:`Les angles ${x} et ${y} sont adjacents : ensemble, ils forment ${z}.`,corr:`${x} et ${y} sont adjacents, donc ${x} + ${y} = ${z}.`},

 return {head:`<p>On sait que ${z} = ${c}° et ${x} = ${a}°. Calcule ${y}.</p>${f}`,tasks,correction:L(`${x} + ${y} = ${z}`,`${a}° + ${y} = ${c}°`,`${y} = ${c}° − ${a}°`,box(`${y} = ${b}°`))};}
function platDroit(ex){const plat=ex?false:Math.random()<.5,T=plat?180:90,a=ex?23:rnd(plat?25:12,plat?155:78),b=T-a;if(!ex&&AV.has(b))return platDroit(ex);

 else{const a0=ex?4:R(0,15);f=figRays({S:pt(150,205,S,a0+225),W:400,H:235,rays:[{a:a0+90,n:A},{a:a0+90-a,n:B},{a:a0,n:Cc}],marks:[{right:true,a1:a0,col:INK},{a1:a0+90-a,a2:a0+90,r:60,col:C.orange,lab:a+'°',lr:22},{a1:a0,a2:a0+90-a,r:60,col:C.bleu,lab:'?',lr:22}]});}

  {q:`Calcule la mesure de l’angle ${y}.`,a:String(b),unit:'°',hint:`${x} et ${y} sont adjacents : ${x} + ${y} = ${T}°.`,corr:`${y} = ${T}° − ${a}° = ${b}°`}];
 return {head:`<p>On sait que ${x} = ${a}°. Calcule ${y}.</p>${f}`,tasks,correction:L(`${x} + ${y} = ${T}°`,`${a}° + ${y} = ${T}°`,`${y} = ${T}° − ${a}°`,box(`${y} = ${b}°`))};}

/* =================== 6. Bissectrice =================== */
function bissFig(S,N,a0,p,q,labs,codage,W=400,H=230){const aM=a0+p;
 return figRays({S:pt(S.x,S.y,N[0],a0+(p+q)/2+180),W,H,rays:[{a:a0,n:N[1]},{a:aM,n:N[2],c:C.rouge},{a:a0+p+q,n:N[3]},{a:aM+180,c:C.rouge,dash:true}],
  marks:[{a1:a0,a2:aM,r:64,col:C.orange,lab:labs[0],tick:codage},{a1:aM,a2:a0+p+q,r:64,col:codage?C.orange:C.bleu,lab:labs[1],tick:codage}].concat(labs[2]?[{a1:a0,a2:a0+p+q,r:112,col:INK,op:0,lab:labs[2],lr:18}]:[])});}

 const [S,A,M,B]=ex?['O','A','M','B']:letters(4),x=an(A+S+M),y=an(M+S+B),z=an(A+S+B);
 const f=bissFig({x:110,y:200},[S,A,M,B],a0,p,q,codage?['','']:[p+'°',q+'°'],codage);
 const tasks=[{guide:true,q:`Les angles ${x} et ${y} sont-ils adjacents ?`,a:'Oui',options:['Oui','Non'],keep:true,hint:'Même sommet, un côté commun, ils ne se superposent pas ?',corr:`Ils ont le même sommet ${S}, le côté [${S}${M}) commun, et ils ne se superposent pas : ils sont adjacents.`},
  {guide:true,q:`Les angles ${x} et ${y} ont-ils la même mesure ?`,a:yes?'Oui':'Non',options:['Oui','Non'],keep:true,hint:codage?'Le même petit trait sur deux arcs code deux angles de même mesure.':'Compare les deux mesures écrites sur la figure.',corr:codage?'Oui : le codage indique deux angles de même mesure.':yes?`Oui : ${x} = ${y} = ${p}°.`:`Non : ${p}° ≠ ${q}°.`},
  {q:`La droite (${S}${M}) est-elle la bissectrice de l’angle ${z} ?`,a:yes?'Oui':'Non',options:['Oui','Non'],keep:true,hint:'La bissectrice partage l’angle en deux angles adjacents de même mesure.',corr:yes?`(${S}${M}) partage ${z} en deux angles adjacents de même mesure : c’est la bissectrice de ${z}.`:`Les deux angles n’ont pas la même mesure : (${S}${M}) n’est pas la bissectrice de ${z}.`}];
 return {head:`<p>Observe la figure.</p>${f}`,tasks,correction:L(yes?`${x} = ${y}`:`${x} ≠ ${y}`,`(${S}${M}) ${yes?'est':'n’est pas'} la bissectrice de ${z}.`)};}

 const [S,A,M,B]=ex?['O','A','M','B']:letters(4),x=an(A+S+M),z=an(A+S+B);

/* Mon travail : suivi léger, enregistré dans le navigateur (clé propre à l'app). */
function makeSuivi(app,prefix,modules){
 const KEY=app+'-suivi',B36=n=>Math.max(0,Math.min(1295,n|0)).toString(36).toUpperCase().padStart(2,'0');
 let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
 st.m=st.m||{};st.ds=st.ds||{};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
 const sum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h;};
 const nf=x=>String(x).replace('.',',');
 const fait=(f,r)=>f?`${f} exercice${f>1?'s':''} fait${f>1?'s':''} seul, dont ${r} sans erreur`:'pas commencé';
 function code(){const day=Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);let b=B36(day);
  modules.forEach(([k],i)=>{const r=st.m[k];if(r&&r[0])b+=String(i)+'M'+B36(r[0])+B36(r[1]);});
  Object.keys(st.ds).sort().forEach(s=>{const d=st.ds[s];b+='D'+s+B36(Math.round(d.n*2))+B36(Math.round(d.max*2));});
  return (prefix+b+B36(sum(b))).match(/.{1,6}/g).join('-');}
 function decode(str){const s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');if(!s.startsWith(prefix)||s.length<prefix.length+4)return null;
  const b=s.slice(prefix.length,-2);if(sum(b)!==parseInt(s.slice(-2),36))return null;
  const out={date:new Date(Date.UTC(2026,0,1)+parseInt(b.slice(0,2),36)*864e5),m:{},ds:{}};
  for(let i=2;i+6<=b.length;i+=6){const e=b.slice(i,i+6);
   if(e[0]==='D')out.ds[e[1]]={n:parseInt(e.slice(2,4),36)/2,max:parseInt(e.slice(4,6),36)/2};
   else{const mod=modules[+e[0]];if(!mod||e[1]!=='M')return null;out.m[mod[0]]=[parseInt(e.slice(2,4),36),parseInt(e.slice(4,6),36)];}}
  return out;}
 function table(d){const rows=modules.map(([k,l])=>{const r=d.m[k]||[0,0];return `<tr><td>${l}</td><td>${r[0]?r[0]:'—'}</td><td>${r[0]?r[1]:'—'}</td></tr>`;}).join('');
  const ds=Object.keys(d.ds).sort().map(s=>`Sujet ${s === 'R' ? 'tiré au hasard' : s} : ${nf(d.ds[s].n)} / ${nf(d.ds[s].max)}`).join(' ; ');
  return `<table class="suivi-t"><tr><th>Partie</th><th>Exercices faits seul</th><th>Sans erreur</th></tr>${rows}</table><p>Dernière note provisoire au D.S. blanc : ${ds||'pas encore de D.S. vérifié'}.</p>`;}
 if(!document.getElementById('suivi-css')){const c=document.createElement('style');c.id='suivi-css';c.textContent='.suivi{margin-top:18px}.suivi h2{color:#2f7a45;font-size:1.2rem;line-height:1.3;margin:0 0 .5em}.suivi-st{margin:.2em 0 .6em;font-size:.88rem;color:#5b6478}.suivi-t{border-collapse:collapse;width:100%;margin:.4em 0;font-size:.95rem}.suivi-t th,.suivi-t td{border:1px solid #c9d3ee;padding:.35em .5em;text-align:left}.suivi-t th{background:#f4f6fb;font-weight:700}.suivi-code{display:inline-block;font-family:"STIX Two Text",Cambria,serif;font-size:1.2rem;letter-spacing:.06em;padding:.2em .6em;border:2px dashed #1d3a8a;border-radius:8px;background:#fff;margin:.3em .5em .3em 0}.suivi details{margin-top:.8em}.suivi summary{cursor:pointer;font-weight:700;color:#1d3a8a}.suivi input[type=text]{font:inherit;padding:.4em .6em;border:2px solid #c9d3ee;border-radius:8px;min-width:0;width:16em;max-width:100%}.suivi .suivi-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0}.suivi .suivi-bad{color:#b8322a}';document.head.append(c);}
 return {
  done(mod,first){const r=st.m[mod]||[0,0];r[0]++;if(first)r[1]++;st.m[mod]=r;save();},
  ds(s,n,max){st.ds[s]={n:Math.round(n*2)/2,max};save();},
  status(mod){const r=st.m[mod]||[0,0];return fait(r[0],r[1]);},
  box(){const sec=document.createElement('section');sec.className='card suivi';const c=code();
   sec.innerHTML=`<h2>Mon travail</h2><p>Ce que j’ai fait dans « Je m’entraîne seul », partie par partie, et ma dernière note provisoire au D.S. blanc.</p>${table(st)}
    <p><b>Mon code pour le professeur.</b> Copie-le et envoie-le à ton professeur s’il te le demande.</p>
    <div class="suivi-row"><span class="suivi-code">${c}</span><button type="button" class="btn light" data-s="copy">Copier le code</button></div>
    <details><summary>Espace professeur : lire un code</summary><div class="suivi-row"><input type="text" data-s="in" placeholder="${prefix}…" autocomplete="off" aria-label="Code d’un élève"><button type="button" class="btn" data-s="read">Lire le code</button></div><div data-s="out"></div>
    <p class="suivi-st">Effacer le suivi enregistré sur cet appareil :</p><button type="button" class="btn light" data-s="reset">Tout effacer</button></details>`;
   const $s=k=>sec.querySelector(`[data-s="${k}"]`);
   $s('copy').addEventListener('click',()=>{(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>{$s('copy').textContent='Code copié';}).catch(()=>{const r=document.createRange();r.selectNode(sec.querySelector('.suivi-code'));getSelection().removeAllRanges();getSelection().addRange(r);});});
   $s('read').addEventListener('click',()=>{const d=decode($s('in').value);$s('out').innerHTML=d?`<p>Code créé le ${d.date.toLocaleDateString('fr-FR')}.</p>`+table(d):'<p class="suivi-bad">Ce code n’est pas valide. Vérifiez qu’il a été copié en entier.</p>';});
   let armed=false;$s('reset').addEventListener('click',()=>{if(!armed){armed=true;$s('reset').textContent='Cliquer encore pour tout effacer';return;}st={m:{},ds:{}};save();sec.replaceWith(this.box());});
   return sec;}
 };
}
function dsKeep(paper,key){const els=()=>[...paper.querySelectorAll('input,select,textarea')].filter(e=>!['button','hidden','submit'].includes(e.type));
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v))els().forEach((e,i)=>{if(i>=v.length)return;if(e.type==='radio'||e.type==='checkbox')e.checked=!!v[i];else e.value=v[i]==null?'':v[i];});}catch(e){}
 let dead=false;const save=()=>setTimeout(()=>{if(dead)return;try{localStorage.setItem(key,JSON.stringify(els().map(e=>e.type==='radio'||e.type==='checkbox'?e.checked:e.value)));}catch(e){}},0);
 ['input','change','click'].forEach(ev=>paper.addEventListener(ev,save));
 return ()=>{dead=true;try{localStorage.removeItem(key);}catch(e){}};}

  Q(`b) ${an('ROS')} =`,'92',L(`b) ${an('ROS')} = 2 × ${an('ROT')}`,`${an('ROS')} = 2 × 46°`,box(`${an('ROS')} = 92°`)))]},
 {title:'Défi',pts:0,defi:true,head:`<p>À faire seulement si tu as terminé et vérifié tout le reste. La droite (OM) est la bissectrice de ${an('AOB')} et ${an('AOM')} = 35°. Les points A, O et C sont alignés, et O est entre A et C.</p>`,items:[
  Q(`${an('BOC')} =`,'110',L(`${an('AOB')} = 2 × 35° = 70°`,`${an('AOB')} + ${an('BOC')} = 180°`,`70° + ${an('BOC')} = 180°`,`${an('BOC')} = 180° − 70°`,box(`${an('BOC')} = 110°`)))]}]};

function dsNote(n,total){return String(Math.round(n*2)/2).replace('.',',')+' / '+String(total).replace('.',',');}
const PH={num:'Nombre',set:'Exemple : A, B'};
/* Choix de réponse : des boutons (les noms d'angles ont un chapeau, impossible dans une liste déroulante). */
function makeChoice(t,label){const g=dom('div','choices');g.setAttribute('role','group');g.setAttribute('aria-label',label);let val='';
 const bs=(t.options.length>2&&!t.keep?shuffle(t.options):t.options).map(o=>{const b=dom('button','opt',o);b.type='button';b.dataset.v=o;b.addEventListener('click',()=>{val=o;g.classList.remove('bad');bs.forEach(x=>x.classList.toggle('sel',x===b));});g.append(b);return b;});
 Object.defineProperty(g,'value',{get:()=>val});Object.defineProperty(g,'disabled',{get:()=>bs[0].disabled,set:v=>bs.forEach(b=>b.disabled=v)});
 g.mark=a=>bs.forEach(b=>{if(b.dataset.v===a)b.classList.add('good');else if(b.dataset.v===val)b.classList.add('bad');});return g;}
function makeInput(t,label){let input;
 if(t.options)return makeChoice(t,label);
 else{input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.spellcheck=false;const k=t.kind||'num';input.placeholder=PH[k];if(k==='num')input.inputMode='decimal';}
 input.setAttribute('aria-label',label);return input;}
function withUnit(t,input){if(!t.unit)return [input];return [input,dom('span','unit',t.unit)];}
function renderDS(){
 const main=$('#app');main.append(dom('h2','ttl','<span>7. D.S. blanc</span>'));const bar=dom('div','subtabs');const variant=VIEW.variant||'A';for(const v of ['A','B'])bar.append(button('Sujet '+v,()=>{VIEW.variant=v;render();},variant===v?'on':''));bar.append(button('Imprimer le sujet',()=>window.print(),'btn light'));main.append(bar);
 const exos=DS[variant],total=exos.reduce((s,e)=>s+e.pts,0);
 const paper=dom('div','card ds');paper.append(dom('h3','ds-title','D.S. blanc · Angles et rapporteur · Sujet '+variant),dom('p','','Durée : 45 minutes. Matériel : règle et rapporteur. Rédige toutes tes réponses sur une feuille. Le D.S. est noté sur '+total+' points.'),dom('p','consigne','Quand tu as fini, recopie tes résultats dans les cases, puis vérifie. Les mesures sont en degrés.'));main.append(paper);const controls=[],corrs=[];
 exos.forEach((ex,ei)=>{
  const block=dom('section','ds-exo'+(ex.defi?' defi':''),`<h3>${ex.defi?'Défi':'Exercice '+(ei+1)+' · '+ex.title} <span class="small">(${ex.defi?'non noté':String(ex.pts).replace('.',',')+' points'})</span></h3>${ex.head}`);paper.append(block);
  ex.items.forEach((t,qi)=>{
   const id=`ds-${ei}-${qi}`,row=dom('div','ds-item'),ans=dom('div','ds-ans');row.append(dom('div','ds-q',t.q),ans);block.append(row);let fields,check;
   if(t.options){const g=dom('div','ds-radios');g.setAttribute('role','radiogroup');g.setAttribute('aria-label','Réponse '+(ei+1)+'.'+(qi+1));for(const o of t.options){const l=dom('label'),r=dom('input');r.type='radio';r.name=id;r.value=o;l.append(r);l.insertAdjacentHTML('beforeend',' '+o);g.append(l);}ans.append(g);const get=()=>{const c=g.querySelector('input:checked');return c?c.value:'';};fields=[...g.querySelectorAll('input')];check=()=>correct(get(),t);}
   else{const lab=dom('label','ds-lab','Résultat :'),input=makeInput(t,'Résultat');input.id=id;lab.htmlFor=id;ans.append(lab,...withUnit(t,input));fields=[input];check=()=>correct(input.value,t);}
   controls.push({t,ans,fields,check,w:ex.pts/ex.items.length});
  });
  const corr=dom('div','seyes ds-corr');corr.hidden=true;corr.innerHTML=`<h4>Correction ${ex.defi?'du défi':'de l’exercice '+(ei+1)}</h4>`+(ex.corrs||ex.items.map(t=>t.corr)).join('');block.append(corr);corrs.push(corr);
 });
 const clear=dsKeep(paper,'angles-rapporteur-ds-'+variant);
 const end=button('Vérifier mes résultats et afficher la correction',()=>{let score=0,note=0,n=0;for(const{t,ans,fields,check,w}of controls){const ok=check();if(w){n++;if(ok){score++;note+=w;}}fields.forEach(f=>f.disabled=true);if(t.options)ans.querySelectorAll('label').forEach(l=>{if(l.querySelector('input').value===t.a)l.classList.add('good');});ans.append(dom('span',ok?'okm':'kom',ok?' Juste.':' Bonne réponse : '+answer(t)+'.'));}corrs.forEach(c=>c.hidden=false);setTimeout(()=>SUIVI.ds(variant,note,total));
  const sum=dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} résultat${score>1?'s':''} juste${score>1?'s':''} sur ${n}).<p>Cette note ne compte que tes résultats. Ta vraie note dépend aussi de ce que tu as écrit sur ta feuille, en particulier les définitions et les justifications. Compare ta feuille avec la correction de chaque exercice.</p>`);sum.append(button('Effacer mes réponses et recommencer',()=>{clear();render();window.scrollTo({top:0});},'btn light'));end.replaceWith(sum);paper.prepend(dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} sur ${n} résultats justes). La correction est sous chaque exercice, et le détail en bas de la page.`));});
 paper.append(end);
}
/* Modelage : toutes les étapes, réponse et explication. Pratique guidée : les mêmes étapes, avec l'aide.
   Pratique autonome : les étapes intermédiaires (guide) disparaissent. Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul';
 if(alone)parent.append(dom('p','small','Fais le travail sur ton cahier, puis saisis seulement ta réponse.'));
 parent.append(dom('div','exo-head',ex.head));const box=dom('div','steps');parent.append(box);
 const tasks=alone?ex.tasks.filter(t=>!t.guide):ex.tasks;
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=t.q;const single=tasks.length===1;const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+`<div class="step-q">${q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);
  const input=makeInput(t,'Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   const ok=correct(input.value,t);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Vérifie ton travail, puis fais un deuxième essai.';input.classList.add('bad');return;}
   if(input.mark)input.mark(t.a);
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(...withUnit(t,input),valid);
 }
 next();
}

/* Charte : les noms de points et les notations de géométrie ([AB], (AB), [AB), AB, (d), (d₁)…)
   sont écrits en STIX, comme les nombres. La lettre x et la lettre f seule restent en italique STIX.
   Le SVG, les champs de saisie et les zones .no-math ne sont pas touchés. */
(() => {
  "use strict";
  const XF = /(^|[^\p{L}\p{M}])(x|f)(?![\p{L}\p{M}]|\))/gu;
  const GEO = /(^|[^\p{L}\p{M}\p{N}.’'])((?:[\[\]()]?[A-Z]{1,3}[\[\]()]?)|\(d[₁₂₃']?\))(?![\p{L}\p{M}\p{N}]|\.\p{L}|[’']\p{L})/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, input, [contenteditable], .no-math, .m, .ang";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data, marks = [];
    let m;
    GEO.lastIndex = 0;
    while ((m = GEO.exec(value))) marks.push({ s: m.index + m[1].length, e: m.index + m[0].length, it: false });
    XF.lastIndex = 0;
    while ((m = XF.exec(value))) { const s = m.index + m[1].length; if (!marks.some(k => s >= k.s && s < k.e)) marks.push({ s, e: s + 1, it: true }); }
    if (!marks.length) return;
    marks.sort((a, b) => a.s - b.s);
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const k of marks) {
      if (k.s < last) continue;
      if (k.s > last) frag.append(value.slice(last, k.s));
      const n = document.createElement(k.it ? "i" : "span");
      n.className = "m";
      n.textContent = value.slice(k.s, k.e);
      frag.append(n);
      last = k.e;
    }
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
