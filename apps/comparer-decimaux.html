</style></head><body><div class="wrap"><header><a class="back-home" href="../6e/">← Toutes les applications</a><h1><span>Chapitre 3 : Comparer des nombres décimaux</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours">Cours</button><button type="button" data-page="comparer">1. Comparer</button><button type="button" data-page="ranger">2. Ranger</button><button type="button" data-page="encadrer">3. Encadrer</button><button type="button" data-page="arrondir">4. Arrondir</button><button type="button" data-page="droite">5. Demi-droite graduée</button><button type="button" data-page="ds">6. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 6<sup>e</sup></footer></div><template id="course-source"><section data-mod="comparer"><h3>1. Comparer deux nombres</h3>
<div class="retenir"><b>À retenir</b>Comparer deux nombres, c’est dire s’ils sont égaux, ou lequel des deux est le plus grand.</div>
<p>On utilise les symboles suivants :</p><ul><li><span class="m">&lt;</span> se lit « strictement inférieur à » ;</li><li><span class="m">≤</span> se lit « inférieur ou égal à » ;</li><li><span class="m">&gt;</span> se lit « strictement supérieur à ».</li></ul>
<div class="seyes"><h4>Exemples</h4><p>5 &lt; 7, et aussi 5 ≤ 7, car 5 est plus petit que 7.</p><p>7 ≤ 7, car 7 est égal à 7.</p><p>Par contre, on n’a pas 7 &lt; 7.</p></div>
<h3>2. La méthode</h3>
<div class="retenir"><b>À retenir</b>On compare d’abord les parties entières. Si elles sont égales, on compare les chiffres des dixièmes, puis ceux des centièmes, et ainsi de suite, jusqu’à trouver deux chiffres différents.</div>
<div class="seyes"><h4>Exemple · Comparer 20,32 et 20,311</h4><p>On a 20 = 20 donc on passe aux dixièmes.</p><p>On a 3 = 3 donc on passe aux centièmes.</p><p>On a 2 &gt; 1 donc on peut conclure.</p><p><span class="box">20,32 &gt; 20,311</span></p></div>
<p>Le nombre de chiffres après la virgule ne compte pas : 20,311 a plus de chiffres que 20,32, mais il est plus petit. Quand un chiffre manque, on peut ajouter un zéro inutile : 16,3 = 16,30, donc 16,3 &gt; 16,03.</p>
<h3>3. Exemple d’application : disques et cercles</h3>
<div class="cols3"><p>Le disque « avec le bord » est l’ensemble des points <span class="m">M</span> tels que <span class="m">OM ≤ <i class="m">r</i></span>.</p><p>Le disque « sans le bord » est l’ensemble des points <span class="m">M</span> tels que <span class="m">OM &lt; <i class="m">r</i></span>.</p><p>Le cercle est l’ensemble des points <span class="m">M</span> tels que <span class="m">OM = <i class="m">r</i></span>.</p></div>

<section data-mod="ranger"><h3>4. Ranger des nombres</h3>
<div class="retenir"><b>À retenir</b><ul><li>Ranger dans l’<strong>ordre croissant</strong>, c’est écrire les nombres du plus petit au plus grand, avec le symbole &lt;.</li><li>Ranger dans l’<strong>ordre décroissant</strong>, c’est écrire les nombres du plus grand au plus petit, avec le symbole &gt;.</li></ul></div>
<p>On regroupe d’abord les nombres qui ont la même partie entière. Dans chaque groupe, on compare les dixièmes, puis les centièmes.</p>
<div class="seyes"><h4>Exemple · ordre croissant</h4><p>34,2 ; 33,8 ; 35,1 ; 34 ; 33,68 ; 34,15</p><p>33,68 &lt; 33,8 &lt; 34 &lt; 34,15 &lt; 34,2 &lt; 35,1</p></div></section>
<section data-mod="encadrer"><h3>5. Encadrer un nombre</h3>
<div class="retenir"><b>À savoir</b><ul><li><strong>Encadrer</strong> un nombre, c’est trouver un nombre plus petit et un nombre plus grand que lui.</li><li>Deux nombres <strong>consécutifs</strong> sont deux nombres qui se suivent, comme 903 et 904.</li></ul></div>
<div class="seyes"><h4>Exemples</h4><p>Entre deux entiers consécutifs : 903 &lt; 903,216 &lt; 904</p><p>Au dixième : 5 870,4 &lt; 5 870,42 &lt; 5 870,5</p></div>
<p>Pour trouver un nombre compris entre 3,1 et 3,2, on ajoute un zéro inutile : 3,1 = 3,10 et 3,2 = 3,20. Les nombres 3,11 ; 3,12 ; … ; 3,19 conviennent, par exemple 3,1 &lt; 3,15 &lt; 3,2.</p></section>
<section data-mod="arrondir"><h3>6. Valeurs approchées et arrondi</h3>
<div class="retenir"><b>À retenir</b>Quand on encadre un nombre au dixième (ou à l’unité, au centième…) :<ul><li>la valeur plus petite que le nombre est la <strong>valeur approchée par défaut</strong> ;</li><li>la valeur plus grande est la <strong>valeur approchée par excès</strong> ;</li><li>l’<strong>arrondi</strong> est celle des deux valeurs approchées qui est la plus proche du nombre.</li></ul></div>
<div class="seyes"><h4>Exemple · 4,284</h4><p>À l’unité : 4 &lt; 4,284 &lt; 5, l’arrondi est 4.</p><p>Au dixième : 4,2 &lt; 4,284 &lt; 4,3, l’arrondi est 4,3.</p><p>Au centième : 4,28 &lt; 4,284 &lt; 4,29, l’arrondi est 4,28.</p></div>
<div class="retenir"><b>Méthode</b>Pour arrondir, on regarde le chiffre juste après le rang demandé.<ul><li>S’il vaut 0, 1, 2, 3 ou 4, l’arrondi est la valeur approchée par défaut.</li><li>S’il vaut 5, 6, 7, 8 ou 9, l’arrondi est la valeur approchée par excès.</li></ul></div>
<p>Exemple : l’arrondi à l’unité de 704,524 est 705, car le chiffre des dixièmes, 5, est supérieur ou égal à 5.</p></section>
<section data-mod="droite"><h3>7. Demi-droite graduée</h3>
<div class="retenir"><b>À retenir</b>Sur une demi-droite graduée, les graduations sont régulières : l’écart entre deux graduations voisines est toujours le même. On l’appelle le <strong>pas</strong>. Chaque point est repéré par un nombre, son <strong>abscisse</strong>.</div>
<p>On écrit <span class="m">A(1,3)</span> pour dire que l’abscisse du point <span class="m">A</span> est 1,3.</p>
<div id="cours-axe"></div>
<div class="retenir"><b>Méthode pour trouver le pas</b><ol><li>On calcule la différence entre deux nombres écrits sous la demi-droite.</li><li>On la partage par le nombre d’intervalles qui les séparent.</li></ol></div>
<div class="seyes"><h4>Exemple · 5,1 et 11,9 séparés par 4 intervalles</h4><p>11,9 − 5,1 = 6,8</p><p>6,8 ÷ 4 = 1,7</p><p>Le pas est 1,7. Les graduations sont 5,1 ; 6,8 ; 8,5 ; 10,2 ; 11,9.</p></div></section>

/* =================== 3. Encadrer =================== */
function entiers(example){let s,fr=null;
 if(example){s='12,07';}
 else{const v=fresh(()=>{const I=pick([R(0,9),R(10,99),R(100,999)]),k=R(1,3);let d;do{d=Array.from({length:k},rd).join('');}while(d.at(-1)==='0');return {n:I+','+d};});s=v.n;if(Math.random()<.35){const [i,d]=s.split(',');fr={N:Number(i+d),k:d.length};}}

function auRang(example){let s,k;

 else{k=R(1,2);s=fresh(()=>{const I=pick([R(0,9),R(10,99)]),n=R(k+1,3);let d;do{d=Array.from({length:n},rd).join('');}while(d.at(-1)==='0');if(Math.random()<.25)d=d.slice(0,k-1)+'9'+d.slice(k);return {n:I+','+d};}).n;}
 const u=toUnits(s,k),lo=fixK(u,k),hi=fixK(u+1,k),c=s.split(',')[1][k-1];

  {q:`Quel nombre écris-tu à droite ? ${fmt(s)} &lt; …`,a:hi,hint:`Ajoute 1 ${RKS[k].slice(0,-1)} au nombre de gauche.`,corr:`${fmt(lo)} + ${fixK(1,k)} = ${fmt(hi)}.`}];
 return {n:s,head:`<p>Encadre ce nombre ${ARR[k]}, c’est-à-dire par deux nombres consécutifs ayant ${k} chiffre${k>1?'s':''} après la virgule.</p><p class="big">${fmt(s)}</p>`,tasks,correction:`<p>${box(fmt(lo)+' &lt; '+fmt(s)+' &lt; '+fmt(hi))}</p>`};}
function intercaler(example){let lo,hi,k;

 else{k=R(0,2);const I=R(1,40);if(k===0){lo=String(I);hi=String(I+1);}else{const u=Number(I+Array.from({length:k},rd).join(''));const x=k===2&&u%10===9?u-1:u;lo=canon(fixK(x,k));hi=canon(fixK(x+1,k));}}

   {guide:true,q:`Écris ${fmt(hi)} avec ${k+1} chiffres après la virgule.`,a:hi0,kind:'exact',hint:'Ajoute un zéro inutile à la fin. Si le nombre est entier, écris une virgule puis des zéros.',corr:`${fmt(hi)} = ${hi0}.`});}

/* =================== 4. Arrondir =================== */
function arrondi(k){return example=>{let s;
 if(example)s=['8,627','3,145','12,368'][k];
 else s=fresh(()=>{const I=pick([R(0,9),R(10,99),R(100,999)]),n=R(k+1,3);let d;do{d=Array.from({length:n},rd).join('');}while(d.at(-1)==='0');const r=Math.random();if(r<.2)d=d.slice(0,k)+'5'+d.slice(k+1);else if(r<.35&&k)d=d.slice(0,k-1)+'9'+d.slice(k);return {n:I+','+d};}).n;

  {q:`Quel est l’arrondi de ${fmt(s)} ${ARR[k]} ?`,a:res,hint:`Si le chiffre des ${nx} vaut 5 ou plus, on prend la valeur par excès. Sinon, on prend la valeur par défaut.`,corr:`Le chiffre des ${nx} est ${c}, ${up?'et '+c+' ≥ 5':'et '+c+' &lt; 5'} : l’arrondi est la valeur approchée par ${up?'excès':'défaut'}, ${fmt(res)}.`}];
 return {n:s,head:`<p>Arrondis ce nombre ${ARR[k]}.</p><p class="big">${fmt(s)}</p>`,tasks,correction:`<p>${fmt(lo)} &lt; ${fmt(s)} &lt; ${fmt(hi)}</p><p>Le chiffre des ${nx} est ${c} ${up?'et '+c+' ≥ 5':'et '+c+' &lt; 5'}, donc l’arrondi est la valeur approchée par ${up?'excès':'défaut'}.</p><p>${box('Arrondi '+ARR[k]+' : '+fmt(res))}</p>`};};}

const AX=[{p:100,lab:10,u:1000},{p:500,lab:2,u:1000},{p:200,lab:5,u:1000},{p:2000,lab:5,u:10000},{p:5000,lab:2,u:10000},{p:10,lab:10,u:100},{p:1000,lab:5,u:5000},{p:50,lab:2,u:100}];

 const free=shuffle([...Array(N+1).keys()].filter(i=>!o.labels.includes(i))).slice(0,npts).sort((a,b)=>a-b);'ABCD'.slice(0,npts).split('').forEach((L,j)=>o.pts[L]=free[j]);return o;}
function pasSteps(o){const L0=V3(o.s0+o.labels[0]*o.p),L1=V3(o.s0+o.labels[1]*o.p),k=o.labels[1]-o.labels[0],diff=V3(k*o.p),p=V3(o.p);
 return {L0,L1,k,diff,p,tasks:[{guide:true,q:`Combien d’intervalles y a-t-il entre la graduation ${fmt(L0)} et la graduation ${fmt(L1)} ?`,a:String(k),hint:'Compte les espaces entre deux traits, pas les traits.',corr:`Il y a ${k} intervalles.`},
  {guide:true,q:`Calcule la différence ${fmt(L1)} − ${fmt(L0)}.`,a:diff,hint:'Soustrais le plus petit nombre au plus grand.',corr:`${fmt(L1)} − ${fmt(L0)} = ${fmt(diff)}.`},
  {guide:true,q:'Quel est le pas, c’est-à-dire la valeur d’un intervalle ?',a:p,hint:`Partage la différence en ${k} intervalles égaux : ${fmt(diff)} ÷ ${k}.`,corr:`${fmt(diff)} ÷ ${k} = ${fmt(p)}. Le pas est ${fmt(p)}.`}],
  lines:[`${fmt(L1)} − ${fmt(L0)} = ${fmt(diff)}`,`${fmt(diff)} ÷ ${k} = ${fmt(p)}, le pas est ${fmt(p)}.`]};}

 const P=pasSteps(o),tasks=[...P.tasks];for(const[L,i]of Object.entries(o.pts))tasks.push({q:`Quelle est l’abscisse du point ${L} ?`,a:ptVal(o,i),hint:'Pars d’une graduation où un nombre est écrit, et ajoute (ou enlève) le pas autant de fois qu’il y a d’intervalles jusqu’au point.',corr:`${L}(${fmt(ptVal(o,i))}).`});
 return {n:V3(o.s0),head:'<p>Lis l’abscisse de chaque point.</p>'+axis(o),tasks,correction:P.lines.map(l=>`<p>${l}</p>`).join('')+`<p>${box(Object.entries(o.pts).map(([L,i])=>`${L}(${fmt(ptVal(o,i))})`).join(' ; '))}</p>`};}
function trouverPas(example){let o;
 if(example)o={N:6,p:1300,s0:3600,labels:[0,4],pts:{A:2,B:6}};
 else{const k=pick([4,5]),p=pick([1700,1500,700,1200,2500,300,600,1100,1300,800,1400]),v0=R(1,20)*100;o={N:k+2,p,s0:v0,labels:[0,k],pts:{A:R(1,k-1),B:k+R(1,2)}};}
 const P=pasSteps(o),tasks=[P.tasks[1],P.tasks[0],{...P.tasks[2],guide:false}];

 const grads=[...Array(o.N+1).keys()].map(i=>fmt(ptVal(o,i))).join(' ; ');

 const P=pasSteps(o),Ls=Object.keys(o.pts),q1=example?'C':pick(Ls),q2=example?'A':pick(Ls.filter(x=>x!==q1)),tasks=[...P.tasks];

/* Mon travail : suivi léger, enregistré dans le navigateur (clé propre à l'app). */
function makeSuivi(app,prefix,modules){
 const KEY=app+'-suivi',B36=n=>Math.max(0,Math.min(1295,n|0)).toString(36).toUpperCase().padStart(2,'0');
 let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
 st.m=st.m||{};st.ds=st.ds||{};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
 const sum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h;};
 const nf=x=>String(x).replace('.',',');
 const fait=(f,r)=>f?`${f} exercice${f>1?'s':''} fait${f>1?'s':''} seul, dont ${r} sans erreur`:'pas commencé';
 function code(){const day=Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);let b=B36(day);
  modules.forEach(([k],i)=>{const r=st.m[k];if(r&&r[0])b+=String(i)+'M'+B36(r[0])+B36(r[1]);});
  Object.keys(st.ds).sort().forEach(s=>{const d=st.ds[s];b+='D'+s+B36(Math.round(d.n*2))+B36(Math.round(d.max*2));});
  return (prefix+b+B36(sum(b))).match(/.{1,6}/g).join('-');}
 function decode(str){const s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');if(!s.startsWith(prefix)||s.length<prefix.length+4)return null;
  const b=s.slice(prefix.length,-2);if(sum(b)!==parseInt(s.slice(-2),36))return null;
  const out={date:new Date(Date.UTC(2026,0,1)+parseInt(b.slice(0,2),36)*864e5),m:{},ds:{}};
  for(let i=2;i+6<=b.length;i+=6){const e=b.slice(i,i+6);
   if(e[0]==='D')out.ds[e[1]]={n:parseInt(e.slice(2,4),36)/2,max:parseInt(e.slice(4,6),36)/2};
   else{const mod=modules[+e[0]];if(!mod||e[1]!=='M')return null;out.m[mod[0]]=[parseInt(e.slice(2,4),36),parseInt(e.slice(4,6),36)];}}
  return out;}
 function table(d){const rows=modules.map(([k,l])=>{const r=d.m[k]||[0,0];return `<tr><td>${l}</td><td>${r[0]?r[0]:'—'}</td><td>${r[0]?r[1]:'—'}</td></tr>`;}).join('');
  const ds=Object.keys(d.ds).sort().map(s=>`Sujet ${s === 'R' ? 'tiré au hasard' : s} : ${nf(d.ds[s].n)} / ${nf(d.ds[s].max)}`).join(' ; ');
  return `<table class="suivi-t"><tr><th>Partie</th><th>Exercices faits seul</th><th>Sans erreur</th></tr>${rows}</table><p>Dernière note provisoire au D.S. blanc : ${ds||'pas encore de D.S. vérifié'}.</p>`;}
 if(!document.getElementById('suivi-css')){const c=document.createElement('style');c.id='suivi-css';c.textContent='.suivi{margin-top:18px}.suivi h2{color:#2f7a45;font-size:1.2rem;line-height:1.3;margin:0 0 .5em}.suivi-st{margin:.2em 0 .6em;font-size:.88rem;color:#5b6478}.suivi-t{border-collapse:collapse;width:100%;margin:.4em 0;font-size:.95rem}.suivi-t th,.suivi-t td{border:1px solid #c9d3ee;padding:.35em .5em;text-align:left}.suivi-t th{background:#f4f6fb;font-weight:700}.suivi-code{display:inline-block;font-family:"STIX Two Text",Cambria,serif;font-size:1.2rem;letter-spacing:.06em;padding:.2em .6em;border:2px dashed #1d3a8a;border-radius:8px;background:#fff;margin:.3em .5em .3em 0}.suivi details{margin-top:.8em}.suivi summary{cursor:pointer;font-weight:700;color:#1d3a8a}.suivi input[type=text]{font:inherit;padding:.4em .6em;border:2px solid #c9d3ee;border-radius:8px;min-width:0;width:16em;max-width:100%}.suivi .suivi-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0}.suivi .suivi-bad{color:#b8322a}';document.head.append(c);}
 return {
  done(mod,first){const r=st.m[mod]||[0,0];r[0]++;if(first)r[1]++;st.m[mod]=r;save();},
  ds(s,n,max){st.ds[s]={n:Math.round(n*2)/2,max};save();},
  status(mod){const r=st.m[mod]||[0,0];return fait(r[0],r[1]);},
  box(){const sec=document.createElement('section');sec.className='card suivi';const c=code();
   sec.innerHTML=`<h2>Mon travail</h2><p>Ce que j’ai fait dans « Je m’entraîne seul », partie par partie, et ma dernière note provisoire au D.S. blanc.</p>${table(st)}

function dsKeep(paper,key){const els=()=>[...paper.querySelectorAll('input,select,textarea')].filter(e=>!['button','hidden','submit'].includes(e.type));
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v))els().forEach((e,i)=>{if(i>=v.length)return;if(e.type==='radio'||e.type==='checkbox')e.checked=!!v[i];else e.value=v[i]==null?'':v[i];});}catch(e){}
 let dead=false;const save=()=>setTimeout(()=>{if(dead)return;try{localStorage.setItem(key,JSON.stringify(els().map(e=>e.type==='radio'||e.type==='checkbox'?e.checked:e.value)));}catch(e){}},0);
 ['input','change','click'].forEach(ev=>paper.addEventListener(ev,save));
 return ()=>{dead=true;try{localStorage.removeItem(key);}catch(e){}};}

function orderInput(t){const w=dom('div','order'),ans=dom('div','order-ans'),pool=dom('div','order-pool');let picked=[],off=false;
 const draw=()=>{ans.innerHTML=picked.length?picked.map(fmt).join(` ${H(t.sym)} `):'<span class="small">Clique sur les nombres dans l’ordre.</span>';pool.querySelectorAll('button').forEach(b=>b.disabled=off||picked.includes(b.dataset.v));};
 for(const x of t.items){const b=button(fmt(x),()=>{picked.push(x);w.classList.remove('bad');draw();},'opt');b.dataset.v=x;pool.append(b);}
 const clr=button('Effacer',()=>{picked=[];draw();},'btn light');w.append(ans,pool,clr);
 Object.defineProperty(w,'value',{get:()=>picked.length===t.items.length?picked.join('|'):''});
 Object.defineProperty(w,'disabled',{get:()=>off,set:v=>{off=!!v;clr.disabled=off;draw();}});
 draw();return w;}
function makeInput(t,label){let input;
 if(t.kind==='order')input=orderInput(t);
 else if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of (t.options.length>2&&!t.keep?shuffle(t.options):t.options))input.append(new Option(o,o));}
 else{input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.spellcheck=false;const k=t.kind||'num';input.placeholder=PH[k]||'Nombre';if(k!=='chain')input.inputMode='decimal';else input.style.width='100%';}
 input.setAttribute('aria-label',label);return input;}

/* Modelage : toutes les étapes, réponse et explication. Pratique guidée : les mêmes étapes, avec l'aide et le tableau.
   Pratique autonome : les étapes intermédiaires (guide) disparaissent. Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul';
 if(alone)parent.append(dom('p','small','Fais le travail sur ton cahier, puis saisis seulement ta réponse.'));
 parent.append(dom('div','exo-head',ex.head));if(ex.table&&!alone)parent.append(dom('div','',ex.table));const box=dom('div','steps');parent.append(box);
 const tasks=alone?ex.tasks.filter(t=>!t.guide):ex.tasks;
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=alone&&t.qAlone?t.qAlone:t.q;const single=tasks.length===1;const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+`<div class="step-q">${q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);
  const input=makeInput(t,'Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   const ok=correct(input.value,t);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Vérifie ton travail, puis fais un deuxième essai.';input.classList.add('bad');return;}
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);
 }
 next();
}

/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f(?!\))|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
