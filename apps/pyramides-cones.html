</style></head><body><div class="wrap"><header><a class="back-home" href="../4e/">← Toutes les applications</a><h1><span>Chapitre 2 : Pyramides et cônes</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours">Cours</button><button type="button" data-page="voc">1. Vocabulaire</button><button type="button" data-page="pat">2. Patrons</button><button type="button" data-page="form">3. Formules</button><button type="button" data-page="pyr">4. Volume d’une pyramide</button><button type="button" data-page="cone">5. Volume d’un cône</button><button type="button" data-page="conv">6. Conversions</button><button type="button" data-page="ds">7. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 4<sup>e</sup></footer></div><template id="course-source"><section data-mod="voc"><h3>1. La pyramide</h3>
<p>Une <b>pyramide</b> est un solide formé d’une <b>base</b>, qui est un polygone, et d’un <b>sommet</b> situé hors du plan de cette base. Ses autres faces sont des triangles : ce sont les <b>faces latérales</b>.</p>
<p>Une <b>arête latérale</b> est un segment qui joint un sommet de la base au sommet de la pyramide.</p>
<p>La <b>hauteur</b> de la pyramide est le segment qui part du sommet et qui est perpendiculaire à la base.</p>
<div data-fig="cours-pyr"></div>
<div class="seyes"><h4>Exemple</h4><p>Le sommet de la pyramide <span class="m">SABCD</span> est le point <span class="m">S</span>.</p><p>Sa base est le quadrilatère <span class="m">ABCD</span>.</p><p>Ses faces latérales sont <span class="m">SAB</span>, <span class="m">SBC</span>, <span class="m">SCD</span> et <span class="m">SDA</span>.</p><p>Ses arêtes latérales sont <span class="m">[SA]</span>, <span class="m">[SB]</span>, <span class="m">[SC]</span> et <span class="m">[SD]</span>.</p><p><span class="m">[SH]</span> est la hauteur de la pyramide.</p></div>
<div class="retenir"><b>Pyramide régulière</b>Une pyramide est régulière quand sa base est un polygone régulier (un triangle équilatéral, un carré…) et que le pied de sa hauteur est le centre de cette base. Ses faces latérales sont alors des triangles isocèles superposables, et ses arêtes latérales ont toutes la même longueur.</div>
<p>Quand la base est un carré, son centre est le point d’intersection des diagonales.</p>
<p>Un <b>tétraèdre régulier</b> est une pyramide dont les quatre faces sont des triangles équilatéraux superposables.</p>
<h3>2. Le cône de révolution</h3>
<p>Un <b>cône de révolution</b> est un solide formé d’un <b>disque de base</b> et d’un <b>sommet</b> situé hors du plan de ce disque.</p>
<p>Sa <b>hauteur</b> est le segment qui joint le sommet au centre du disque de base. Elle est perpendiculaire à la base.</p>
<div data-fig="cours-cone"></div>
<div class="seyes"><h4>Exemple</h4><p>Le cône a pour sommet <span class="m">S</span>.</p><p><span class="m">O</span> est le centre du disque de base.</p><p><span class="m">[OA]</span> est un rayon de la base.</p><p><span class="m">[SO]</span> est la hauteur du cône.</p></div>
<p>Attention : le diamètre est le double du rayon. Si le diamètre mesure 10 cm, le rayon mesure 10 : 2 = 5 cm.</p></section>
<section data-mod="pat"><h3>3. Patron d’une pyramide</h3>
<p>Le <b>patron</b> d’une pyramide est formé de sa base et de ses faces latérales, à plat. Quand on le replie, on obtient la pyramide.</p>
<div data-fig="cours-patron"></div>
<div class="retenir"><b>Pour savoir si une figure est un patron</b><ol><li>On compte les faces : il faut la base et toutes les faces latérales, ni plus ni moins.</li><li>On vérifie que les côtés qui se collent l’un sur l’autre ont la même longueur.</li><li>On replie la figure dans sa tête : deux faces ne doivent pas se superposer.</li></ol></div>
<div class="retenir"><b>Pour construire un patron</b><ol><li>On trace la base en vraie grandeur.</li><li>Sur chaque côté de la base, on trace un triangle. Pour reporter la longueur des arêtes latérales, on utilise le compas : on trace deux arcs de cercle centrés aux extrémités du côté.</li><li>On laisse les traits de construction visibles.</li></ol></div>
<p>Le patron d’un cône est formé d’un disque et d’un secteur de disque. Il n’est pas au programme.</p></section>
<section data-mod="form"><h3>4. Les formules à connaître</h3>
<table class="tab"><tr><th>Figure</th><th>Périmètre</th><th>Aire</th></tr>
<tr><td>Carré de côté <i class="m">c</i></td><td><span class="m">4 × <i class="m">c</i></span></td><td><span class="m"><i class="m">c</i> × <i class="m">c</i></span></td></tr>
<tr><td>Rectangle de longueur <i class="m">L</i> et de largeur <i class="m">l</i></td><td><span class="m">2 × (<i class="m">L</i> + <i class="m">l</i>)</span></td><td><span class="m"><i class="m">L</i> × <i class="m">l</i></span></td></tr>
<tr><td>Triangle</td><td>somme des trois côtés</td><td><span class="frac"><span>base × hauteur</span><span>2</span></span></td></tr>
<tr><td>Cercle et disque de rayon <i class="m">r</i></td><td><span class="m">2 × π × <i class="m">r</i></span></td><td><span class="m">π × <i class="m">r</i> × <i class="m">r</i></span></td></tr></table>
<p>Dans un triangle, la hauteur est la distance entre la base et le troisième sommet.</p>
<p>En 5<sup>e</sup>, on a appris que le volume d’un prisme droit ou d’un cylindre est égal à <span class="m"><i class="m">A</i><sub>base</sub> × <i class="m">h</i></span>. La pyramide et le cône « se rétrécissent » jusqu’à un sommet : on divise par 3.</p>
<div class="retenir"><b>Volumes</b><p><span class="m"><i class="m">V</i><sub>pyramide</sub> = </span><span class="frac"><span><i class="m">A</i><sub>base</sub> × <i class="m">h</i></span><span>3</span></span> et <span class="m"><i class="m">V</i><sub>cône</sub> = </span><span class="frac"><span>π × <i class="m">r</i>² × <i class="m">h</i></span><span>3</span></span></p><p><i class="m">h</i> est la hauteur, <i class="m">r</i> est le rayon de la base.</p></div></section>
<section data-mod="pyr"><h3>5. Volume d’une pyramide</h3>
<ol><li>On calcule l’aire de la base.</li><li>On la multiplie par la hauteur.</li><li>On divise par 3.</li></ol>
<div class="seyes"><h4>Exemple · base rectangle de 5,4 m sur 3,2 m, hauteur 7 m</h4><p><i class="m">A</i><sub>base</sub> = 5,4 × 3,2 = 17,28 m²</p><p><i class="m">V</i> = <span class="frac"><span><i class="m">A</i><sub>base</sub> × <i class="m">h</i></span><span>3</span></span></p><p><i class="m">V</i> = <span class="frac"><span>17,28 × 7</span><span>3</span></span></p><p><i class="m">V</i> = <span class="frac"><span>120,96</span><span>3</span></span></p><p><span class="box"><i class="m">V</i> = 40,32 m³</span></p></div>
<p>Pour retrouver la hauteur quand on connaît le volume, on remplace <i class="m">V</i> et <i class="m">A</i><sub>base</sub> par leurs valeurs, puis on résout l’équation.</p></section>
<section data-mod="cone"><h3>6. Volume d’un cône</h3>
<ol><li>On cherche le rayon. Si l’énoncé donne le diamètre, on le divise par 2.</li><li>On remplace dans la formule. On garde π pour avoir la valeur exacte.</li><li>On arrondit avec la calculatrice, comme demandé.</li></ol>
<div class="seyes"><h4>Exemple · bougie de 7 cm de diamètre et de 9 cm de hauteur</h4><p><i class="m">r</i> = 7 : 2 = 3,5 cm</p><p><i class="m">V</i> = <span class="frac"><span>π × <i class="m">r</i>² × <i class="m">h</i></span><span>3</span></span></p><p><i class="m">V</i> = <span class="frac"><span>π × 3,5² × 9</span><span>3</span></span></p><p><i class="m">V</i> = <span class="frac"><span>π × 12,25 × 9</span><span>3</span></span></p><p><span class="box"><i class="m">V</i> = 36,75π cm³</span></p><p><i class="m">V</i> ≈ 115 cm³</p></div>
<p>Un cône a le même volume qu’un cylindre de même base trois fois moins haut.</p></section>
<section data-mod="conv"><h3>7. Unités de volume et de contenance</h3>
<p>Entre deux unités de volume qui se suivent (m³, dm³, cm³, mm³), on multiplie ou on divise par 1 000. Entre deux unités de contenance qui se suivent (L, dL, cL, mL), on multiplie ou on divise par 10.</p>
<div style="overflow-x:auto"><table class="tab"><tr><th colspan="3">m³</th><th colspan="3">dm³</th><th colspan="3">cm³</th></tr><tr><td></td><td></td><td></td><td>hL</td><td>daL</td><td>L</td><td>dL</td><td>cL</td><td>mL</td></tr></table></div>
<div class="retenir"><b>Trois égalités à connaître</b><p><span class="m">1 m³ = 1 000 L</span> ; <span class="m">1 dm³ = 1 L</span> ; <span class="m">1 cm³ = 1 mL</span></p></div>
<div class="seyes"><h4>Exemples</h4><p>2,5 m³ = 2,5 × 1 000 dm³ = 2 500 dm³</p><p>40 320 cm³ = 40 320 : 1 000 dm³ = 40,32 dm³</p><p>40,32 m³ = 40,32 × 1 000 L = 40 320 L</p><p>21,3 cm³ = 21,3 mL = 0,0213 L</p></div>
<p>Quand on passe à une unité plus petite, le nombre devient plus grand : on multiplie. Quand on passe à une unité plus grande, on divise.</p></section>

/* ---------- 2. Patrons ---------- */
const NETREASON={

 manque:n=>`Il n’y a que ${n} faces : il manque une face latérale. Ce n’est pas un patron.`,
 extra:n=>`Il y a ${n+2} faces, une de trop : en repliant, deux faces se superposent. Ce n’est pas un patron.`,
 cote:(n,c,a)=>`La base est collée sur une arête latérale. Or le côté de la base mesure ${fmt(c)} cm et l’arête latérale mesure ${fmt(a)} cm : ces côtés ne peuvent pas se coller. Ce n’est pas un patron.`
};

   {q:'Combien de faces compte la figure ?',a:faces,guide:true,hint:'Compte tous les polygones de la figure, la base comprise.',corr:`La figure compte ${faces} faces${faces===n+1?', comme la pyramide':faces<n+1?' : il en manque une':' : il y en a une de trop'}.`}];
  if(faces===n+1)tasks.push({q:'Les côtés qui viennent se coller l’un sur l’autre ont-ils la même longueur ?',a:type==='cote'?'non':'oui',options:OUINON,guide:true,hint:'Regarde sur quel côté la base est collée : un côté de la base ou une arête latérale ?',corr:type==='cote'?`Le côté de la base (${fmt(c)} cm) est collé sur une arête latérale (${fmt(a)} cm) : les longueurs sont différentes.`:'Oui. Chaque côté de la base se colle sur la base d’un triangle, et les arêtes latérales se collent deux par deux.'});
  tasks.push({q:'Cette figure est-elle un patron de la pyramide ?',a:ok?'oui':'non',options:OUINON,hint:'Pour être un patron, la figure doit avoir le bon nombre de faces et des côtés de même longueur qui se collent.',corr:NETREASON[type](n,c,a)});
  return {head:`<p>${m(name)} est une pyramide régulière ${n===4?'à base carrée':'dont la base est un triangle équilatéral'}. Le côté de la base mesure ${c} cm et chaque arête latérale mesure ${a} cm.</p>${fig}<p>La figure n’est pas en vraie grandeur. Est-ce un patron de la pyramide ${m(name)} ?</p>`,tasks,correction:lines([`La pyramide a ${n+1} faces et la figure en compte ${faces}.`,NETREASON[type](n,c,a)])};
 }
 let L,l,a;if(example){L=5;l=3;a=6;}else{L=R(4,7);l=R(2,L-1);a=R(L+1,L+3);}
 const base=[V2(0,0),V2(L*SN,0),V2(L*SN,l*SN),V2(0,l*SN)];
 const fig=netFig(4,L,a,'croix',{base,cl:L+' cm',al:a+' cm',label:'Patron obtenu',scale:.8});
 return {head:`<p>On veut construire le patron d’une pyramide dont la base est un rectangle de longueur ${L} cm et de largeur ${l} cm, et dont chaque arête latérale mesure ${a} cm.</p>`,tasks:[
  {q:'Que trace-t-on en premier ?',a:'la base',options:['la base','une face latérale','la hauteur'],hint:'On part de la face qui touche toutes les autres.',corr:`On trace d’abord la base : un rectangle de ${L} cm sur ${l} cm.`},

/* ---------- 3. Formules ---------- */

 perCarre:['le périmètre d’un carré de côté '+im('c'),m(`4 × ${im('c')}`),[m(`${im('c')} × ${im('c')}`),m(`2 × ${im('c')}`),m(`3 × ${im('c')}`)],'On fait le tour : quatre côtés de même longueur.'],

  b=tr?{desc:`un triangle rectangle dont les côtés de l’angle droit mesurent ${p} ${u} et ${q} ${u}`,A:p*q/2,line:`${AB} = ${frac(`${p} × ${q}`,2)} = ${fmt(p*q/2)} ${u}²`,u}
     :{desc:`un triangle de base ${p} ${u} et de hauteur ${q} ${u} (la hauteur du triangle)`,A:p*q/2,line:`${AB} = ${frac(`${p} × ${q}`,2)} = ${fmt(p*q/2)} ${u}²`,u};

  return {head:`<p>Une pyramide a pour base un carré de côté ${c} ${u}. Son volume est égal à ${fmt(V)} ${u}³. Quelle est sa hauteur ?</p>`,tasks:[

 else do{if(level===2){d=R(4,20);r=d/2;}else r=level===3?R(3,9):R(2,9);h=R(3,level===3?25:15);}while(!Number.isInteger(fix(r*r*h*100/3)));

 else{const v=r0(k*Math.PI);tasks.push({q:'Donne l’arrondi du volume au cm³.',a:v,unit:'cm³',hint:`Tape ${fmt(k)} × π sur la calculatrice, puis arrondis à l’unité.`,corr:`${VV} ≈ ${fmt(v)} cm³.`});
  tasks.push({q:'Convertis ce volume arrondi en litres.',a:fix(v/1000),unit:'L',hint:'1 cm³ = 1 mL et 1 L = 1 000 mL : on divise par 1 000.',corr:`${fmt(v)} cm³ = ${fmt(v)} mL = ${fmt(v/1000)} L.`});out.push(`${VV} ≈ ${fmt(v)} cm³`,`${VV} ≈ ${fmt(v)} mL ≈ ${fmt(v/1000)} L`);}
 const fig=coneFig({R:1.5,H:2.8,rLab:d!==null?null:fmt(r)+' cm',hLab:fmt(h)+' cm',label:'Cône et ses dimensions'});
 const head=level===3?`<p>Un récipient a la forme d’un cône de rayon ${fmt(r)} cm et de hauteur ${fmt(h)} cm. Calcule son volume, puis exprime-le en litres.</p>`:`<p>Un cône de révolution a pour base un disque de ${d!==null?'diamètre '+d:'rayon '+fmt(r)} cm. Sa hauteur mesure ${fmt(h)} cm. Calcule la valeur exacte de son volume, puis son arrondi au dixième.</p>`;
 return {head:head+fig,tasks,correction:lines(out)};

const UV=['dam³','m³','dm³','cm³','mm³'],UC=['hL','daL','L','dL','cL','mL'];
function convSimple(units,base,ex){
 let i,j,v,res;
 if(ex){i=units.indexOf(base===1000?'m³':'L');j=i+1;v=3.5;}
 else{do{i=R(0,units.length-1);j=R(0,units.length-1);}while(i===j||Math.abs(i-j)>(base===1000?2:3)||(base===1000&&(i===0||j===0)&&Math.random()<.7));}
 const k=j-i,f=Math.pow(base,Math.abs(k));
 if(!ex){if(k>0)v=R(1,999)/pick([1,10,100]);else{res=R(1,9999)/pick([1,10,100,1000]);v=fix(res*f);}}
 res=fix(k>0?v*f:v/f);
 const u1=units[i],u2=units[j],plus=k>0;
 return {head:`<p>Complète l’égalité : ${m(fmt(v)+' '+u1+' = … '+u2)}.</p>`,tasks:[
  {q:`Le ${u2} est-il une unité plus petite ou plus grande que le ${u1} ?`,a:plus?'plus petite':'plus grande',options:['plus petite','plus grande'],guide:true,hint:`Dans l’ordre ${units.join(', ')}, les unités sont de plus en plus petites.`,corr:plus?`Le ${u2} est plus petit, donc le nombre devient plus grand : on multiplie.`:`Le ${u2} est plus grand, donc le nombre devient plus petit : on divise.`},
  {q:`Par quel nombre faut-il ${plus?'multiplier':'diviser'} ?`,a:f,guide:true,hint:base===1000?'D’une unité de volume à la suivante, on multiplie ou on divise par 1 000.':'D’une unité de contenance à la suivante, on multiplie ou on divise par 10.',corr:`Du ${u1} au ${u2}, il y a ${Math.abs(k)} rang${Math.abs(k)>1?'s':''} : on ${plus?'multiplie':'divise'} par ${fmt(f)}.`},
  {q:`Complète : ${m(fmt(v)+' '+u1+' = … '+u2)}.`,a:res,unit:u2,hint:'Déplace la virgule, en ajoutant des zéros si besoin.',corr:`${m(fmt(v)+' '+u1+' = '+fmt(res)+' '+u2)}.`}],
  correction:lines([m(`${fmt(v)} ${u1} = ${fmt(v)} ${plus?'×':':'} ${fmt(f)} ${u2} = ${fmt(res)} ${u2}`)])};
}
const EQS=['1 dm³ = 1 L','1 cm³ = 1 mL','1 m³ = 1 000 L'];
const MIX=[['cm³','mL',1,1],['mL','cm³',1,1],['dm³','L',1,0],['L','dm³',1,0],['m³','L',1000,2],['L','m³',.001,2],['cm³','L',.001,1],['L','cm³',1000,1]];
function convMix(ex){
 const [u1,u2,f,e]=ex?MIX[4]:pick(MIX);let v;
 if(ex)v=2.4;else if(f===1)v=R(1,999)/pick([1,10]);else if(f>1)v=R(1,99)/pick([1,10,100]);else v=R(50,99999)/pick([1,10]);
 const res=fix(v*f),chain=(u1==='cm³'&&u2==='L')?`${fmt(v)} cm³ = ${fmt(v)} mL = ${fmt(res)} L`:(u1==='L'&&u2==='cm³')?`${fmt(v)} L = ${fmt(res)} mL = ${fmt(res)} cm³`:f===1?`${fmt(v)} ${u1} = ${fmt(res)} ${u2}`:`${fmt(v)} ${u1} = ${fmt(v)} ${f>1?'×':':'} 1 000 ${u2} = ${fmt(res)} ${u2}`;
 return {head:`<p>Complète l’égalité : ${m(fmt(v)+' '+u1+' = … '+u2)}.</p>`,tasks:[
  {q:'Quelle égalité vas-tu utiliser ?',a:EQS[e],options:EQS,guide:true,hint:'Repère l’unité de volume et l’unité de contenance de l’énoncé.',corr:`On utilise ${m(EQS[e])}.`},
  {q:`Complète : ${m(fmt(v)+' '+u1+' = … '+u2)}.`,a:res,unit:u2,hint:f===1?'Les deux unités se correspondent : le nombre ne change pas.':(u1==='cm³'||u2==='cm³')?'Passe par les mL : 1 L = 1 000 mL.':'1 m³ = 1 000 L.',corr:`${m(chain)}.`}],
  correction:lines([m(chain)])};

/* Mon travail : suivi léger, enregistré dans le navigateur (clé propre à l'app).
   On compte les exercices finis dans « Je m'entraîne seul » (et ceux réussis sans erreur),
   et la dernière note provisoire de chaque D.S. blanc. Le code résume ce travail pour le professeur. */
function makeSuivi(app,prefix,modules){
 const KEY=app+'-suivi',B36=n=>Math.max(0,Math.min(1295,n|0)).toString(36).toUpperCase().padStart(2,'0');
 let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
 st.m=st.m||{};st.ds=st.ds||{};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
 const sum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h;};
 const nf=x=>String(x).replace('.',',');
 const fait=(f,r)=>f?`${f} exercice${f>1?'s':''} fait${f>1?'s':''} seul, dont ${r} sans erreur`:'pas commencé';
 function code(){const day=Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);let b=B36(day);
  modules.forEach(([k],i)=>{const r=st.m[k];if(r&&r[0])b+=String(i)+'M'+B36(r[0])+B36(r[1]);});
  Object.keys(st.ds).sort().forEach(s=>{const d=st.ds[s];b+='D'+s+B36(Math.round(d.n*2))+B36(Math.round(d.max*2));});
  return (prefix+b+B36(sum(b))).match(/.{1,6}/g).join('-');}
 function decode(str){const s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');if(!s.startsWith(prefix)||s.length<prefix.length+4)return null;
  const b=s.slice(prefix.length,-2);if(sum(b)!==parseInt(s.slice(-2),36))return null;
  const out={date:new Date(Date.UTC(2026,0,1)+parseInt(b.slice(0,2),36)*864e5),m:{},ds:{}};
  for(let i=2;i+6<=b.length;i+=6){const e=b.slice(i,i+6);
   if(e[0]==='D')out.ds[e[1]]={n:parseInt(e.slice(2,4),36)/2,max:parseInt(e.slice(4,6),36)/2};
   else{const mod=modules[+e[0]];if(!mod||e[1]!=='M')return null;out.m[mod[0]]=[parseInt(e.slice(2,4),36),parseInt(e.slice(4,6),36)];}}
  return out;}
 function table(d){const rows=modules.map(([k,l])=>{const r=d.m[k]||[0,0];return `<tr><td>${l}</td><td>${r[0]?r[0]:'—'}</td><td>${r[0]?r[1]:'—'}</td></tr>`;}).join('');
  const ds=Object.keys(d.ds).sort().map(s=>`Sujet ${s === 'R' ? 'tiré au hasard' : s} : ${nf(d.ds[s].n)} / ${nf(d.ds[s].max)}`).join(' ; ');
  return `<table class="suivi-t"><tr><th>Partie</th><th>Exercices faits seul</th><th>Sans erreur</th></tr>${rows}</table><p>Dernière note provisoire au D.S. blanc : ${ds||'pas encore de D.S. vérifié'}.</p>`;}
 if(!document.getElementById('suivi-css')){const c=document.createElement('style');c.id='suivi-css';c.textContent='.suivi{margin-top:18px}.suivi h2{color:#7a3f98;font-size:1.2rem;line-height:1.3;margin:0 0 .5em}.suivi-st{margin:.2em 0 .6em;font-size:.88rem;color:#5b6478}.suivi-t{border-collapse:collapse;width:100%;margin:.4em 0;font-size:.95rem}.suivi-t th,.suivi-t td{border:1px solid #c9d3ee;padding:.35em .5em;text-align:left}.suivi-t th{background:#f4f6fb;font-weight:700}.suivi-code{display:inline-block;font-family:"STIX Two Text",Cambria,serif;font-size:1.2rem;letter-spacing:.06em;padding:.2em .6em;border:2px dashed #1d3a8a;border-radius:8px;background:#fff;margin:.3em .5em .3em 0}.suivi details{margin-top:.8em}.suivi summary{cursor:pointer;font-weight:700;color:#1d3a8a}.suivi input[type=text]{font:inherit;padding:.4em .6em;border:2px solid #c9d3ee;border-radius:8px;min-width:0;width:16em;max-width:100%}.suivi .suivi-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0}.suivi .suivi-bad{color:#b8322a}';document.head.append(c);}
 return {
  done(mod,first){const r=st.m[mod]||[0,0];r[0]++;if(first)r[1]++;st.m[mod]=r;save();},
  ds(s,n,max){st.ds[s]={n:Math.round(n*2)/2,max};save();},
  status(mod){const r=st.m[mod]||[0,0];return fait(r[0],r[1]);},
  box(){const sec=document.createElement('section');sec.className='card suivi';const c=code();
   sec.innerHTML=`<h2>Mon travail</h2><p>Ce que j’ai fait dans « Je m’entraîne seul », partie par partie, et ma dernière note provisoire au D.S. blanc.</p>${table(st)}
    <p><b>Mon code pour le professeur.</b> Copie-le et envoie-le à ton professeur s’il te le demande.</p>
    <div class="suivi-row"><span class="suivi-code">${c}</span><button type="button" class="btn light" data-s="copy">Copier le code</button></div>
    <details><summary>Espace professeur : lire un code</summary><div class="suivi-row"><input type="text" data-s="in" placeholder="${prefix}…" autocomplete="off" aria-label="Code d’un élève"><button type="button" class="btn" data-s="read">Lire le code</button></div><div data-s="out"></div>
    <p class="suivi-st">Effacer le suivi enregistré sur cet appareil :</p><button type="button" class="btn light" data-s="reset">Tout effacer</button></details>`;
   const $s=k=>sec.querySelector(`[data-s="${k}"]`);
   $s('copy').addEventListener('click',()=>{(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>{$s('copy').textContent='Code copié';}).catch(()=>{const r=document.createRange();r.selectNode(sec.querySelector('.suivi-code'));getSelection().removeAllRanges();getSelection().addRange(r);});});
   $s('read').addEventListener('click',()=>{const d=decode($s('in').value);$s('out').innerHTML=d?`<p>Code créé le ${d.date.toLocaleDateString('fr-FR')}.</p>`+table(d):'<p class="suivi-bad">Ce code n’est pas valide. Vérifiez qu’il a été copié en entier.</p>';});
   let armed=false;$s('reset').addEventListener('click',()=>{if(!armed){armed=true;$s('reset').textContent='Cliquer encore pour tout effacer';return;}st={m:{},ds:{}};save();sec.replaceWith(this.box());});
   return sec;}
 };
}

/* Modelage : toutes les étapes, avec la réponse et l'explication. Pratique guidée : les mêmes étapes, avec l'aide affichée.
   Pratique autonome : les étapes de guidage (guide:true) sont retirées et l'aide n'est pas affichée. Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul',mod=MODULES[VIEW.page];
 if(alone)parent.append(dom('p','small',mod.alone||'Écris les étapes du calcul sur ton cahier, puis saisis seulement ta réponse.'));
 parent.append(dom('div','exo-head',ex.head));const box=dom('div','steps');parent.append(box);
 let tasks=alone?ex.tasks.filter(t=>!t.guide):ex.tasks;if(!tasks.length)tasks=[ex.tasks.at(-1)];
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=alone&&t.qAlone?t.qAlone:t.q;const single=tasks.length===1;const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+`<div class="step-q">${q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);let tries=0;
  const retry=()=>{feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Relis l’énoncé et vérifie, puis fais un deuxième essai.';};
  const finish=ok=>{row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button:not(.opt)').forEach(b=>b.remove());next();}));};
  if(t.rich){area.classList.add('col');for(const o of shuffle(t.options)){const b=dom('button','opt',o);b.type='button';b.dataset.v=String(t.options.indexOf(o));b.addEventListener('click',()=>{const ok=o===t.a;tries++;if(!ok)allFirst=false;if(!ok&&tries<2){b.classList.add('bad');b.disabled=true;retry();return;}area.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v==='0')x.classList.add('good');});finish(ok);});area.append(b);}return;}
  let input;
  if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of (t.options.length>2?shuffle(t.options):t.options))input.append(new Option(o,o));}
  else {input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.inputMode='decimal';input.placeholder='Nombre';}
  input.setAttribute('aria-label','Réponse à l’étape '+step);
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   if(!t.options&&parseNum(input.value)===null){feedback.className='fb warn';feedback.textContent='Écris seulement un nombre, sans l’unité, par exemple 120 ou 2,5.';return;}
   const ok=check(t,input.value);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){retry();input.classList.add('bad');return;}
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;finish(ok);
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input);if(t.unit)area.append(dom('span','unit',t.unit));area.append(valid);
 }
 next();
}

function dsKeep(paper,key){const els=()=>[...paper.querySelectorAll('input,select,textarea')].filter(e=>!['button','hidden','submit'].includes(e.type));
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v))els().forEach((e,i)=>{if(i>=v.length)return;if(e.type==='radio'||e.type==='checkbox')e.checked=!!v[i];else e.value=v[i]==null?'':v[i];});}catch(e){}
 let dead=false;const save=()=>setTimeout(()=>{if(dead)return;try{localStorage.setItem(key,JSON.stringify(els().map(e=>e.type==='radio'||e.type==='checkbox'?e.checked:e.value)));}catch(e){}},0);
 ['input','change','click'].forEach(ev=>paper.addEventListener(ev,save));
 return ()=>{dead=true;try{localStorage.removeItem(key);}catch(e){}};}
function dsNote(n,total){return String(Math.round(n*2)/2).replace('.',',')+' / '+total;}

   controls.push({t,ans,get,fields,w:t.w??ex.pts/ex.items.length});

  const corr=dom('div','seyes ds-corr');corr.hidden=true;corr.innerHTML=`<h4>Correction de l’exercice ${ei+1}</h4>`+ex.items.map((t,qi)=>(ex.items.length>1?`<p><b class="no-math">${LET[qi]})</b></p>`:'')+t.corr).join('');block.append(corr);corrs.push(corr);
 });
 const clear=dsKeep(paper,'pyramides-cones-ds-'+variant);
 const end=button('Vérifier mes résultats et afficher la correction',()=>{let score=0,note=0;setTimeout(()=>SUIVI.ds(variant,note,total));for(const{t,ans,get,fields,w}of controls){const ok=check(t,get());if(ok){score++;note+=w;}fields.forEach(f=>f.disabled=true);if(t.options)ans.querySelectorAll('label').forEach(l=>{if(l.querySelector('input').value===t.a)l.classList.add('good');});ans.append(dom('span',ok?'okm':'kom',ok?' Juste.':' La bonne réponse est '+answer(t)+'.'));}corrs.forEach(c=>c.hidden=false);
  const sum=dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} résultat${score>1?'s':''} juste${score>1?'s':''} sur ${controls.length}).<p>Cette note ne compte que tes résultats. Ta vraie note dépend aussi de ta rédaction : formules écrites, calculs détaillés, unités et justifications. Compare ta feuille avec la correction de chaque exercice.</p>`);sum.append(button('Effacer mes réponses et recommencer',()=>{clear();render();window.scrollTo({top:0});},'btn light'));end.replaceWith(sum);paper.prepend(dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} sur ${controls.length} résultats justes). La correction est sous chaque exercice, et le détail en bas de la page.`));});
 paper.append(end);

/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
