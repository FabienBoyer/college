<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Automatismes – Je m’entraîne pour le brevet</title><link rel="stylesheet" href="../fonts/polices.css"><style>
:root{
  --paper:#fbf8f1; --card:#fffefa; --ink:#1d3a8a; --ink2:#2c4fb5; --red:#b8322a; --margin:#e7a4a0;
  --line:#dbe3f3; --text:#1b2333; --muted:#5b6478;
  --ok:#1f7a4d; --okbg:#e7f5ed; --ko:#b8322a; --kobg:#fcecea; --warn:#7a5200; --warnbg:#fff4d6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#e6ecf7 31px 32px);
  font:17px/1.55 "Atkinson Hyperlegible","STIX Two Text","Segoe UI",system-ui,sans-serif}
.m,.frac,input.rep{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif}
.m{font-size:1.08em;white-space:nowrap}
.m .m{font-size:1em}
.m .tx{font-family:"Atkinson Hyperlegible","STIX Two Text",sans-serif;font-size:.93em;white-space:normal}
i.m{font-family:"STIX Two Text","Cambria Math",Cambria,serif;font-style:italic;font-size:1em}
.m b i.m{font-weight:700}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{padding:26px 0 10px}
header h1{margin:0;color:var(--red);font-size:1.9rem;font-weight:700;letter-spacing:.2px}
header h1 span{border-bottom:2px solid var(--red)}
header p{margin:.35em 0 0;color:var(--muted)}
.back-home{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:0 0 16px;padding:8px 14px;border:2px solid var(--ink);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;text-decoration:none}
.back-home:hover{background:#eef2fb}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;border-bottom:2px solid var(--ink)}
nav button{font:inherit;font-size:.95rem;border:2px solid var(--ink);border-bottom:none;background:#eef2fb;color:var(--ink);padding:.45em .9em;border-radius:10px 10px 0 0;cursor:pointer;margin-bottom:-2px}
nav button.on{background:var(--card);font-weight:700}
nav button:hover{background:#fff}
.navsel{display:none;width:100%;margin-top:14px;font:inherit;padding:.5em;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)}
main{padding:18px 0 40px}
.card{background:var(--card);border:1px solid #e2e6ef;border-radius:4px 14px 14px 4px;padding:22px 24px 26px 34px;position:relative;margin:0 0 16px;
  box-shadow:0 1px 0 rgba(0,0,0,.03),0 6px 18px -12px rgba(29,58,138,.35)}
.card::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--margin)}
h2.ttl{margin:0 0 .6em;color:var(--red);font-size:1.45rem}
h2.ttl span{border-bottom:2px solid var(--red)}
h3{color:var(--ink);margin:1.1em 0 .4em}
.intro{font-style:italic;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid .card{display:flex;flex-direction:column;margin:0}
.grid .card h3{margin:0 0 .3em;color:var(--red);font-size:1.12rem}
.grid .card p{margin:.2em 0 .8em}
.grid .card .bas{margin-top:auto}
.suivi{font-size:.9rem;color:var(--muted);margin:.2em 0 .6em}
.barre{height:8px;border-radius:4px;background:#e6ebf5;overflow:hidden;margin:.2em 0 .7em}
.barre span{display:block;height:100%;background:var(--ok)}
.btn{font:inherit;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:.5em 1.05em;cursor:pointer;margin:.3em .4em .2em 0;min-height:44px}
.btn:hover{background:var(--ink2)}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.levels{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.2em 0 14px}
.levels button{font:inherit;font-size:.95rem;padding:.45em .9em;border-radius:999px;border:2px solid var(--ink2);background:#fff;color:var(--ink2);cursor:pointer;min-height:44px}
.levels button.on{background:var(--ink2);color:#fff}
.levels .nb{font-size:.85em;opacity:.8}
details.rappel{background:#f6f8fe;border:2px solid var(--ink);border-radius:6px;padding:.5em .9em;margin:0 0 16px;color:var(--ink)}
details.rappel>summary{cursor:pointer;font-weight:700;color:var(--red);min-height:32px}
details.rappel[open]>summary{margin-bottom:.4em}
details.rappel ul,details.rappel ol{margin:.3em 0;padding-left:1.3em}
.exo-info{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;color:var(--muted);font-size:.92rem;margin:0 0 .4em}
.exo-info b{color:var(--ink)}
.enonce{margin:.3em 0 .8em;font-size:1.05rem}
.enonce .q{font-weight:700;color:var(--ink)}
.enonce ul,.enonce ol{margin:.3em 0;padding-left:1.4em}
.saisie{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:.4em 0}
input.rep{font-size:1.12em;width:12em;max-width:100%;padding:.35em .5em;border:2px solid #cfd8ea;border-radius:6px;background:#fff;min-height:44px}
input.rep:focus{outline:none;border-color:var(--ink2)}
input.rep.bad{border-color:var(--ko)}
input.rep.good{border-color:var(--ok);background:var(--okbg)}
textarea.rep{font:inherit;width:100%;min-height:4.5em;padding:.4em .6em;border:2px solid #cfd8ea;border-radius:6px;background:#fff}
.unit{color:var(--muted)}
.clavier{display:flex;flex-wrap:wrap;gap:6px;margin:.2em 0 .4em}
.clavier button{font:inherit;font-family:"STIX Two Text",Cambria,serif;font-size:1.1rem;min-width:44px;min-height:40px;border:2px solid #cfd8ea;border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.aide-saisie{font-size:.9rem;color:var(--muted);margin:.1em 0 .3em}
.opt{font:inherit;background:#fff;color:var(--text);border:2px solid #cfd8ea;border-radius:8px;padding:.45em 1.1em;cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--ink2)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.fb{margin:.6em 0;border-radius:6px}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:#123d28;padding:.45em .7em}
.fb.ko{background:var(--kobg);color:#5c1712;padding:.45em .7em}
.fb.warn{background:var(--warnbg);color:#4a3300;padding:.45em .7em}
.corrige{margin:1em 0;border:2px solid var(--ink);border-radius:8px;padding:.7em 1em;background:#fff;color:var(--text);overflow-x:auto}
.corrige h4{margin:0 0 .4em;color:var(--red)}
.corrige ul,.corrige ol{margin:.3em 0;padding-left:1.4em}
.calc{margin:.4em 0 .4em 1em}
.calc p{margin:.15em 0}
.center{text-align:center;margin:.4em 0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.2}
.frac>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
s.cancel{text-decoration-color:var(--red)}
.rad{border-top:1.4px solid currentColor;padding-top:.05em}
table.tab{border-collapse:collapse;margin:.4em 0}
table.tab td{border:1.5px solid var(--ink2);padding:.3em .6em;text-align:center}
.bilan{font-weight:700;color:var(--ink)}
.small{font-size:.9rem;color:var(--muted)}
footer{padding:10px 0 30px;color:var(--muted);font-size:.9rem}
footer button{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:3px}
[hidden]{display:none!important}
@media (max-width:600px){.card{padding:18px 14px 20px 26px}.card::before{left:12px}header h1{font-size:1.5rem}nav{display:none}.navsel{display:block}.calc{margin-left:0}}
</style></head><body><div class="wrap"><header><a class="back-home" href="../">← Toutes les applications</a><h1><span>Automatismes</span></h1><p>Je m’entraîne sur les automatismes du brevet, avec les exercices du livre.</p><nav aria-label="Parties de l’application"></nav><select class="navsel" aria-label="Aller à une partie"></select></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 3<sup>e</sup></footer></div>
<script>
const LIVRE = {"chapitres":[{"id":1,"titre":"Nombres et calculs","court":"Nombres","intro":"Les nombres sont la grammaire des mathématiques. Dans ce chapitre, nous allons consolider tes bases en calcul numérique. Nombres décimaux, fractions, écritures scientifiques ou littérales : ces outils sont indispensables. L’objectif est simple : ne plus jamais bloquer sur un calcul technique pour pouvoir te concentrer sur le raisonnement. Maîtriser ces règles, c’est s’assurer des points faciles et éviter les erreurs d’inattention !","sections":[{"id":"1.1","titre":"Écriture décimale des fractions simples","rappel":"Une fraction est une autre façon de représenter un nombre, sous la forme d’une division de deux entiers. Pour trouver l’écriture décimale d’une fraction <span class=\"m\"><span class=\"frac\"><span><i class=\"m\">a<\/i><\/span><span><i class=\"m\">b<\/i><\/span><\/span><\/span>, il suffit de poser la division de <span class=\"m\"><i class=\"m\">a<\/i><\/span> par <span class=\"m\"><i class=\"m\">b<\/i><\/span> (<span class=\"m\"><i class=\"m\">b<\/i><\/span> étant non nul bien sûr).<br> <b>À mémoriser :<\/b> <div class=\"center\"><span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span> = 0,5<\/span> ; <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0,25<\/span> ; <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> = 0,75<\/span> ; <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>5<\/span><\/span> = 0,2<\/span> ; <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>10<\/span><\/span> = 0,1<\/span>.<\/div> Une fraction comme <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/span> peut être lue comme « cinq demis », ce qui vaut <span class=\"m\">2,5<\/span>.","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.1.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"C’est une fraction de référence à connaître par cœur. La fraction <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span><\/span> correspond à la moitié d’une unité.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.5"}},{"id":"1.1.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span>.<\/span>","corrige":"C’est une fraction de référence à connaître par cœur. La fraction <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span> correspond au quart d’une unité.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,25<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.25"}},{"id":"1.1.3","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> signifie « trois quarts ». On peut la calculer de deux manières : <ul><li>C’est <span class=\"m\">3 × <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span>, donc <span class=\"m\">3 × 0,25 = 0,75<\/span>.<\/li><li>C’est la division de <span class=\"m\">3<\/span> par <span class=\"m\">4<\/span>, qui donne <span class=\"m\">0,75<\/span>.<\/li><\/ul> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,75<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.75"}},{"id":"1.1.4","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>10<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>10<\/span><\/span><\/span> se lit « un dixième ». Le premier chiffre après la virgule étant celui des dixièmes, cela correspond directement au nombre <span class=\"m\">0,1<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>1<\/span><span>10<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,1<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.1"}},{"id":"1.1.5","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>7<\/span><span>1<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>7<\/span><span>1<\/span><\/span><\/span> est simplement la division de <span class=\"m\">7<\/span> par <span class=\"m\">1<\/span>. Diviser un nombre par <span class=\"m\">1<\/span> ne le change pas (et un entier est juste un nombre décimal particulier).<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>7<\/span><span>1<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>7<\/b><\/span>.<\/b>","rep":{"t":"num","v":"7"}},{"id":"1.1.6","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/span> signifie « trois demis ». Comme un demi vaut <span class=\"m\">0,5<\/span>, on calcule : <div class=\"calc\"><p><span class=\"m\">3 × 0,5 = 1,5<\/span><\/p><\/div> <em>(On peut aussi voir que c’est la moitié de <span class=\"m\">3<\/span>.)<\/em><br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>1,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"1.5"}},{"id":"1.1.7","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/span> signifie « cinq demis ». C’est aussi la moitié de <span class=\"m\">5<\/span>. <div class=\"calc\"><p><span class=\"m\">5 ÷ 2 = 2,5<\/span><\/p><\/div> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>2,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"2.5"}},{"id":"1.1.8","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>100<\/span><span>100<\/span><\/span><\/span>.<\/span>","corrige":"Quand le numérateur et le dénominateur d’une fraction sont égaux (et non nuls), la fraction est toujours égale à <span class=\"m\">1<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>100<\/span><span>100<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>1<\/b><\/span>.<\/b>","rep":{"t":"num","v":"1"}},{"id":"1.1.9","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>4<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>4<\/span><span>2<\/span><\/span><\/span> c’est la moitié de <span class=\"m\">4<\/span>. <div class=\"calc\"><p><span class=\"m\">4 ÷ 2 = 2<\/span><\/p><\/div> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>4<\/span><span>2<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>2<\/b><\/span>.<\/b>","rep":{"t":"num","v":"2"}},{"id":"1.1.10","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>5<\/span><\/span><\/span>.<\/span>","corrige":"Pour trouver l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>5<\/span><\/span><\/span>, on peut transformer la fraction pour avoir un dénominateur de <span class=\"m\">10<\/span>. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>2<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>2 × 2<\/span><span>5 × 2<\/span><\/span> = <span class=\"frac\"><span>4<\/span><span>10<\/span><\/span><\/span><\/p><\/div> La fraction « quatre dixièmes » correspond au nombre <span class=\"m\">0,4<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>2<\/span><span>5<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,4<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.4"}},{"id":"1.1.11","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Classer ces nombres par ordre croissant : <span class=\"m\">0,7<\/span> ; <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> ; <span class=\"m\">0,76<\/span>.<\/span>","corrige":"Pour comparer ces nombres, il faut les écrire sous la même forme. Le plus simple est de tout convertir en écriture décimale. <ul><li><span class=\"m\">0,7<\/span> est déjà en écriture décimale.<\/li><li><span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> = 0,75<\/span>.<\/li><li><span class=\"m\">0,76<\/span> est déjà en écriture décimale.<\/li><\/ul> On compare maintenant <span class=\"m\">0,70<\/span>, <span class=\"m\">0,75<\/span> et <span class=\"m\">0,76<\/span>. L’ordre croissant est bien <span class=\"m\">0,7 &lt; 0,75 &lt; 0,76<\/span>.<br> <b>L’ordre correct est <span class=\"m\"><b>0,7 &lt; <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> &lt; 0,76<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.1.12","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Quel est le nombre décimal correspondant à la fraction <span class=\"m\"><span class=\"frac\"><span>9<\/span><span>2<\/span><\/span><\/span> ?<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>9<\/span><span>2<\/span><\/span><\/span> correspond à la division de <span class=\"m\">9<\/span> par <span class=\"m\">2<\/span>. C’est la moitié de <span class=\"m\">9<\/span>. <div class=\"calc\"><p><span class=\"m\">9 ÷ 2 = 4,5<\/span><\/p><\/div> <b>Le nombre décimal correspondant est <span class=\"m\"><b>4,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"4.5"}},{"id":"1.1.13","duree":"1 minute","niveau":2,"enonce":"J’ai mangé les <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> d’une pizza. <span class=\"q\">Quel pourcentage de la pizza ai-je mangé ?<\/span>","corrige":"Il faut convertir la fraction en pourcentage. <ol><li>On passe de la fraction à l’écriture décimale : <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> = 0,75<\/span>.<\/li><li>On multiplie l’écriture décimale par <span class=\"m\">100<\/span> pour obtenir un pourcentage :<br><span class=\"m\">0,75 × 100 = 75%<\/span>.<\/li><\/ol> <b>J’ai mangé <span class=\"m\"><b>75%<\/b><\/span> de la pizza.<\/b>","rep":{"t":"num","v":"75","u":"%"}},{"id":"1.1.14","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">L’égalité <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>4<\/span><\/span> = 1,25<\/span> est-elle vraie ?<\/span>","corrige":"Pour vérifier l’égalité, on peut calculer la valeur de la fraction. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>5<\/span><span>4<\/span><\/span> = 5 ÷ 4 = 1,25<\/span><\/p><\/div> On peut aussi remarquer que:<br> <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>4<\/span><\/span> = <span class=\"frac\"><span>4<\/span><span>4<\/span><\/span> + <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 1 + 0,25 = 1,25<\/span>.<br> <b>Oui, l’égalité est vraie.<\/b>","rep":{"t":"on","v":"Oui"}},{"id":"1.1.15","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span><\/span> se lit « treize dixièmes ». Cela correspond à <span class=\"m\">13 × 0,1 = 1,3<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>1,3<\/b><\/span>.<\/b>","rep":{"t":"num","v":"1.3"}},{"id":"1.1.16","duree":"1 minute","niveau":2,"enonce":"Un gâteau coûte <span class=\"m\">12<\/span>€. <span class=\"q\">Si je paie les <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/span> de ce prix, combien ai-je payé ?<\/span>","corrige":"On doit calculer <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/span> de <span class=\"m\">12<\/span>€. <ol><li>On peut d’abord calculer la valeur de la fraction : <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>2<\/span><\/span> = 1,5<\/span>.<\/li><li>On multiplie ensuite cette valeur par le prix : <span class=\"m\">1,5 × 12 = 18<\/span>.<\/li><\/ol> <b>J’ai payé <span class=\"m\"><b>18<\/b><\/span>€.<\/b>","rep":{"t":"num","v":"18"}},{"id":"1.1.17","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>7<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"La fraction <span class=\"m\"><span class=\"frac\"><span>7<\/span><span>2<\/span><\/span><\/span> correspond à la division de <span class=\"m\">7<\/span> par <span class=\"m\">2<\/span>, c’est-à-dire la moitié de <span class=\"m\">7<\/span>. <div class=\"calc\"><p><span class=\"m\">7 ÷ 2 = 3,5<\/span><\/p><\/div> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>7<\/span><span>2<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>3,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"3.5"}},{"id":"1.1.18","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer la somme <span class=\"m\"><i class=\"m\">A<\/i> = <span class=\"frac\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span> et donner le résultat sous forme décimale.<\/span>","corrige":"Pour calculer cette somme, on peut convertir chaque fraction en nombre décimal avant d’additionner. <ul><li><span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span> = 0,5<\/span>.<\/li><li><span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0,25<\/span>.<\/li><\/ul> On calcule ensuite la somme : <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">A<\/i> = 0,5 + 0,25 = 0,75<\/span><\/p><\/div> <b>Le résultat sous forme décimale est <span class=\"m\"><b>0,75<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.75"}},{"id":"1.1.19","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/span>.<\/span>","corrige":"Pour trouver l’écriture décimale, on peut transformer la fraction pour que son dénominateur soit <span class=\"m\">10<\/span>. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>3 × 2<\/span><span>5 × 2<\/span><\/span> = <span class=\"frac\"><span>6<\/span><span>10<\/span><\/span><\/span><\/p><\/div> La fraction « six dixièmes » s’écrit <span class=\"m\">0,6<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,6<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.6"}},{"id":"1.1.20","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Quel est le plus grand nombre entre <span class=\"m\"><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span><\/span> et <span class=\"m\">1,25<\/span> ?<\/span>","corrige":"Pour comparer les deux nombres, on les met sous la même forme. <ul><li>On convertit la fraction en écriture décimale : <span class=\"m\"><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span> = 1,3<\/span>.<\/li><li>On compare <span class=\"m\">1,3<\/span> et <span class=\"m\">1,25<\/span>.<\/li><\/ul> Le chiffre des dixièmes de <span class=\"m\">1,3<\/span> (qui est <span class=\"m\">3<\/span>) est plus grand que celui de <span class=\"m\">1,25<\/span> (qui est <span class=\"m\">2<\/span>).<br> <b>Le plus grand nombre est <span class=\"m\"><b><span class=\"frac\"><span>13<\/span><span>10<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"frac","v":"13/10","exact":false}},{"id":"1.1.21","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>6<\/span><span>5<\/span><\/span><\/span>.<\/span>","corrige":"On peut transformer la fraction pour avoir un dénominateur égal à <span class=\"m\">10<\/span>. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>6<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>6 × 2<\/span><span>5 × 2<\/span><\/span> = <span class=\"frac\"><span>12<\/span><span>10<\/span><\/span><\/span><\/p><\/div> « Douze dixièmes » s’écrit <span class=\"m\">1,2<\/span>.<br> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>6<\/span><span>5<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>1,2<\/b><\/span>.<\/b>","rep":{"t":"num","v":"1.2"}},{"id":"1.1.22","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">B<\/i> = 3 × <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span> et donner le résultat en écriture décimale.<\/span>","corrige":"Le calcul est une multiplication. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">B<\/i> = 3 × <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>1<\/span><\/span> × <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = <span class=\"frac\"><span>3 × 1<\/span><span>1 × 4<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span><\/p><\/div> On sait que la fraction de référence <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> est égale à <span class=\"m\">0,75<\/span>.<br> <b>Le résultat est <span class=\"m\"><b>0,75<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.75"}},{"id":"1.1.23","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Classer par ordre décroissant : <span class=\"m\">2,6<\/span> ; <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/span> ; <span class=\"m\">2,55<\/span>.<\/span>","corrige":"On convertit tous les nombres en écriture décimale pour pouvoir les comparer. <ul><li><span class=\"m\">2,6<\/span> est déjà sous forme décimale.<\/li><li><span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<\/span><\/span> = 5 ÷ 2 = 2,5<\/span>.<\/li><li><span class=\"m\">2,55<\/span> est déjà sous forme décimale.<\/li><\/ul> On classe les nombres <span class=\"m\">2,6<\/span>, <span class=\"m\">2,5<\/span> et <span class=\"m\">2,55<\/span> par ordre décroissant (du plus grand au plus petit) :<br> <span class=\"m\">2,6 &gt; 2,55 &gt; 2,5<\/span>.<br> <b>L’ordre décroissant est:<br> <span class=\"m\"><b>2,6 &gt; 2,55 &gt; <span class=\"frac\"><span>5<\/span><span>2<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.1.24","duree":"1 minute","niveau":3,"enonce":"<span class=\"q\">Donner l’écriture décimale de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>8<\/span><\/span><\/span>.<\/span>","corrige":"Une méthode simple consiste à voir que <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>8<\/span><\/span><\/span> est la moitié de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span>. <ul><li>On sait que <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0,25<\/span>.<\/li><li>On calcule ensuite la moitié de ce nombre : <span class=\"m\">0,25 ÷ 2 = 0,125<\/span>.<\/li><\/ul> <b>L’écriture décimale de <span class=\"m\"><b><span class=\"frac\"><span>1<\/span><span>8<\/span><\/span><\/b><\/span> est <span class=\"m\"><b>0,125<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.125"}},{"id":"1.1.25","duree":"2 minutes","niveau":3,"enonce":"Une bouteille a une capacité de <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> de litre. <span class=\"q\">Combien de centilitres cela représente-t-il ?<\/span>","corrige":"La question demande une conversion d’unités. <ol><li>On convertit la fraction en nombre décimal :<br> <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span> de litre <span class=\"m\">= 0,75<\/span> L.<\/li><li>On sait que <span class=\"m\">1<\/span> litre est égal à <span class=\"m\">100<\/span> centilitres. Pour convertir des litres en centilitres, on multiplie par <span class=\"m\">100<\/span>.<\/li><\/ol> <div class=\"calc\"><p><span class=\"m\">0,75 × 100 = 75<\/span><\/p><\/div> <b>Cela représente <span class=\"m\"><b>75<\/b><\/span> centilitres.<\/b>","rep":{"t":"num","v":"75"}}]},{"id":"1.2","titre":"Comparer et calculer avec les nombres décimaux","rappel":"<b>Comparer :<\/b> On compare les parties entières. Si elles sont égales, on compare les chiffres après la virgule un par un, de gauche à droite (dixièmes, puis centièmes...).<br> Exemple : <span class=\"m\">12,5 &gt; 12,48<\/span> car le chiffre des dixièmes <span class=\"m\">5<\/span> est plus grand que <span class=\"m\">4<\/span>.<br> <b>Addition/Soustraction :<\/b> On aligne les virgules (et donc les chiffres de même rang) verticalement.<br> <b>Multiplication :<\/b> On effectue l’opération sans tenir compte des virgules, puis on place la virgule dans le résultat pour qu’il ait autant de chiffres après la virgule que le total des chiffres après la virgule dans les nombres de départ.<br> <b>Nombres négatifs :<\/b><br> Comparer deux nombres négatifs revient à comparer leurs distances à zéro : le plus « proche » de zéro est le plus grand.<br> Exemple : <span class=\"m\">−3,1 &gt; −3,2<\/span>.","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.2.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Comparer <span class=\"m\">5,8<\/span> et <span class=\"m\">5,79<\/span>.<\/span>","corrige":"Pour comparer deux nombres décimaux, on regarde d’abord leur partie entière. Ici, les deux nombres ont pour partie entière <span class=\"m\">5<\/span>. On compare donc le premier chiffre après la virgule (le chiffre des dixièmes). <ul><li>Pour <span class=\"m\">5,8<\/span>, le chiffre des dixièmes est <span class=\"m\">8<\/span>.<\/li><li>Pour <span class=\"m\">5,79<\/span>, le chiffre des dixièmes est <span class=\"m\">7<\/span>.<\/li><\/ul> Comme <span class=\"m\">8<\/span> est plus grand que <span class=\"m\">7<\/span>, on en déduit que le premier nombre est plus grand.<br> <b>La comparaison est <span class=\"m\"><b>5,8 &gt; 5,79<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.2.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Comparer <span class=\"m\">−10,2<\/span> et <span class=\"m\">−10,15<\/span>.<\/span>","corrige":"Il s’agit de nombres négatifs. Pour les comparer, on se souvient que le nombre le plus grand est celui qui est le plus proche de zéro. <ul><li>La distance de <span class=\"m\">−10,2<\/span> à zéro est de <span class=\"m\">10,2<\/span>.<\/li><li>La distance de <span class=\"m\">−10,15<\/span> à zéro est de <span class=\"m\">10,15<\/span>.<\/li><\/ul> <span class=\"m\">−10,15<\/span> est donc plus proche de zéro que <span class=\"m\">−10,2<\/span>.<br> <b>La comparaison: <span class=\"m\"><b>−10,15 &gt; −10,2<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.2.3","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">A<\/i> = 2,5 + 3,4<\/span>.<\/span>","corrige":"Il s’agit d’une simple addition de nombres décimaux. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">A<\/i> = 2,5 + 3,4 = 5,9<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">A<\/i> = 5,9<\/b><\/span>.<\/b>","rep":{"t":"num","v":"5.9"}},{"id":"1.2.4","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">B<\/i> = 10,8 − 1,2<\/span>.<\/span>","corrige":"On effectue la soustraction. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">B<\/i> = 10,8 − 1,2 = 9,6<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">B<\/i> = 9,6<\/b><\/span>.<\/b>","rep":{"t":"num","v":"9.6"}},{"id":"1.2.5","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">C<\/i> = 5 − 0,1<\/span>.<\/span>","corrige":"On peut voir <span class=\"m\">5<\/span> comme <span class=\"m\">5,0<\/span> pour faciliter le calcul. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">C<\/i> = 5,0 − 0,1 = 4,9<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">C<\/i> = 4,9<\/b><\/span>.<\/b>","rep":{"t":"num","v":"4.9"}},{"id":"1.2.6","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">D<\/i> = −4,5 + 2,5<\/span>.<\/span>","corrige":"On additionne un nombre négatif et un nombre positif. Le résultat aura le signe du nombre le plus éloigné de zéro (ici <span class=\"m\">−4,5<\/span>), donc le résultat sera négatif.<br> Ensuite, on calcule la différence des distances à zéro : <span class=\"m\">4,5 − 2,5 = 2<\/span>.<br> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">D<\/i> = −2<\/b><\/span>.<\/b>","rep":{"t":"num","v":"-2"}},{"id":"1.2.7","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">E<\/i> = 1,5 × 2<\/span>.<\/span>","corrige":"Le double de <span class=\"m\">1,5<\/span> est <span class=\"m\">3<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">E<\/i> = 1,5 × 2 = 3<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">E<\/i> = 3<\/b><\/span>.<\/b>","rep":{"t":"num","v":"3"}},{"id":"1.2.8","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">F<\/i> = −3 × 1,1<\/span>.<\/span>","corrige":"On multiplie un nombre négatif par un nombre positif, le résultat sera négatif. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">F<\/i> = −3 × 1,1 = −3,3<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">F<\/i> = −3,3<\/b><\/span>.<\/b>","rep":{"t":"num","v":"-3.3"}},{"id":"1.2.9","duree":"1 minute","niveau":1,"enonce":"J’achète une baguette à <span class=\"m\">1,15<\/span>€ et un croissant à <span class=\"m\">1,20<\/span>€. <span class=\"q\">Combien dois-je payer ?<\/span>","corrige":"Pour connaître le total à payer, on additionne le prix des deux articles. <div class=\"calc\"><p><span class=\"m\">1,15€ + 1,20€ = 2,35€<\/span><\/p><\/div> <b>Je dois payer <span class=\"m\"><b>2,35<\/b><\/span>€.<\/b>","rep":{"t":"num","v":"2.35"}},{"id":"1.2.10","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">G<\/i> = −5,8 − 2,2<\/span>.<\/span>","corrige":"On soustrait <span class=\"m\">2,2<\/span> à <span class=\"m\">−5,8<\/span>. Cela revient à additionner deux nombres négatifs. Le résultat sera négatif. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">G<\/i> = −5,8 − 2,2 = −8<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">G<\/i> = −8<\/b><\/span>.<\/b>","rep":{"t":"num","v":"-8"}},{"id":"1.2.11","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">H<\/i> = 12,5 − 4,75<\/span>.<\/span>","corrige":"Pour poser cette soustraction, on aligne bien les virgules. On peut faire apparaître le chiffre des centièmes dans <span class=\"m\">12,5<\/span> pour avoir le même nombre de chiffres après la virgule : <span class=\"m\">12,50 − 4,75<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">H<\/i> = 12,50 − 4,75 = 7,75<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">H<\/i> = 7,75<\/b><\/span>.<\/b>","rep":{"t":"num","v":"7.75"}},{"id":"1.2.12","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">I<\/i> = 2,5 × 0,1<\/span>.<\/span>","corrige":"Multiplier par <span class=\"m\">0,1<\/span> revient diviser par <span class=\"m\">10<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">I<\/i> = 2,5 × 0,1 = 0,25<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">I<\/i> = 0,25<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.25"}},{"id":"1.2.13","duree":"1 minute","niveau":2,"enonce":"Le thermomètre affiche <span class=\"m\">−2,5 °<span class=\"tx\">C<\/span><\/span> le matin. La température augmente de <span class=\"m\">4 °<span class=\"tx\">C<\/span><\/span> dans la journée. <span class=\"q\">Quelle est la température finale ?<\/span>","corrige":"Une augmentation de température correspond à une addition. On part de <span class=\"m\">−2,5 °<span class=\"tx\">C<\/span><\/span> et on ajoute <span class=\"m\">4 °<span class=\"tx\">C<\/span><\/span>. <div class=\"calc\"><p><span class=\"m\">−2,5 + 4 = 1,5<\/span><\/p><\/div> <b>La température finale est de <span class=\"m\"><b>1,5 °<span class=\"tx\">C<\/span><\/b><\/span>.<\/b>","rep":{"t":"num","v":"1.5","u":"°C"}},{"id":"1.2.14","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Classer par ordre croissant : <span class=\"m\">−3,14<\/span> ; <span class=\"m\">−3,09<\/span> ; <span class=\"m\">−3,2<\/span>.<\/span>","corrige":"Pour classer des nombres négatifs par ordre croissant (du plus petit au plus grand), on cherche celui qui est le plus « loin » de zéro (le plus à gauche sur une droite graduée).<br> <span class=\"m\">−3,2<\/span> est le plus petit, suivi de <span class=\"m\">−3,14<\/span>, et enfin <span class=\"m\">−3,09<\/span> qui est le plus proche de zéro.<br> <b>L’ordre est : <span class=\"m\"><b>−3,2 &lt; −3,14 &lt; −3,09<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.2.15","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">J<\/i> = 0,5 × 0,5<\/span>.<\/span>","corrige":"Multiplier <span class=\"m\">0,5<\/span> par <span class=\"m\">0,5<\/span> revient à calculer la moitié de <span class=\"m\">0,5<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">J<\/i> = 0,5 × 0,5 = 0,25<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">J<\/i> = 0,25<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.25"}},{"id":"1.2.16","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">K<\/i> = 10 ÷ 0,5<\/span>.<\/span>","corrige":"Diviser un nombre par <span class=\"m\">0,5<\/span> revient à multiplier ce nombre par <span class=\"m\">2<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">K<\/i> = 10 ÷ 0,5 = 10 × 2 = 20<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">K<\/i> = 20<\/b><\/span>.<\/b>","rep":{"t":"num","v":"20"}},{"id":"1.2.17","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">L<\/i> = (−0,2) × (−10)<\/span>.<\/span>","corrige":"On applique la règle des signes : le produit de deux nombres négatifs est un nombre positif. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">L<\/i> = (−0,2) × (−10) = 2<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">L<\/i> = 2<\/b><\/span>.<\/b>","rep":{"t":"num","v":"2"}},{"id":"1.2.18","duree":"1 minute","niveau":2,"enonce":"Un rectangle a une longueur de <br> <span class=\"m\">4,5<\/span> cm et une largeur de <span class=\"m\">2<\/span> cm. <span class=\"q\">Quelle est son aire ?<\/span>","corrige":"L’aire d’un rectangle se calcule avec la formule : <span class=\"m\"><span class=\"tx\">Longueur<\/span> × <span class=\"tx\">Largeur<\/span><\/span>. <div class=\"calc\"><p><span class=\"m\"><span class=\"tx\">Aire<\/span> = 4,5 × 2 = 9<\/span><\/p><\/div> <b>L’aire est de <span class=\"m\"><b>9 <span class=\"tx\">cm<\/span><sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"num","v":"9","u":"cm²"}},{"id":"1.2.19","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">M<\/i> = 3 × 1,5 + 2 × 0,5<\/span>.<\/span>","corrige":"On respecte la priorité des multiplications avant d’effectuer l’addition. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">M<\/i> = (3 × 1,5) + (2 × 0,5)<\/span><\/p><p><span class=\"m\"><i class=\"m\">M<\/i> = 4,5 + 1<\/span><\/p><p><span class=\"m\"><i class=\"m\">M<\/i> = 5,5<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">M<\/i> = 5,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"5.5"}},{"id":"1.2.20","duree":"1 minute","niveau":2,"enonce":"J’ai <span class=\"m\">20<\/span>€ et j’achète <span class=\"m\">3<\/span> articles à <span class=\"m\">4,50<\/span>€ chacun. <span class=\"q\">Combien me reste-t-il ?<\/span>","corrige":"<ol><li>On calcule le coût total des achats : <span class=\"m\">3 × 4,50<span class=\"tx\">€<\/span> = 13,50<span class=\"tx\">€<\/span><\/span>.<\/li><li>On calcule la monnaie restante : <span class=\"m\">20<span class=\"tx\">€<\/span> − 13,50<span class=\"tx\">€<\/span> = 6,50<span class=\"tx\">€<\/span><\/span>.<\/li><\/ol> <b>Il me reste <span class=\"m\"><b>6,50<\/b><\/span>€.<\/b>","rep":{"t":"num","v":"6.50"}},{"id":"1.2.21","duree":"2 minutes","niveau":2,"enonce":"Un pack de <span class=\"m\">6<\/span> bouteilles d’eau coûte <span class=\"m\">1,80<\/span>€. <span class=\"q\">Quel est le prix d’une bouteille ?<\/span>","corrige":"Pour trouver le prix d’une bouteille, on divise le prix total du pack par le nombre de bouteilles. <div class=\"calc\"><p><span class=\"m\">1,80 ÷ 6 = 0,30<\/span><\/p><\/div> <b>Le prix d’une bouteille est de <span class=\"m\"><b>0,30<\/b><\/span>€.<\/b>","rep":{"t":"num","v":"0.30"}},{"id":"1.2.22","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">N<\/i> = 20 − 3 × 5,5<\/span>.<\/span>","corrige":"On respecte la priorité opératoire : la multiplication est prioritaire sur la soustraction. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">N<\/i> = 20 − 3 × 5,5<\/span><\/p><p><span class=\"m\"><i class=\"m\">N<\/i> = 20 − 16,5<\/span><\/p><p><span class=\"m\"><i class=\"m\">N<\/i> = 3,5<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">N<\/i> = 3,5<\/b><\/span>.<\/b>","rep":{"t":"num","v":"3.5"}},{"id":"1.2.23","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Vrai ou Faux : <span class=\"m\">5,2 × 4,8 &gt; 25<\/span>.<\/span>","corrige":"Pour le savoir, il faut effectuer le calcul. Une astuce est d’estimer : <span class=\"m\">5,2<\/span> est un peu plus que <span class=\"m\">5<\/span> et <span class=\"m\">4,8<\/span> est un peu moins que <span class=\"m\">5<\/span>, le résultat devrait être proche de <span class=\"m\">5 × 5 = 25<\/span>. Calculons précisément : <div class=\"calc\"><p><span class=\"m\">5,2 × 4,8 = 24,96<\/span><\/p><\/div> Ce nombre n’est pas supérieur à <span class=\"m\">25<\/span>.<br> <b>L’affirmation est fausse.<\/b>","rep":{"t":"vf","v":"Faux"}},{"id":"1.2.24","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">P<\/i> = (5,2 − 7,2) × (−3)<\/span>.<\/span>","corrige":"On respecte la priorité des parenthèses. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">P<\/i> = (5,2 − 7,2) × (−3)<\/span><\/p><p><span class=\"m\"><i class=\"m\">P<\/i> = (−2) × (−3)<\/span><\/p><p><span class=\"m\"><i class=\"m\">P<\/i> = 6<\/span><\/p><\/div> Le produit de deux nombres négatifs est positif.<br> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">P<\/i> = 6<\/b><\/span>.<\/b>","rep":{"t":"num","v":"6"}}]},{"id":"1.3","titre":"Simplifier, comparer et calculer avec les fractions","rappel":"<ul><li><b>Simplifier :<\/b> On divise le numérateur et le dénominateur par un même nombre non nul.<br> Exemple : <span class=\"m\"><span class=\"frac\"><span>10<\/span><span>15<\/span><\/span> = <span class=\"frac\"><span>2 × <s class=\"cancel\">5<\/s><\/span><span>3 × <s class=\"cancel\">5<\/s><\/span><\/span> = <span class=\"frac\"><span>2<\/span><span>3<\/span><\/span><\/span>.<\/li><li><b>Comparer :<\/b> On met en général les fractions au même dénominateur, puis on compare leurs numérateurs.<br> Exemple : Comparer <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span><\/span> et <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span>.<br> On choisit le dénominateur commun <span class=\"m\">12<\/span>.<br> <br> On a <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> = <span class=\"frac\"><span>2 × 4<\/span><span>3 × 4<\/span><\/span> = <span class=\"frac\"><span>8<\/span><span>12<\/span><\/span><\/span> et <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> = <span class=\"frac\"><span>3 × 3<\/span><span>4 × 3<\/span><\/span> = <span class=\"frac\"><span>9<\/span><span>12<\/span><\/span><\/span>; donc <span class=\"m\"><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> &gt; <span class=\"frac\"><span>2<\/span><span>3<\/span><\/span><\/span>.<\/li><li><b>Addition/Soustraction :<\/b> On réduit au même dénominateur avant d’opérer sur les numérateurs.<br> Exemple : <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"frac\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>6<\/span><\/span> + <span class=\"frac\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"frac\"><span>5<\/span><span>6<\/span><\/span><\/span>.<\/li><li><b>Multiplication :<\/b> On multiplie les numérateurs entre eux et les dénominateurs entre eux.<br> Exemple : <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> × <span class=\"frac\"><span>4<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>2 × 4<\/span><span>3 × 5<\/span><\/span> = <span class=\"frac\"><span>8<\/span><span>15<\/span><\/span><\/span>.<\/li><li><b>Division :<\/b> Diviser par une fraction revient à multiplier par son inverse.<br> Exemple : <span class=\"m\"><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> ÷ <span class=\"frac\"><span>4<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> × <span class=\"frac\"><span>5<\/span><span>4<\/span><\/span> = <span class=\"frac\"><span>10<\/span><span>12<\/span><\/span> = <span class=\"frac\"><span>5 × <s class=\"cancel\">2<\/s><\/span><span>6 × <s class=\"cancel\">2<\/s><\/span><\/span> = <span class=\"frac\"><span>5<\/span><span>6<\/span><\/span><\/span>.<\/li><\/ul>","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.3.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Simplifier <span class=\"m\"><span class=\"frac\"><span>6<\/span><span>8<\/span><\/span><\/span>.<\/span>","corrige":"Pour simplifier une fraction, on cherche un diviseur commun au numérateur et au dénominateur. Ici, <span class=\"m\">6<\/span> et <span class=\"m\">8<\/span> sont tous les deux divisibles par <span class=\"m\">2<\/span>. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>6<\/span><span>8<\/span><\/span> = <span class=\"frac\"><span>6 ÷ 2<\/span><span>8 ÷ 2<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/span><\/p><\/div> <b>La fraction simplifiée est <span class=\"m\"><b><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"frac","v":"3/4","exact":true}},{"id":"1.3.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>5<\/span><\/span> + <span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/span>.<\/span>","corrige":"Les deux fractions ont déjà le même dénominateur (<span class=\"m\">5<\/span>). On peut donc directement additionner leurs numérateurs. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>1<\/span><span>5<\/span><\/span> + <span class=\"frac\"><span>3<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>1 + 3<\/span><span>5<\/span><\/span> = <span class=\"frac\"><span>4<\/span><span>5<\/span><\/span><\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><span class=\"frac\"><span>4<\/span><span>5<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"frac","v":"4/5","exact":false}},{"id":"1.3.3","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><span class=\"frac\"><span>7<\/span><span>9<\/span><\/span> − <span class=\"frac\"><span>2<\/span><span>9<\/span><\/span><\/span>.<\/span>","corrige":"Les deux fractions ont le même dénominateur (<span class=\"m\">9<\/span>). On peut donc soustraire leurs numérateurs. <div class=\"calc\"><p><span class=\"m\"><span class=\"frac\"><span>7<\/span><span>9<\/span><\/span> − <span class=\"frac\"><span>2<\/span><span>9<\/span><\/span> = <span class=\"frac\"><span>7 − 2<\/span><span>9<\/span><\/span> = <span class=\"frac\"><span>5<\/span><span>9<\/span><\/span><\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><span class=\"frac\"><span>5<\/span><span>9<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"frac","v":"5/9","exact":false}},{"id":"1.3.4","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/span>.<\/span>"," n sait que <span class=\"m\">7<sup>2<\/sup> = 49<\/span>.<br> <b>Le nombre cherché est <span class=\"m\"><b>7<\/b><\/span>.<\/b>","rep":{"t":"num","v":"7"}},{"id":"1.6.14","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Quel est le nombre (positif) dont le carré est <span class=\"m\">100<\/span> ?<\/span>","corrige":"On cherche quel nombre positif élevé au carré donne <span class=\"m\">100<\/span>.<br> On sait que <span class=\"m\">10<sup>2<\/sup> = 10 × 10 = 100<\/span>.<br> <b>Le nombre est <span class=\"m\"><b>10<\/b><\/span>.<\/b>","rep":{"t":"num","v":"10"}},{"id":"1.6.15","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\">3<sup>2<\/sup> + 4<sup>2<\/sup><\/span>.<\/span>","corrige":"On respecte la priorité des opérations : les puissances (carrés) sont calculées avant l’addition. <div class=\"calc\"><p><span class=\"m\">3<sup>2<\/sup> + 4<sup>2<\/sup> = 9 + 16<\/span><\/p><p><span class=\"m\">= 25<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b>25<\/b><\/span>.<\/b>","rep":{"t":"num","v":"25"}},{"id":"1.6.16","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Vrai ou Faux : <span class=\"m\">1<sup>2<\/sup> + 2<sup>2<\/sup> = 3<sup>2<\/sup><\/span>.<\/span>","corrige":"Pour le vérifier, on calcule chaque côté de l’égalité. <ul><li>Membre de gauche : <span class=\"m\">1<sup>2<\/sup> + 2<sup>2<\/sup> = 1 + 4 = 5<\/span>.<\/li><li>Membre de droite : <span class=\"m\">3<sup>2<\/sup> = 9<\/span>.<\/li><\/ul> Comme <span class=\"m\">5 ≠ 9<\/span>, l’affirmation est fausse.<br> <b>L’affirmation est fausse.<\/b>","rep":{"t":"vf","v":"Faux"}},{"id":"1.6.17","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Quelle est l’aire d’une pièce carrée de <span class=\"m\">8<\/span> mètres de côté ?<\/span>","corrige":"La formule de l’aire d’un carré de côté <span class=\"m\"><i class=\"m\">c<\/i><\/span> est <span class=\"m\"><i class=\"m\">c<\/i><sup>2<\/sup><\/span>.<br> Ici, le côté mesure <span class=\"m\">8<\/span> mètres. On calcule donc l’aire : <div class=\"calc\"><p><span class=\"m\">8<sup>2<\/sup> = 8 × 8 = 64<\/span><\/p><\/div> <b>L’aire de la pièce est de <span class=\"m\"><b>64 <span class=\"tx\">m<\/span><sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"num","v":"64","u":"m²"}},{"id":"1.6.18","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\">10<sup>2<\/sup> − 6<sup>2<\/sup><\/span>.<\/span>","corrige":"On calcule d’abord les carrés, qui sont prioritaires sur la soustraction. <div class=\"calc\"><p><span class=\"m\">10<sup>2<\/sup> − 6<sup>2<\/sup> = 100 − 36<\/span><\/p><p><span class=\"m\">= 64<\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b>64<\/b><\/span>.<\/b>","rep":{"t":"num","v":"64"}},{"id":"1.6.19","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Quel est le carré de <span class=\"m\">0<\/span> ?<\/span>","corrige":"Le carré de <span class=\"m\">0<\/span> se note <span class=\"m\">0<sup>2<\/sup><\/span>.<br> C’est le résultat de <span class=\"m\">0 × 0 = 0<\/span>.<br> <b>Le carré de <span class=\"m\"><b>0<\/b><\/span> est <span class=\"m\"><b>0<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0"}},{"id":"1.6.20","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\">(−5)<sup>2<\/sup><\/span>.<\/span>","corrige":"Les parenthèses indiquent que le carré s’applique à l’ensemble du nombre <span class=\"m\">−5<\/span>. Le calcul est donc : <div class=\"calc\"><p><span class=\"m\">(−5)<sup>2<\/sup> = (−5) × (−5)<\/span><\/p><\/div> Le produit de deux nombres négatifs est positif.<br> <b>Le résultat est <span class=\"m\"><b>25<\/b><\/span>.<\/b>","rep":{"t":"num","v":"25"}},{"id":"1.6.21","duree":"2 minutes","niveau":3,"enonce":"Un triangle rectangle a ses côtés de l’angle droit qui mesurent <span class=\"m\">9<\/span> cm et <span class=\"m\">12<\/span> cm. <span class=\"q\">Quelle est l’aire d’un carré construit sur son hypoténuse ?<\/span>","corrige":"On nous demande de calculer le carré de la longueur de l’hypoténuse.<br> D’après le théorème de Pythagore dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés. <div class=\"calc\"><p><span class=\"m\"><span class=\"tx\">hypoténuse<\/span><sup>2<\/sup> = 9<sup>2<\/sup> + 12<sup>2<\/sup><\/span><\/p><p><span class=\"m\">= 81 + 144<\/span><\/p><p><span class=\"m\">= 225<\/span><\/p><\/div> <b>L’aire du carré construit sur l’hypoténuse est de <span class=\"m\"><b>225 <span class=\"tx\">cm<\/span><sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"num","v":"225","u":"cm²"}},{"id":"1.6.22","duree":"1 minute","niveau":3,"enonce":"<span class=\"q\">Quel est l’entier dont le carré est le plus proche de <span class=\"m\">70<\/span> ?<\/span>","corrige":"On récite la liste des carrés pour encadrer <span class=\"m\">70<\/span> : <span class=\"m\">8<sup>2<\/sup> = 64<\/span> et <span class=\"m\">9<sup>2<\/sup> = 81<\/span>.<br> On calcule la distance de <span class=\"m\">70<\/span> à chacun de ces carrés : <ul><li><span class=\"m\">70 − 64 = 6<\/span><\/li><li><span class=\"m\">81 − 70 = 11<\/span><\/li><\/ul> La valeur <span class=\"m\">70<\/span> est plus proche de <span class=\"m\">64<\/span>. <b>L’entier cherché est <span class=\"m\"><b>8<\/b><\/span>.<\/b>","rep":{"t":"num","v":"8"}},{"id":"1.6.23","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">La somme de deux carrés est-elle toujours un carré ? Justifier avec un exemple.<\/span>","corrige":"Non, la somme de deux carrés parfaits n’est pas toujours un carré d’un entier. Pour le justifier, il suffit de fournir un contre-exemple. Prenons <span class=\"m\">2<sup>2<\/sup><\/span> et <span class=\"m\">3<sup>2<\/sup><\/span> : <div class=\"calc\"><p><span class=\"m\">2<sup>2<\/sup> + 3<sup>2<\/sup> = 4 + 9 = 13<\/span><\/p><\/div> Le nombre <span class=\"m\">13<\/span> n’est pas le carré d’un nombre entier.<br> <b>L’affirmation est fausse.<\/b>","rep":{"t":"self"}},{"id":"1.6.24","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Calculer la différence entre le carré de <span class=\"m\">12<\/span> et le carré de <span class=\"m\">11<\/span>.<\/span>","corrige":"On calcule chaque carré, puis on effectue la soustraction. <div class=\"calc\"><p><span class=\"m\">12<sup>2<\/sup> − 11<sup>2<\/sup> = 144 − 121<\/span><\/p><p><span class=\"m\">= 23<\/span><\/p><\/div> <b>La différence est de <span class=\"m\"><b>23<\/b><\/span>.<\/b>","rep":{"t":"num","v":"23"}},{"id":"1.6.25","duree":"2 minutes","niveau":3,"enonce":"Un carré a une aire de <span class=\"m\">81 <span class=\"tx\">cm<\/span><sup>2<\/sup><\/span>. <span class=\"q\">Quel est son périmètre ?<\/span>","corrige":"Le problème se résout en deux étapes. <ol><li><b>Trouver la longueur du côté :<\/b> Si l’aire du carré est <span class=\"m\">81 <span class=\"tx\">cm<\/span><sup>2<\/sup><\/span>, on cherche le nombre positif qui, élevé au carré, donne <span class=\"m\">81<\/span>.<br> Ce nombre est <span class=\"m\">9<\/span>.<br> Le côté du carré mesure donc <span class=\"m\">9<\/span> cm.<\/li><li><b>Calculer le périmètre :<\/b> Le périmètre d’un carré de côté <span class=\"m\"><i class=\"m\">c<\/i><\/span> est <span class=\"m\">4 × <i class=\"m\">c<\/i><\/span>. <div class=\"calc\"><p><span class=\"m\">4 × 9<span class=\"tx\">cm<\/span> = 36<span class=\"tx\">cm<\/span><\/span><\/p><\/div><\/li><\/ol> <b>Le périmètre est de <span class=\"m\"><b>36<\/b><\/span> cm.<\/b>","rep":{"t":"num","v":"36"}}]},{"id":"1.7","titre":"Notation scientifique","rappel":"L’écriture scientifique d’un nombre positif est une façon de l’écrire sous la forme <span class=\"m\"><i class=\"m\">a<\/i> × 10<sup><i class=\"m\">n<\/i><\/sup><\/span>, où : <ul><li><span class=\"m\"><i class=\"m\">a<\/i><\/span> est un nombre décimal tel que <span class=\"m\">1 ≤ <i class=\"m\">a<\/i> &lt; 10<\/span>.<\/li><li><span class=\"m\"><i class=\"m\">n<\/i><\/span> est un nombre entier (positif ou négatif).<\/li><\/ul> <b>Pour les grands nombres (<span class=\"m\">&gt; 10<\/span>):<\/b> On « déplace » la virgule vers la gauche. L’exposant <span class=\"m\"><i class=\"m\">n<\/i><\/span> est positif et correspond au nombre de crans de décalage.<br> Exemple : <span class=\"m\">543 000 = 5,43 × 10<sup>5<\/sup><\/span>.<br> <b>Pour les petits nombres (<span class=\"m\">&lt; 1<\/span>):<\/b> On « déplace » la virgule vers la droite. L’exposant <span class=\"m\"><i class=\"m\">n<\/i><\/span> est négatif et correspond au nombre de crans de décalage.<br> Exemple : <span class=\"m\">0,0021 = 2,1 × 10<sup>−3<\/sup><\/span>.","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.7.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">5 000<\/span>.<\/span>","corrige":"Pour <span class=\"m\">5 000<\/span>, on place la virgule après le premier chiffre non nul, ce qui donne <span class=\"m\">5<\/span>.<br> Pour passer de <span class=\"m\">5<\/span> à <span class=\"m\">5 000<\/span>, on doit décaler la virgule de <span class=\"m\">3<\/span> rangs vers la droite.<br> L’exposant est donc positif.<br> <b>La notation scientifique est <span class=\"m\"><b>5 × 10<sup>3<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"5","e":3}},{"id":"1.7.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">0,07<\/span>.<\/span>","corrige":"Pour <span class=\"m\">0,07<\/span>, on place la virgule après le premier chiffre non nul, ce qui donne <span class=\"m\">7<\/span>.<br> Pour passer de <span class=\"m\">7<\/span> à <span class=\"m\">0,07<\/span>, on doit décaler la virgule de <span class=\"m\">2<\/span> rangs vers la gauche.<br> L’exposant est donc négatif.<br> <b>La notation scientifique est <span class=\"m\"><b>7 × 10<sup>−2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"7","e":-2}},{"id":"1.7.3","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">123 000<\/span>.<\/span>","corrige":"On place la virgule après le <span class=\"m\">1<\/span> pour avoir <span class=\"m\">1,23<\/span>.<br> Pour passer de <span class=\"m\">1,23<\/span> à <span class=\"m\">123 000<\/span>, on décale la virgule de <span class=\"m\">5<\/span> rangs vers la droite.<br> L’exposant est donc <span class=\"m\">+ 5<\/span>.<br> <b>La notation scientifique est <span class=\"m\"><b>1,23 × 10<sup>5<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"1.23","e":5}},{"id":"1.7.4","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">0,0045<\/span>.<\/span>","corrige":"On place la virgule après le <span class=\"m\">4<\/span> pour avoir <span class=\"m\">4,5<\/span>.<br> Pour passer de <span class=\"m\">4,5<\/span> à <span class=\"m\">0,0045<\/span>, on décale la virgule de <span class=\"m\">3<\/span> rangs vers la gauche.<br> L’exposant est donc <span class=\"m\">−3<\/span>.<br> <b>La notation scientifique est <span class=\"m\"><b>4,5 × 10<sup>−3<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"4.5","e":-3}},{"id":"1.7.5","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de<br> <span class=\"m\">3,5 × 10<sup>4<\/sup><\/span>.<\/span>","corrige":"L’exposant est positif (<span class=\"m\">+ 4<\/span>), il faut donc décaler la virgule de <span class=\"m\">4<\/span> rangs vers la droite.<br> En partant de <span class=\"m\">3,5<\/span>, on obtient <span class=\"m\">35 000<\/span>.<br> <b>L’écriture décimale est <span class=\"m\"><b>35 000<\/b><\/span>.<\/b>","rep":{"t":"num","v":"35000"}},{"id":"1.7.6","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de<br> <span class=\"m\">8,1 × 10<sup>−2<\/sup><\/span>.<\/span>","corrige":"L’exposant est négatif (<span class=\"m\">−2<\/span>), il faut donc décaler la virgule de <span class=\"m\">2<\/span> rangs vers la gauche.<br> En partant de <span class=\"m\">8,1<\/span>, on obtient <span class=\"m\">0,081<\/span>.<br> <b>L’écriture décimale est <span class=\"m\"><b>0,081<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.081"}},{"id":"1.7.7","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner la notation scientifique de<br> <span class=\"m\">9<\/span> millions.<\/span>","corrige":"<span class=\"m\">9<\/span> millions s’écrit <span class=\"m\">9 000 000<\/span>.<br> On place la virgule après le <span class=\"m\">9<\/span>.<br> Pour revenir à <span class=\"m\">9 000 000<\/span>, il faut décaler la virgule de <span class=\"m\">6<\/span> rangs vers la droite.<br> <b>La notation scientifique est <span class=\"m\"><b>9 × 10<sup>6<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"9","e":6}},{"id":"1.7.8","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Donner l’écriture décimale de<br> <span class=\"m\">1,05 × 10<sup>6<\/sup><\/span>.<\/span>","corrige":"L’exposant est <span class=\"m\">+ 6<\/span>. <br> On décale la virgule de <span class=\"m\">6<\/span> rangs vers la droite à partir de <span class=\"m\">1,05<\/span>.<br> <b>L’écriture décimale est <span class=\"m\"><b>1 050 000<\/b><\/span>.<\/b>","rep":{"t":"num","v":"1050000"}},{"id":"1.7.9","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">450 × 10<sup>2<\/sup><\/span>.<\/span>","corrige":"L’expression n’est pas en notation scientifique car <span class=\"m\">450<\/span> n’est pas compris entre <span class=\"m\">1<\/span> et <span class=\"m\">10<\/span>. <ol><li>On écrit <span class=\"m\">450<\/span> en notation scientifique :<br> <span class=\"m\">450 = 4,5 × 10<sup>2<\/sup><\/span>.<\/li><li>L’expression devient :<br> <span class=\"m\">(4,5 × 10<sup>2<\/sup>) × 10<sup>2<\/sup><\/span>.<\/li><li>On additionne les exposants des puissances de <span class=\"m\">10<\/span> :<br> <span class=\"m\">10<sup>2<\/sup> × 10<sup>2<\/sup> = 10<sup>2 + 2<\/sup> = 10<sup>4<\/sup><\/span>.<\/li><\/ol> <b>Le résultat final est <span class=\"m\"><b>4,5 × 10<sup>4<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"4.5","e":4}},{"id":"1.7.10","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">0,19 × 10<sup>−3<\/sup><\/span>.<\/span>","corrige":"L’expression n’est pas en notation scientifique car <span class=\"m\">0,19<\/span> n’est pas compris entre <span class=\"m\">1<\/span> et <span class=\"m\">10<\/span>. <ol><li>On écrit <span class=\"m\">0,19<\/span> en notation scientifique :<br> <span class=\"m\">0,19 = 1,9 × 10<sup>−1<\/sup><\/span>.<\/li><li>L’expression devient :<br> <span class=\"m\">(1,9 × 10<sup>−1<\/sup>) × 10<sup>−3<\/sup><\/span>.<\/li><li>On additionne les exposants :<br> <span class=\"m\">10<sup>−1<\/sup> × 10<sup>−3<\/sup> = 10<sup>−1 − 3<\/sup> = 10<sup>−4<\/sup><\/span>.<\/li><\/ol> <b>Le résultat final est <span class=\"m\"><b>1,9 × 10<sup>−4<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"1.9","e":-4}},{"id":"1.7.11","duree":"1 minute","niveau":2,"enonce":"La distance Terre-Lune est d’environ <span class=\"m\">384 000 <span class=\"tx\">km<\/span><\/span>. <span class=\"q\">Donner cette distance en notation scientifique.<\/span>","corrige":"On doit écrire <span class=\"m\">384 000<\/span> en notation scientifique.<br> On place la virgule après le premier chiffre non nul, le <span class=\"m\">3<\/span>, ce qui donne <span class=\"m\">3,84<\/span>.<br> Pour passer de <span class=\"m\">3,84<\/span> à <span class=\"m\">384 000<\/span>, on décale la virgule de <span class=\"m\">5<\/span> rangs vers la droite.<br> <b>La distance est de <span class=\"m\"><b>3,84 × 10<sup>5<\/sup> <span class=\"tx\">km<\/span><\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.7.12","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Vrai ou Faux : <span class=\"m\">0,0005 = 5 × 10<sup>4<\/sup><\/span>.<\/span>","corrige":"La notation scientifique de <span class=\"m\">0,0005<\/span> est <span class=\"m\">5 × 10<sup>−4<\/sup><\/span> (car il faut décaler la virgule de <span class=\"m\">4<\/span> rangs vers la gauche pour passer de <span class=\"m\">5<\/span> à <span class=\"m\">0,0005<\/span>).<br> L’exposant proposé est <span class=\"m\">4<\/span> au lieu de <span class=\"m\">−4<\/span>.<br> <b>L’affirmation est fausse.<\/b>","rep":{"t":"vf","v":"Faux"}},{"id":"1.7.13","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">A<\/i> = (2 × 10<sup>4<\/sup>) × (3 × 10<sup>5<\/sup>)<\/span> et donner le résultat en notation scientifique.<\/span>","corrige":"On regroupe les nombres d’un côté et les puissances de <span class=\"m\">10<\/span> de l’autre. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">A<\/i> = (2 × 3) × (10<sup>4<\/sup> × 10<sup>5<\/sup>)<\/span><\/p><p><span class=\"m\"><i class=\"m\">A<\/i> = 6 × 10<sup>4 + 5<\/sup><\/span><\/p><p><span class=\"m\"><i class=\"m\">A<\/i> = 6 × 10<sup>9<\/sup><\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">A<\/i> = 6 × 10<sup>9<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"6","e":9}},{"id":"1.7.14","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Classer par ordre croissant : <span class=\"m\">5,2 × 10<sup>3<\/sup><\/span> ; <span class=\"m\">52,1 × 10<sup>2<\/sup><\/span> ; <span class=\"m\">0,5 × 10<sup>4<\/sup><\/span>.<\/span>","corrige":"Pour comparer, on écrit tous les nombres avec la même puissance de <span class=\"m\">10<\/span>, par exemple <span class=\"m\">10<sup>3<\/sup><\/span>. <ul><li><span class=\"m\">5,2 × 10<sup>3<\/sup><\/span> (déjà sous la bonne forme).<\/li><li><span class=\"m\">52,1 × 10<sup>2<\/sup> = 5,21 × 10<sup>1<\/sup> × 10<sup>2<\/sup> = 5,21 × 10<sup>3<\/sup><\/span>.<\/li><li><span class=\"m\">0,5 × 10<sup>4<\/sup> = 5 × 10<sup>−1<\/sup> × 10<sup>4<\/sup> = 5 × 10<sup>3<\/sup><\/span>.<\/li><\/ul> Il suffit maintenant de comparer les nombres : <span class=\"m\">5 &lt; 5,2 &lt; 5,21<\/span>.<br> <b>L’ordre croissant est :<br> <span class=\"m\"><b>0,5 × 10<sup>4<\/sup> &lt; 5,2 × 10<sup>3<\/sup> &lt; 52,1 × 10<sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.7.15","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">205 × 10<sup>−5<\/sup><\/span>.<\/span>","corrige":"<ol><li>On convertit d’abord <span class=\"m\">205<\/span> en écriture scientifique :<br> <span class=\"m\">2,05 × 10<sup>2<\/sup><\/span>.<\/li><li>L’expression devient :<br> <span class=\"m\">(2,05 × 10<sup>2<\/sup>) × 10<sup>−5<\/sup><\/span>.<\/li><li>On additionne les exposants :<br> <span class=\"m\">10<sup>2 + (−5)<\/sup> = 10<sup>−3<\/sup><\/span>.<\/li><\/ol> <b>Le résultat est <span class=\"m\"><b>2,05 × 10<sup>−3<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"2.05","e":-3}},{"id":"1.7.16","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">B<\/i> = <span class=\"frac\"><span>8 × 10<sup>7<\/sup><\/span><span>4 × 10<sup>3<\/sup><\/span><\/span><\/span> en notation scientifique.<\/span>","corrige":"On sépare le calcul des nombres et celui des puissances de <span class=\"m\">10<\/span>. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">B<\/i> = <span class=\"frac\"><span>8<\/span><span>4<\/span><\/span> × <span class=\"frac\"><span>10<sup>7<\/sup><\/span><span>10<sup>3<\/sup><\/span><\/span> = 2 × 10<sup>7 − 3<\/sup> = 2 × 10<sup>4<\/sup><\/span><\/p><\/div> <b>Le résultat est <span class=\"m\"><b><i class=\"m\">B<\/i> = 2 × 10<sup>4<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"2","e":4}},{"id":"1.7.17","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\">245,8<\/span>.<\/span>","corrige":"On place la virgule après le premier chiffre, le <span class=\"m\">2<\/span>, pour obtenir <span class=\"m\">2,458<\/span>.<br> Pour passer de <span class=\"m\">2,458<\/span> à <span class=\"m\">245,8<\/span>, on décale la virgule de <span class=\"m\">2<\/span> rangs vers la droite.<br> L’exposant est donc <span class=\"m\">+ 2<\/span>.<br> <b>La notation scientifique est <span class=\"m\"><b>2,458 × 10<sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"sci","m":"2.458","e":2}},{"id":"1.7.18","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Donner l’écriture décimale de<br> <span class=\"m\">7,02 × 10<sup>−5<\/sup><\/span>.<\/span>","corrige":"L’exposant est négatif (<span class=\"m\">−5<\/span>), on doit donc décaler la virgule de <span class=\"m\">5<\/span> rangs vers la gauche.<br> En partant de <span class=\"m\">7,02<\/span>, on ajoute des zéros si nécessaire.<br> <b>L’écriture décimale est <span class=\"m\"><b>0,000 070 2<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.0000702"}},{"id":"1.7.19","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Calculer <span class=\"m\"><i class=\"m\">C<\/i> = 2 × 10<sup>−3<\/sup> + 5 × 10<sup>−2<\/sup><\/span>. Donner le résultat en écriture décimale.<\/span>","corrige":"Pour additionner, on ne peut pas opérer directement sur les puissances. On doit d’abord passer à l’écriture décimale. <ul><li><span class=\"m\">2 × 10<sup>−3<\/sup> = 0,002<\/span>.<\/li><li><span class=\"m\">5 × 10<sup>−2<\/sup> = 0,05<\/span>.<\/li><\/ul> On additionne ensuite les deux nombres. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">C<\/i> = 0,002 + 0,05 = 0,052<\/span><\/p><\/div> <b>Le résultat en écriture décimale est <span class=\"m\"><b>0,052<\/b><\/span>.<\/b>","rep":{"t":"num","v":"0.052"}},{"id":"1.7.20","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Donner la notation scientifique de <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span>.<\/span>","corrige":"<ol><li>On écrit <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span><\/span> sous sa forme décimale : <span class=\"m\"><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0,25<\/span>.<\/li><li>On met <span class=\"m\">0,25<\ ;53;59;61;67;71;73;79;83;89;97<\/span><\/div> <b>Décomposition en Produit de Facteurs Premiers :<\/b> Tout nombre entier supérieur ou égal à <span class=\"m\">2<\/span> est soit premier, soit peut s’écrire de manière unique (à l’ordre des facteurs) comme un produit de nombres tous premiers. Exemple : Décomposons <span class=\"m\">42<\/span>. <ul><li><span class=\"m\">42<\/span> est pair, donc divisible par <span class=\"m\">2<\/span> : <span class=\"m\">42 = 2 × 21<\/span>.<\/li><li><span class=\"m\">21<\/span> est divisible par <span class=\"m\">3<\/span> (critère de divisibilité) : <span class=\"m\">21 = 3 × 7<\/span>.<\/li><li><span class=\"m\">7<\/span> est un nombre premier.<\/li><\/ul> La DPFP de <span class=\"m\">42<\/span> est <span class=\"m\">2 × 3 × 7<\/span>, qu’on peut écrire <span class=\"m\">2<sup>1<\/sup> × 3<sup>1<\/sup> × 7<sup>1<\/sup><\/span>.","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.9.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Le nombre <span class=\"m\">19<\/span> est-il premier ? Justifier.<\/span>","corrige":"Un nombre premier n’est divisible que par <span class=\"m\">1<\/span> et par lui-même.<br> <span class=\"m\">19<\/span> n’est divisible que par <span class=\"m\">1<\/span> et <span class=\"m\">19<\/span>.<br> <b>Oui, <span class=\"m\"><b>19<\/b><\/span> est premier.<\/b>","rep":{"t":"on","v":"Oui"}},{"id":"1.9.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Le nombre <span class=\"m\">27<\/span> est-il premier ? Justifier.<\/span>","corrige":"<span class=\"m\">27<\/span> est divisible par <span class=\"m\">3<\/span> (car <span class=\"m\">2 + 7 = 9<\/span>, multiple de <span class=\"m\">3<\/span>) et par <span class=\"m\">9<\/span>.<br> Il a donc plus de deux diviseurs (<span class=\"m\">1,3,9,27<\/span>).<br> <b>Non, <span class=\"m\"><b>27<\/b><\/span> n’est pas premier.<\/b>","rep":{"t":"on","v":"Non"}},{"id":"1.9.3","duree":"1 minute","niveau":1,"enonce":"< \">2<i class=\"m\">k<\/i> + 1<\/span> (où <span class=\"m\"><i class=\"m\">k<\/i><\/span> est un entier).<\/li><\/ul>","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.10.1","duree":"1 minute","niveau":1,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer son double.<\/span>","corrige":"Le double d’un nombre <span class=\"m\"><i class=\"m\">n<\/i><\/span> s’obtient en le multipliant par <span class=\"m\">2<\/span>.<br> <b>L’expression est <span class=\"m\"><b>2<i class=\"m\">n<\/i><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"2n","reduire":false}},{"id":"1.10.2","duree":"1 minute","niveau":1,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer son successeur.<\/span>","corrige":"Le successeur d’un entier <span class=\"m\"><i class=\"m\">n<\/i><\/span> est l’entier qui le suit immédiatement.<br> On l’obtient en lui ajoutant <span class=\"m\">1<\/span>.<br> <b>L’expression est <span class=\"m\"><b><i class=\"m\">n<\/i> + 1<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n+1","reduire":false}},{"id":"1.10.3","duree":"1 minute","niveau":1,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer son prédécesseur.<\/span>","corrige":"Le prédécesseur d’un entier <span class=\"m\"><i class=\"m\">n<\/i><\/span> est l’entier dont <span class=\"m\"><i class=\"m\">n<\/i><\/span> est le successeur.<br>On l’obtient en soustrayant <span class=\"m\">1<\/span>. <br> <b>L’expression est <span class=\"m\"><b><i class=\"m\">n<\/i> − 1<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n-1","reduire":false}},{"id":"1.10.4","duree":"1 minute","niveau":1,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer le tiers de <span class=\"m\"><i class=\"m\">n<\/i><\/span>.<\/span>","corrige":"Prendre le tiers d’un nombre <span class=\"m\"><i class=\"m\">n<\/i><\/span> revient à le divise
