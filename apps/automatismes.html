e le double de cette expression. Il est important d’utiliser des parenthèses pour indiquer que l’on prend le double de la totalité.<\/li><\/ol> <b>L’expression est <span class=\"m\"><b>2(<i class=\"m\">n<\/i> + 1)<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"2(n+1)","reduire":false}},{"id":"1.10.9","duree":"1 minute","niveau":2,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de son prédécesseur.<\/span>","corrige":"Le prédécesseur de <span class=\"m\"><i class=\"m\">n<\/i><\/span> est <span class=\"m\">(<i class=\"m\">n<\/i> − 1)<\/span>.<br> On doit exprimer la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de ce nombre. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">n<\/i> + (<i class=\"m\">n<\/i> − 1) = 2<i class=\"m\">n<\/i> − 1<\/span><\/p><\/div> <b>L’expression réduite est <span class=\"m\"><b>2<i class=\"m\">n<\/i> − 1<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"2n-1","reduire":false}},{"id":"1.10.10","duree":"1 minute","niveau":2,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer la différence entre le carré de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et <span class=\"m\">10<\/span>.<\/span>","corrige":"Le carré de <span class=\"m\"><i class=\"m\">n<\/i><\/span> s’écrit <span class=\"m\"><i class=\"m\">n<\/i><sup>2<\/sup><\/span>.<br> Une différence est le résultat d’une soustraction. <br> <b>L’expression est <span class=\"m\"><b><i class=\"m\">n<\/i><sup>2<\/sup> − 10<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n^2-10","reduire":false}},{"id":"1.10.11","duree":"1 minute","niveau":2,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer le carré de la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">3<\/span>.<\/span>","corrige":"On doit respecter l’ordre des opérations.<br> On calcule d’abord « la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">3<\/span> », ce qui s’écrit <span class=\"m\">(<i class=\"m\">n<\/i> + 3)<\/span>.<br> Puis on met cette somme au carré.<br> <b>L’expression est <span class=\"m\"><b>(<i class=\"m\">n<\/i> + 3)<sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"(n+3)^2","reduire":false}},{"id":"1.10.12","duree":"1 minute","niveau":2,"enonce":"Léo a <span class=\"m\"><i class=\"m\">n<\/i><\/span> ans. Sa sœur a <span class=\"m\">4<\/span> ans de plus. <span class=\"q\">Exprimer l’âge de sa sœur.<\/span>","corrige":"L’âge de Léo est <span class=\"m\"><i class=\"m\">n<\/i><\/span>. Sa sœur a <span class=\"m\">4<\/span> ans de plus, ce qui correspond à une addition.<br> <b>L’âge de sa sœur est <span class=\"m\"><b><i class=\"m\">n<\/i> + 4<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n+4","reduire":false}},{"id":"1.10.13","duree":"1 minute","niveau":2,"enonce":"Un rectangle a pour largeur <span class=\"m\"><i class=\"m\">x<\/i><\/span> et pour longueur le triple de sa largeur. <span class=\"q\">Exprimer sa longueur.<\/span>","corrige":"La largeur est <span class=\"m\"><i class=\"m\">x<\/i><\/span>.<br> La longueur est le triple de cette valeur.<br> « Triple » signifie « multiplié par <span class=\"m\">3<\/span> ».<br> <b>La longueur s’exprime par <span class=\"m\"><b>3<i class=\"m\">x<\/i><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"3x","reduire":false}},{"id":"1.10.14","duree":"1 minute","niveau":2,"enonce":"Soient deux entiers consécutifs. <span class=\"q\">Si le plus petit est <span class=\"m\"><i class=\"m\">n<\/i><\/span>, comment s’écrit le plus grand ?<\/span>","corrige":"Deux entiers consécutifs sont deux entiers qui se suivent.<br> Si le plus petit est <span class=\"m\"><i class=\"m\">n<\/i><\/span>, le plus grand est son successeur.<br> <b>Le plus grand s’écrit <span class=\"m\"><b><i class=\"m\">n<\/i> + 1<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n+1","reduire":false}},{"id":"1.10.15","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Exprimer le produit de deux entiers consécutifs, si le plus petit est <span class=\"m\"><i class=\"m\">n<\/i><\/span>.<\/span>","corrige":"Les deux entiers consécutifs sont <span class=\"m\"><i class=\"m\">n<\/i><\/span> et <span class=\"m\">(<i class=\"m\">n<\/i> + 1)<\/span>.<br>Leur produit est la multiplication de ces deux termes.<br> <b>L’expression est <span class=\"m\"><b><i class=\"m\">n<\/i>(<i class=\"m\">n<\/i> + 1)<\/b><\/span>.<\/b>","rep":{"t":"expr","v":"n(n+1)","reduire":false}},{"id":"1.10.16","duree":"1 minute","niveau":2,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer le tiers de la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">6<\/span>.<\/span>","corrige":"On commence par écrire « la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">6<\/span> », ce qui donne <span class=\"m\">(<i class=\"m\">n<\/i> + 6)<\/span>.<br> On prend ensuite le tiers de cette expression.<br> <b>L’expression est <span class=\"m\"><b><span class=\"frac\"><span><i class=\"m\">n<\/i> + 6<\/span><span>3<\/span><\/span><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"((n+6)/(3))","reduire":false}},{"id":"1.10.17","duree":"1 minute","niveau":2,"enonce":"<span class=\"q\">Vrai ou Faux : La somme du triple de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">5<\/span> s’écrit <span class=\"m\">3(<i class=\"m\">n<\/i> + 5)<\/span>.<\/span>","corrige":"L’expression « La somme du triple de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et de <span class=\"m\">5<\/span> » se traduit par l’addition de « <span class=\"m\">3<i class=\"m\">n<\/i><\/span> » et de « <span class=\"m\">5<\/span> », soit <span class=\"m\">3<i class=\"m\">n<\/i> + 5<\/span>.<br> L’expression <span class=\"m\">3(<i class=\"m\">n<\/i> + 5)<\/span> se lit « le triple de la somme de <span class=\"m\"><i class=\"m\">n<\/i><\/span> et <span class=\"m\">5<\/span> ».<br> <b>L’affirmation est fausse.<\/b>","rep":{"t":"vf","v":"Faux"}},{"id":"1.10.18","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Exprimer le périmètre d’un carré de côté <span class=\"m\"><i class=\"m\">c<\/i><\/span>.<\/span>","corrige":"Le périmètre d’un carré de côté <span class=\"m\"><i class=\"m\">c<\/i><\/span> est le quadruple de <span class=\"m\"><i class=\"m\">c<\/i><\/span>.<br> <b>L’expression est <span class=\"m\"><b>4<i class=\"m\">c<\/i><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"4c","reduire":false}},{"id":"1.10.19","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Exprimer l’aire d’un rectangle de longueur <span class=\"m\"><i class=\"m\">L<\/i><\/span> et de largeur <span class=\"m\"><i class=\"m\">l<\/i><\/span>.<\/span>","corrige":"L’aire d’un rectangle se calcule en multipliant sa longueur <span class=\"m\"><i class=\"m\">L<\/i><\/span> par sa largeur <span class=\"m\"><i class=\"m\">l<\/i><\/span>.<br> <b>L’expression est <span class=\"m\"><b><i class=\"m\">L<\/i> × <i class=\"m\">l<\/i><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"L*l","reduire":false}},{"id":"1.10.20","duree":"2 minutes","niveau":3,"enonce":"La somme de trois entiers consécutifs est <span class=\"m\">36<\/span>. <span class=\"q\">Si on note <span class=\"m\"><i class=\"m\">n<\/i><\/span> le plus petit, écrire l’équation correspondante.<\/span>","corrige":"Si le plus petit entier est <span class=\"m\"><i class=\"m\">n<\/i><\/span>, les deux suivants sont <span class=\"m\"><i class=\"m\">n<\/i> + 1<\/span> et <span class=\"m\"><i class=\"m\">n<\/i> + 2<\/span>.<br> La somme de ces trois entiers consécutifs est égale à <span class=\"m\">36<\/span>.<br> <b>L’équation est:<br> <span class=\"m\"><b><i class=\"m\">n<\/i> + (<i class=\"m\">n<\/i> + 1) + (<i class=\"m\">n<\/i> + 2) = 36<\/b><\/span> ou <span class=\"m\"><b>3<i class=\"m\">n<\/i> + 3 = 36<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.10.21","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Montrer que la somme de deux entiers pairs est toujours un entier pair.<\/span>","corrige":"Soient deux entiers pairs.<br> On peut les écrire sous la forme <span class=\"m\">2<i class=\"m\">k<\/i><\/span> et <span class=\"m\">2<i class=\"m\">m<\/i><\/span>, où <span class=\"m\"><i class=\"m\">k<\/i><\/span> et <span class=\"m\"><i class=\"m\">m<\/i><\/span> sont des entiers.<br> Leur somme est : <span class=\"m\">2<i class=\"m\">k<\/i> + 2<i class=\"m\">m<\/i> = 2(<i class=\"m\">k<\/i> + <i class=\"m\">m<\/i>)<\/span>.<br> Comme <span class=\"m\"><i class=\"m\">k<\/i><\/span> et <span class=\"m\"><i class=\"m\">m<\/i><\/span> sont des entiers, leur somme <span class=\"m\">(<i class=\"m\">k<\/i> + <i class=\"m\">m<\/i>)<\/span> est aussi un entier.<br> L’expression est donc de la forme <span class=\"m\">2 × <span class=\"tx\">un entier<\/span><\/span>, ce qui est la définition d’un nombre pair.<br> <b>La somme de deux entiers pairs est toujours un entier pair.<\/b>","rep":{"t":"self"}},{"id":"1.10.22","duree":"2 minutes","niveau":3,"enonce":"Un père a <span class=\"m\">30<\/span> ans de plus que son fils. Si le fils a <span class=\"m\"><i class=\"m\">x<\/i><\/span> ans : <span class=\"q\">Exprimer l’âge du père, puis la somme de leurs âges.<\/span>","corrige":"<ul><li>Si l’âge du fils est <span class=\"m\"><i class=\"m\">x<\/i><\/span>, celui du père, qui a <span class=\"m\">30<\/span> ans de plus, est <span class=\"m\"><i class=\"m\">x<\/i> + 30<\/span>.<\/li><li>La somme de leurs âges est l’addition des deux expressions : <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">x<\/i> + (<i class=\"m\">x<\/i> + 30) = 2<i class=\"m\">x<\/i> + 30<\/span><\/p><\/div><\/li><\/ul> <b>L’âge du père est <span class=\"m\"><b><i class=\"m\">x<\/i> + 30<\/b><\/span> et la somme de leurs âges est <span class=\"m\"><b>2<i class=\"m\">x<\/i> + 30<\/b><\/span>.<\/b>","rep":{"t":"self"}},{"id":"1.10.23","duree":"2 minutes","niveau":3,"enonce":"Soit <span class=\"m\"><i class=\"m\">n<\/i><\/span> un entier. <span class=\"q\">Exprimer la différence entre le carré de son successeur et son propre carré.<\/span>","corrige":"Le successeur de <span class=\"m\"><i class=\"m\">n<\/i><\/span> est <span class=\"m\">(<i class=\"m\">n<\/i> + 1)<\/span>, et son carré s’écrit <span class=\"m\">(<i class=\"m\">n<\/i> + 1)<sup>2<\/sup><\/span>.<br> Le propre carré de <span class=\"m\"><i class=\"m\">n<\/i><\/span> est <span class=\"m\"><i class=\"m\">n<\/i><sup>2<\/sup><\/span>.<br> La différence est la soustraction de ces deux termes.<br> <b>L’expression est <span class=\"m\"><b>(<i class=\"m\">n<\/i> + 1)<sup>2<\/sup> − <i class=\"m\">n<\/i><sup>2<\/sup><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"(n+1)^2-n^2","reduire":false}},{"id":"1.10.24","duree":"2 minutes","niveau":3,"enonce":"<span class=\"q\">Montrer que la somme de deux entiers consécutifs est toujours un nombre impair.<\/span>","corrige":"Soient deux entiers consécutifs, que l’on peut noter <span class=\"m\"><i class=\"m\">n<\/i><\/span> et <span class=\"m\">(<i class=\"m\">n<\/i> + 1)<\/span>.<br> Leur somme est : <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">n<\/i> + (<i class=\"m\">n<\/i> + 1) = 2<i class=\"m\">n<\/i> + 1<\/span><\/p><\/div> Cette expression est la forme générale d’un nombre impair (un multiple de <span class=\"m\">2<\/span>, plus <span class=\"m\">1<\/span>).<br> <b>La somme de deux entiers consécutifs est toujours un nombre impair.<\/b>","rep":{"t":"self"}}]},{"id":"1.11","titre":"Simplification d’expressions littérales","rappel":"Simplifier (ou réduire) une expression littérale consiste à l’écrire avec le moins de termes possibles en regroupant les termes de la « même famille ». <ul><li>Les termes en <span class=\"m\"><i class=\"m\">x<\/i><sup>2<\/sup><\/span> avec les termes en <span class=\"m\"><i class=\"m\">x<\/i><sup>2<\/sup><\/span>.<\/li><li>Les termes en <span class=\"m\"><i class=\"m\">x<\/i><\/span> avec les termes en <span class=\"m\"><i class=\"m\">x<\/i><\/span>.<\/li><li>Les nombres (constantes) avec les nombres.<\/li><\/ul> Exemple : <span class=\"m\">3<i class=\"m\">x<\/i><sup>2<\/sup> + 5<i class=\"m\">x<\/i> − 4 − <i class=\"m\">x<\/i><sup>2<\/sup> + 2<i class=\"m\">x<\/i> = (3<i class=\"m\">x<\/i><sup>2<\/sup> − <i class=\"m\">x<\/i><sup>2<\/sup>) + (5<i class=\"m\">x<\/i> + 2<i class=\"m\">x<\/i>) − 4 = 2<i class=\"m\">x<\/i><sup>2<\/sup> + 7<i class=\"m\">x<\/i> − 4<\/span>.<br> <b>Suppression des parenthèses :<\/b> <ul><li>Précédées d’un ’<span class=\"m\">+<\/span>’ : on enlève les parenthèses sans rien changer.<br> Exemple : <span class=\"m\">5<i class=\"m\">x<\/i> + (2<i class=\"m\">x<\/i> − 1) = 5<i class=\"m\">x<\/i> + 2<i class=\"m\">x<\/i> − 1 = 7<i class=\"m\">x<\/i> − 1<\/span>.<\/li><li>Précédées d’un ’<span class=\"m\">−<\/span>’ : on enlève les parenthèses <b>en changeant le signe de chaque terme<\/b> à l’intérieur.<br> Exemple : <span class=\"m\">5<i class=\"m\">x<\/i> − (2<i class=\"m\">x<\/i> − 1) = 5<i class=\"m\">x<\/i> − 2<i class=\"m\">x<\/i> + 1 = 3<i class=\"m\">x<\/i> + 1<\/span>.<\/li><\/ul>","niveaux":{"1":"Je m’échauffe","2":"J’approfondis","3":"Défi Brevet"},"exos":[{"id":"1.11.1","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Réduire <span class=\"m\"><i class=\"m\">A<\/i> = 4<i class=\"m\">x<\/i> + 3<i class=\"m\">x<\/i><\/span>.<\/span>","corrige":"On regroupe les termes de la famille des « <span class=\"m\"><i class=\"m\">x<\/i><\/span> ». <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">A<\/i> = (4 + 3)<i class=\"m\">x<\/i> = 7<i class=\"m\">x<\/i><\/span><\/p><\/div> <b>L’expression réduite est <span class=\"m\"><b><i class=\"m\">A<\/i> = 7<i class=\"m\">x<\/i><\/b><\/span>.<\/b>","rep":{"t":"expr","v":"7x","reduire":true}},{"id":"1.11.2","duree":"1 minute","niveau":1,"enonce":"<span class=\"q\">Réduire <span class=\"m\"><i class=\"m\">B<\/i> = 10<i class=\"m\">y<\/i> − 3<i class=\"m\">y<\/i><\/span>.<\/span>", \"><i class=\"m\">z<\/i> = <span class=\"frac\"><span>35<\/span><span>5<\/span><\/span><\/span><\/p><p><span class=\"m\"><i class=\"m\">z<\/i> = 7<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">z<\/i> = 7<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"z","v":"7"}},{"id":"1.13.19","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Résoudre <span class=\"m\"><span class=\"frac\"><span>100<\/span><span><i class=\"m\">a<\/i><\/span><\/span> = 25<\/span>.<\/span>","corrige":"<span class=\"m\"><i class=\"m\">a<\/i><\/span> est supposé non nul et <span class=\"m\">25 = <span class=\"frac\"><span>25<\/span><span>1<\/span><\/span><\/span>, on peut donc utiliser l’égalité des produits en croix. <div class=\"calc\"><p><span class=\"m\">100 × 1 = <i class=\"m\">a<\/i> × 25<\/span><\/p><p><span class=\"m\">100 = 25<i class=\"m\">a<\/i><\/span><\/p><p><span class=\"m\"><i class=\"m\">a<\/i> = <span class=\"frac\"><span>100<\/span><span>25<\/span><\/span> = 4<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">a<\/i> = 4<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"a","v":"4"}},{"id":"1.13.20","duree":"2 minutes","niveau":2,"enonce":"<span class=\"q\">Résoudre <span class=\"m\">7 − <i class=\"m\">b<\/i> = 12<\/span>.<\/span>","corrige":"On isole le terme en <span class=\"m\"><i class=\"m\">b<\/i><\/span>. <div class=\"calc\"><p><span class=\"m\">7 − 12 = <i class=\"m\">b<\/i><\/span><\/p><p><span class=\"m\">−5 = <i class=\"m\">b<\/i><\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">b<\/i> = −5<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"b","v":"-5"}},{"id":"1.13.21","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\">7<i class=\"m\">x<\/i> + 3 = 4<i class=\"m\">x<\/i> + 15<\/span>.<\/span>","corrige":"On regroupe les termes en <span class=\"m\"><i class=\"m\">x<\/i><\/span> à gauche et les constantes à droite. <div class=\"calc\"><p><span class=\"m\">7<i class=\"m\">x<\/i> l","x":"x","v":"5"}},{"id":"1.13.24","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\"><span class=\"frac\"><span>5<\/span><span>2<i class=\"m\">x<\/i><\/span><\/span> = <span class=\"frac\"><span>1<\/span><span>3<\/span><\/span><\/span>.<\/span>","corrige":"<span class=\"m\"><i class=\"m\">x<\/i><\/span> est supposé non nul, on peut utiliser l’égalité des produits en croix. <div class=\"calc\"><p><span class=\"m\">5 × 3 = 2<i class=\"m\">x<\/i> × 1<\/span><\/p><p><span class=\"m\">15 = 2<i class=\"m\">x<\/i><\/span><\/p><p><span class=\"m\"><i class=\"m\">x<\/i> = <span class=\"frac\"><span>15<\/span><span>2<\/span><\/span><\/span><\/p><p><span class=\"m\"><i class=\"m\">x<\/i> = 7,5<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">x<\/i> = 7,5<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"x","v":"7.5"}},{"id":"1.13.25","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\">3(<i class=\"m\">z<\/i> − 2) = 12<\/span>.<\/span>","corrige":"On divise les deux membres par 3 (ou on développe). <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">z<\/i> − 2 = <span class=\"frac\"><span>12<\/span><span>3<\/span><\/span><\/span><\/p><p><span class=\"m\"><i class=\"m\">z<\/i> − 2 = 4<\/span><\/p><p><span class=\"m\"><i class=\"m\">z<\/i> = 6<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">z<\/i> = 6<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"z","v":"6"}},{"id":"1.13.26","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\"><span class=\"frac\"><span>9<\/span><span><i class=\"m\">b<\/i> + 1<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>2<\/span><\/span><\/span>.<\/span>","corrige":"On suppose que <span class=\"m\"><i class=\"m\">b<\/i> − 1<\/span> est non nul, donc que <span class=\"m\"><i class=\"m\">b<\/i> ≠ 1<\/span>, on peut donc utiliser l’égalité des produits en croix. <div class=\"calc\"><p><span class=\"m\">9 × 2 = 3 × (<i class=\"m\">b<\/i> + 1)<\/span><\/p><p><span class=\"m\">18 = 3<i class=\"m\">b<\/i> + 3<\/span><\/p><p><span class=\"m\">18 − 3 = 3<i class=\"m\">b<\/i><\/span><\/p><p><span class=\"m\">15 = 3<i class=\"m\">b<\/i><\/span><\/p><p><span class=\"m\"><i class=\"m\">b<\/i> = 5<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">b<\/i> = 5<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"b","v":"5"}},{"id":"1.13.27","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\">10<i class=\"m\">a<\/i> − 4 = 6<i class=\"m\">a<\/i> − 20<\/span>.<\/span>","corrige":"On regroupe les termes en <span class=\"m\"><i class=\"m\">a<\/i><\/span> à gauche et les constantes à droite. <div class=\"calc\"><p><span class=\"m\">10<i class=\"m\">a<\/i> − 6<i class=\"m\">a<\/i> = −20 + 4<\/span><\/p><p><span class=\"m\">4<i class=\"m\">a<\/i> = −16<\/span><\/p><p><span class=\"m\"><i class=\"m\">a<\/i> = <span class=\"frac\"><span>−16<\/span><span>4<\/span><\/span> = −4<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">a<\/i> = −4<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"a","v":"-4"}},{"id":"1.13.28","duree":"3 minutes","niveau":3,"enonce":"On considère le programme de calcul suivant: <ul><li>Choisir un nombre<\/li><li>le tripler<\/li><li>ajouter 5 au résultat obtenu<\/li><\/ul> On obtient 26. <span class=\"q\">Quel était le nombre de départ ?<\/span>","corrige":"Soit <span class=\"m\"><i class=\"m\">x<\/i><\/span> le nombre de départ. L’équation est <span class=\"m\">3<i class=\"m\">x<\/i> + 5 = 26<\/span> car:<ul><li>Je choisis <span class=\"m\"><i class=\"m\">x<\/i><\/span><\/li><li><span class=\"m\">3 × <i class=\"m\">x<\/i> = 3<i class=\"m\">x<\/i><\/span><\/li><li><span class=\"m\">3<i class=\"m\">x<\/i> + 5<\/span><\/li><\/ul> J’obtiens <span class=\"m\">3<i class=\"m\">x<\/i> + 5<\/span> quand j’entre le nombre <span class=\"m\"><i class=\"m\">x<\/i><\/span> dans le programme. Je cherche donc les <span class=\"m\"><i class=\"m\">x<\/i><\/span> tels que<br> <span class=\"m\">3<i class=\"m\">x<\/i> + 5 = 26<\/span> <div class=\"calc\"><p><span class=\"m\">3<i class=\"m\">x<\/i> = 26 − 5<\/span><\/p><p><span class=\"m\">3<i class=\"m\">x<\/i> = 21<\/span><\/p><p><span class=\"m\"><i class=\"m\">x<\/i> = <span class=\"frac\"><span>21<\/span><span>3<\/span><\/span> = 7<\/span><\/p><\/div> <b>Le nombre de départ était <span class=\"m\"><b>7<\/b><\/span>.<\/b>","rep":{"t":"num","v":"7"}},{"id":"1.13.29","duree":"3 minutes","niveau":3,"enonce":"<span class=\"q\">Résoudre <span class=\"m\"><span class=\"frac\"><span><i class=\"m\">x<\/i><\/span><span>100<\/span><\/span> = <span class=\"frac\"><span>15<\/span><span>60<\/span><\/span><\/span>.<\/span>","corrige":"<span class=\"m\">100<\/span> et <span class=\"m\">60<\/span> sont non nuls, donc je peux utiliser l’égalité des produits en croix. <div class=\"calc\"><p><span class=\"m\"><i class=\"m\">x<\/i> × 60 = 100 × 15<\/span><\/p><p><span class=\"m\">60<i class=\"m\">x<\/i> = 1500<\/span><\/p><p><span class=\"m\"><i class=\"m\">x<\/i> = <span class=\"frac\"><span>1500<\/span><span>60<\/span><\/span> = <span class=\"frac\"><span>150<\/span><span>6<\/span><\/span><\/span><\/p><p><span class=\"m\"><i class=\"m\">x<\/i> = 25<\/span><\/p><\/div> <b>La solution est <span class=\"m\"><b><i class=\"m\">x<\/i> = 25<\/b><\/span>.<\/b>","rep":{"t":"sol","x":"x","v":"25"}}]}]}]};

<script>
(() => {
"use strict";
const KEY = "automatismes-suivi";
const NIV = ["", "Je m’échauffe", "J’approfondis", "Défi Brevet"];
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
if (!st.ex) st.ex = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const app = document.getElementById("app");
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const allSections = () => LIVRE.chapitres.flatMap((c) => c.sections);
const findSection = (id) => allSections().find((s) => s.id === id);
const reussi = (id) => st.ex[id] === 1 || st.ex[id] === 2;
const countDone = (exos) => exos.filter((e) => reussi(e.id)).length;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Navigation ---------- */
const PAGES = [{ id: "home", titre: "Sommaire" }].concat(LIVRE.chapitres.map((c) => ({ id: "ch" + c.id, titre: c.id + ". " + c.titre })));
const nav = document.querySelector("nav"), navsel = document.querySelector(".navsel");
let page = "home";
function renderTabs() {
  nav.innerHTML = ""; navsel.innerHTML = "";
  PAGES.forEach((p) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = p.titre;
    const cur = page === p.id || page.startsWith("s" + p.id.slice(2) + ".") && p.id !== "home";
    if (cur) b.className = "on";
    b.onclick = () => go(p.id); nav.append(b);
    const o = document.createElement("option"); o.value = p.id; o.textContent = p.titre; if (cur) o.selected = true; navsel.append(o);
  });
}
navsel.onchange = () => go(navsel.value);
function go(p, opts) {
  page = p; renderTabs(); app.innerHTML = "";
  if (p === "home") renderHome();
  else if (p.startsWith("ch")) renderChapitre(LIVRE.chapitres.find((c) => "ch" + c.id === p));
  else if (p.startsWith("s")) renderSection(findSection(p.slice(1)), opts || {});
  window.scrollTo(0, 0);
}

/* ---------- Sommaire ---------- */
function renderHome() {
  const all = allSections().flatMap((s) => s.exos);
  app.append($(`<div class="card"><h2 class="ttl"><span>Comment ça marche ?</span></h2>
    <p>Les automatismes sont des calculs et des questions courtes qu’il faut savoir faire vite et sans hésiter. Au brevet, ils forment le premier exercice.</p>
    <ol><li>Je choisis une notion, puis un niveau : « Je m’échauffe », « J’approfondis » ou « Défi Brevet ».</li>
    <li>Je réponds à la question. J’ai droit à deux essais.</li>
    <li>Après le deuxième essai, ou quand j’ai trouvé, je lis la correction.</li></ol>
    <p>Si je bloque, je relis le rappel de cours en haut de la notion.</p>
    <p class="suivi">J’ai réussi <b>${countDone(all)}</b> exercices sur <b>${all.length}</b>.</p></div>`));
  const g = $(`<div class="grid"></div>`);
  LIVRE.chapitres.forEach((c) => {
    const ex = c.sections.flatMap((s) => s.exos), d = countDone(ex);
    const card = $(`<div class="card"><h3>${c.id}. ${c.titre}</h3><p>${c.sections.length} notions et ${ex.length} exercices.</p>
      <div class="bas"><p class="suivi">Réussis : ${d} sur ${ex.length}</p><div class="barre"><span style="width:${Math.round(100 * d / ex.length)}%"></span></div>
      <button class="btn" type="button">Ouvrir</button></div></div>`);
    card.querySelector("button").onclick = () => go("ch" + c.id);
    g.append(card);
  });
  app.append(g);
}

/* ---------- Chapitre ---------- */
function renderChapitre(c) {
  app.append($(`<div class="card"><h2 class="ttl"><span>${c.id}. ${c.titre}</span></h2><p class="intro">${c.intro}</p><p>Je choisis une notion.</p></div>`));
  const g = $(`<div class="grid"></div>`);
  c.sections.forEach((s, k) => {
    const d = countDone(s.exos);
    const card = $(`<div class="card"><h3>${k + 1}. ${s.titre}</h3>
      <div class="bas"><p class="suivi">Réussis : ${d} sur ${s.exos.length}</p><div class="barre"><span style="width:${Math.round(100 * d / s.exos.length)}%"></span></div>
      <button class="btn" type="button">Je m’entraîne</button></div></div>`);
    card.querySelector("button").onclick = () => go("s" + s.id);
    g.append(card);
  });
  app.append(g);
}

/* ---------- Notion : série d’exercices ---------- */
function renderSection(s, opts) {
  const chap = LIVRE.chapitres.find((c) => c.sections.includes(s));
  const num = chap.sections.indexOf(s) + 1;
  const card = $(`<div class="card"><h2 class="ttl"><span>${num}. ${s.titre}</span></h2>
    <details class="rappel"><summary>Rappel de cours</summary><div>${s.rappel}</div></details>
    <div class="levels" role="group" aria-label="Niveau"></div><div class="zone"></div>
    <p><button class="btn light" type="button" data-back>← Toutes les notions du chapitre</button></p></div>`);
  card.querySelector("[data-back]").onclick = () => go("ch" + chap.id);
  const lv = card.querySelector(".levels"), zone = card.querySelector(".zone");
  const niveaux = [1, 2, 3].filter((n) => s.exos.some((e) => e.niveau === n));
  let niveau = opts.niveau || niveaux.find((n) => s.exos.some((e) => e.niveau === n && !reussi(e.id))) || niveaux[0];
  function drawLevels() {
    lv.innerHTML = "";
    niveaux.forEach((n) => {
      const ex = s.exos.filter((e) => e.niveau === n);
      const b = $(`<button type="button">${s.niveaux[n] || NIV[n]} <span class="nb">(${countDone(ex)}/${ex.length})</span></button>`);
      if (n === niveau) { b.className = "on"; b.setAttribute("aria-pressed", "true"); }
      b.onclick = () => { niveau = n; drawLevels(); startSerie(); };
      lv.append(b);
    });
  }
  function startSerie() {
    const ex = s.exos.filter((e) => e.niveau === niveau);
    // d’abord les exercices pas encore réussis, dans l’ordre du livre
    const todo = ex.filter((e) => !reussi(e.id)), done = ex.filter((e) => reussi(e.id));
    const serie = todo.length ? todo : shuffle(done);
    let k = 0, premier = 0, total = 0;
    const next = () => {
      if (k >= serie.length) {
        zone.innerHTML = "";
        const fin = $(`<div><p class="bilan">Série terminée. J’ai trouvé ${premier} réponse${premier > 1 ? "s" : ""} sur ${total} au premier essai.</p>
          <p><button class="btn" type="button" data-again>Recommencer ce niveau</button></p></div>`);
        const nx = niveaux[niveaux.indexOf(niveau) + 1];
        if (nx) { const b = $(`<button class="btn light" type="button">Passer au niveau « ${s.niveaux[nx] || NIV[nx]} »</button>`); b.onclick = () => { niveau = nx; drawLevels(); startSerie(); }; fin.querySelector("p:last-child").append(b); }
        fin.querySelector("[data-again]").onclick = () => { serie.splice(0, serie.length, ...shuffle(ex)); k = 0; premier = 0; total = 0; next(); };
        zone.append(fin); drawLevels(); return;
      }
      const e = serie[k];
      zone.innerHTML = "";
      zone.append(exercice(e, `Exercice ${k + 1} sur ${serie.length}`, (res) => {
        total++; if (res === 1) premier++;
        st.ex[e.id] = res; save(); drawLevels();
      }, () => { k++; next(); }));
    };
    next();
  }
  drawLevels(); app.append(card); startSerie();
}

/* ---------- Un exercice ---------- */
function exercice(e, rang, onResult, onNext) {
  const box = $(`<div class="exo"><div class="exo-info"><b>${rang}</b><span>${e.duree}</span></div>
    <div class="enonce">${e.enonce}</div><div class="rep-zone"></div><div class="fb" role="status" aria-live="polite"></div><div class="corr"></div></div>`);
  const rz = box.querySelector(".rep-zone"), fb = box.querySelector(".fb"), corr = box.querySelector(".corr");
  const r = e.rep;
  let essais = 0, fini = false;
  const nextBtn = () => { const b = $(`<button class="btn" type="button">Exercice suivant →</button>`); b.onclick = onNext; corr.append(b); setTimeout(() => b.focus(), 0); };
  const montrer = (titre) => { corr.innerHTML = `<div class="corrige"><h4>${titre}</h4>${e.corrige}</div>`; nextBtn(); };
  const finir = (res, msg, cls) => { fini = true; fb.className = "fb " + cls; fb.innerHTML = msg; onResult(res); montrer(res ? "Correction du livre" : "Correction"); };
  if (r.t === "on" || r.t === "vf") {
    const opts = r.t === "on" ? ["Oui", "Non"] : ["Vrai", "Faux"];
    const row = $(`<div class="saisie"></div>`);
    opts.forEach((o) => {
      const b = $(`<button class="opt" type="button">${o}</button>`);
      b.onclick = () => {
        if (fini) return;
        row.querySelectorAll("button").forEach((x) => (x.disabled = true));
        if (o === r.v) { b.classList.add("good"); finir(1, "C’est juste. Je lis la correction pour vérifier ma justification.", "ok"); }
        else { b.classList.add("bad"); finir(0, `Ce n’est pas ça : la bonne réponse est « ${r.v} ». Je lis la correction.`, "ko"); }
      };
      row.append(b);
    });
    rz.append(row);
  } else if (r.t === "self") {
    const ta = $(`<textarea class="rep" aria-label="Ma réponse" placeholder="J’écris ma réponse ici."></textarea>`);
    const b = $(`<button class="btn" type="button">Voir la correction</button>`);
    rz.append(ta, b);
    b.onclick = () => {
      b.disabled = true; ta.readOnly = true;
      corr.innerHTML = `<div class="corrige"><h4>Correction du livre</h4>${e.corrige}</div>`;
      const q = $(`<div><p class="bilan">Je compare avec ma réponse. Avais-je juste ?</p><div class="saisie"><button class="opt" type="button" data-v="1">Oui, j’avais juste</button><button class="opt" type="button" data-v="0">Non, je m’étais trompé(e)</button></div></div>`);
      q.querySelectorAll("button").forEach((x) => x.onclick = () => {
        q.querySelectorAll("button").forEach((y) => (y.disabled = true)); x.classList.add(x.dataset.v === "1" ? "good" : "bad");
        onResult(x.dataset.v === "1" ? 1 : 0); nextBtn();
      });
      corr.append(q);
    };
  } else {
    const aide = AIDE[r.t] ? `<p class="aide-saisie">${AIDE[r.t]}</p>` : "";
    const wrap = $(`<div><div class="saisie"><input class="rep" type="text" inputmode="${r.t === "num" || r.t === "frac" ? "decimal" : "text"}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ma réponse">${r.u ? `<span class="unit">${r.u}</span>` : ""}<button class="btn" type="button">Valider</button></div>${aide}</div>`);
    const inp = wrap.querySelector("input"), ok = wrap.querySelector(".btn");
    const keys = CLAVIER[r.t];
    if (keys) {
      const kb = $(`<div class="clavier" aria-label="Symboles"></div>`);
      keys.forEach((k) => { const b = $(`<button type="button">${k}</button>`); b.onclick = () => { insert(inp, k === "x²" ? "²" : k); }; kb.append(b); });
      wrap.append(kb);
    }
    rz.append(wrap);
    const valider = () => {
      if (fini) return;
      const v = inp.value.trim();
      if (!v) { fb.className = "fb warn"; fb.textContent = "J’écris d’abord ma réponse."; inp.focus(); return; }
      const res = verifier(r, v);
      if (res.ok) {
        inp.classList.remove("bad"); inp.classList.add("good"); inp.readOnly = true; ok.disabled = true;
        finir(essais === 0 ? 1 : 2, essais === 0 ? "Bravo, c’est juste !" : "C’est juste au deuxième essai.", "ok");
        return;
      }
      essais++;
      inp.classList.add("bad");
      if (essais < 2) { fb.className = "fb ko"; fb.innerHTML = (res.msg || "Ce n’est pas la bonne réponse.") + " J’ai droit à un deuxième essai. Je peux relire le rappel de cours."; inp.select(); }
      else { inp.readOnly = true; ok.disabled = true; finir(0, (res.msg ? res.msg + " " : "") + "Ce n’est toujours pas la bonne réponse. Je lis la correction.", "ko"); }
    };
    ok.onclick = valider;
    inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter") valider(); });
    setTimeout(() => inp.focus({ preventScroll: true }), 0);
  }
  return box;
}
function insert(inp, s) {
  if (inp.readOnly) return;
  const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, a) + s + inp.value.slice(b);
  inp.focus(); inp.setSelectionRange(a + s.length, a + s.length);
}
const AIDE = {
  frac: "J’écris une fraction avec la barre /, par exemple 3/4.",
  sol: "J’écris la solution, par exemple x = 5 ou x = 7/3.",
  sci: "J’écris par exemple 4,5 × 10^3 ou 7 × 10^−2.",
  expr: "J’écris l’expression, par exemple 3x + 2 ou 2(n + 1). Pour un carré, j’écris x² ou x^2.",
  decomp: "J’écris un produit, par exemple 2 × 2 × 5 ou 2² × 5."
};
const CLAVIER = { frac: ["/", "−"], sol: ["=", "/", "−"], sci: ["×", "10^", "−"], expr: ["×", "x²", "(", ")", "−", "/"], decomp: ["×", "²", "^"] };

/* ---------- Correction automatique ---------- */
const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };
function normal(v) {
  return v.replace(/[    ]/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".").replace(/[×·]/g, "*").replace(/÷/g, "/")
    .replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => "^" + [...m].map((c) => SUP[c]).join(""));
}
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
function nombre(v) {   // nombre décimal ou fraction a/b, renvoie {val, n, d}
  let m = v.match(/^(-?)\(?(\d+(?:\.\d+)?)\)?\/\(?(\d+(?:\.\d+)?)\)?$/);
  if (m) { const n = +m[2], d = +m[3]; if (!d) return null; return { val: (m[1] ? -1 : 1) * n / d, n: (m[1] ? -1 : 1) * n, d }; }
  m = v.match(/^-?\d+(?:\.\d+)?$|^-?\.\d+$/);
  if (m) return { val: +v };
  return null;
}
const proche = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(b));
function verifier(r, brut) {
  let v = normal(brut);
  if (r.t === "num") {
    v = v.replace(/€|%|°c|°|cm\^?[23]?|km|kg|cl|m\^?[23]?|l$|g$|min(utes?)?$/gi, "");
    const x = nombre(v);
    if (!x) return { ok: false, msg: "J’écris seulement un nombre." };
    return { ok: proche(x.val, +r.v) };
  }
  if (r.t === "frac") {
    const x = nombre(v), [n, d] = r.v.split("/").map(Number), val = n / d;
    if (!x) return { ok: false, msg: "J’écris un nombre ou une fraction, par exemple 3/4." };
    if (!proche(x.val, val)) return { ok: false };
    if (r.exact) {
      if (x.d === undefined) return { ok: d === 1 || false, msg: "La réponse attendue est une fraction." };
      if (!Number.isInteger(x.n) || !Number.isInteger(x.d) || gcd(x.n, x.d) !== 1) return { ok: false, msg: "La valeur est juste, mais la fraction n’est pas simplifiée au maximum." };
    }
    return { ok: true };
  }
  if (r.t === "sol") {
    const m = v.match(/^(?:([a-z])=)?(.+)$/i);
    if (m[1] && m[1].toLowerCase() !== r.x) return { ok: false, msg: `L’inconnue s’appelle ${r.x}.` };
    const x = nombre(m[2]); if (!x) return { ok: false, msg: AIDE.sol };
    const [a, b] = r.v.split("/").map(Number);
    return { ok: proche(x.val, b ? a / b : a) };
  }
  if (r.t === "sci") {
    const m = v.replace(/x/gi, "*").match(/^(-?\d+(?:\.\d+)?)\*10\^?\(?(-?\d+)\)?$/);
    if (!m) return { ok: false, msg: AIDE.sci };
    const a = +m[1], n = +m[2];
    if (proche(a * Math.pow(10, n), +r.m * Math.pow(10, r.e)) && !(Math.abs(a) >= 1 && Math.abs(a) < 10)) return { ok: false, msg: "Le nombre est juste, mais ce n’est pas une notation scientifique : le premier nombre doit être compris entre 1 et 10." };
    return { ok: proche(a, +r.m) && n === r.e };
  }
  if (r.t === "decomp") {
    const f = [];
    for (const p of v.split("*")) {
      const m = p.match(/^(\d+)(?:\^(\d+))?$/); if (!m) return { ok: false, msg: AIDE.decomp };
      for (let i = 0; i < +(m[2] || 1); i++) f.push(+m[1]);
    }
    const prem = (n) => { if (n < 2) return false; for (let k = 2; k * k <= n; k++) if (n % k === 0) return false; return true; };
    const prod = (a) => a.reduce((x, y) => x * y, 1);
    if (prod(f) === prod(r.v) && !f.every(prem)) return { ok: false, msg: "Le produit est juste, mais tous les facteurs ne sont pas des nombres premiers." };
    return { ok: f.sort((a, b) => a - b).join() === r.v.join() };
  }
  if (r.t === "expr") {
    v = v.replace(/^[A-Z]=/, "");
    const e1 = parse(v), e0 = parse(r.v);
    if (!e1 || !e0) return { ok: false, msg: "Je n’arrive pas à lire cette expression. " + AIDE.expr };
    const vars = new Set([...varsOf(e0), ...varsOf(e1)]);
    for (let t = 0; t < 5; t++) {
      const env = {}; vars.forEach((x) => (env[x] = Math.round((Math.random() * 20 - 10) * 100) / 100 + 0.37));
      if (!proche(evalE(e1, env), evalE(e0, env))) return { ok: false };
    }
    if (r.reduire) {
      if (/[()\[\]]/.test(v) && !/[()]/.test(r.v)) return { ok: false, msg: "L’expression est égale, mais elle n’est pas réduite : il reste des parenthèses." };
      if (termes(v) > termes(r.v)) return { ok: false, msg: "L’expression est égale, mais elle n’est pas réduite : on peut encore regrouper des termes." };
    }
    return { ok: true };
  }
  return { ok: false };
}
function termes(s) { let d = 0, n = 1; s = s.replace(/^[+-]/, ""); for (const c of s) { if ("([".includes(c)) d++; else if (")]".includes(c)) d--; else if ((c === "+" || c === "-") && d === 0) n++; } return n; }
/* petit analyseur d’expressions : + − × / ^, parenthèses, multiplication implicite (3x, 2(n+1)) */
function parse(s) {
  s = s.replace(/\[/g, "(").replace(/\]/g, ")").replace(/\*\*/g, "^");
  const toks = s.match(/\d+(?:\.\d+)?|[A-Za-z]|[-+*/^()]/g);
  if (!toks || toks.join("") !== s) return null;
  let i = 0;
  const peek = () => toks[i], eat = () => toks[i++];
  function expr() { let a = term(); while (peek() === "+" || peek() === "-") { const o = eat(); a = [o, a, term()]; } return a; }
  function term() {
    let a = unary();
    for (;;) {
      if (peek() === "*" || peek() === "/") { const o = eat(); a = [o, a, unary()]; }
      else if (peek() !== undefined && (/^[\dA-Za-z(]/.test(peek()))) a = ["*", a, power()];
      else return a;
    }
  }
  function unary() { if (peek() === "-") { eat(); return ["neg", unary()]; } if (peek() === "+") { eat(); return unary(); } return power(); }
  function power() { const b = atom(); if (peek() === "^") { eat(); return ["^", b, unary()]; } return b; }
  function atom() {
    const t = eat();
    if (t === undefined) throw 0;
    if (t === "(") { const a = expr(); if (eat() !== ")") throw 0; return a; }
    if (/^\d/.test(t)) return ["n", +t];
    if (/^[A-Za-z]$/.test(t)) return ["v", t];
    throw 0;
  }
  try { const a = expr(); return i === toks.length ? a : null; } catch (e) { return null; }
}
function varsOf(a) { if (!a) return []; if (a[0] === "v") return [a[1]]; if (a[0] === "n") return []; return a.slice(1).flatMap(varsOf); }
function evalE(a, env) {
  switch (a[0]) {
    case "n": return a[1]; case "v": return env[a[1]]; case "neg": return -evalE(a[1], env);
    case "+": return evalE(a[1], env) + evalE(a[2], env); case "-": return evalE(a[1], env) - evalE(a[2], env);
    case "*": return evalE(a[1], env) * evalE(a[2], env); case "/": return evalE(a[1], env) / evalE(a[2], env);
    case "^": return Math.pow(evalE(a[1], env), evalE(a[2], env));
  }
}

/* ---------- Pied de page : effacer ma progression ---------- */
const reset = $(`<p><button type="button">Effacer ma progression</button></p>`);
reset.querySelector("button").onclick = () => {
  const b = reset.querySelector("button");
  if (b.dataset.confirm) { st = { ex: {} }; save(); delete b.dataset.confirm; b.textContent = "Effacer ma progression"; go(page.startsWith("s") ? page : "home"); }
  else { b.dataset.confirm = "1"; b.textContent = "Je confirme : effacer toute ma progression"; }
};
document.querySelector("footer").append(reset);
window.__auto = { verifier, parse };
go("home");
})();
</script>
<script>
/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
