</style></head><body><div class="wrap"><header><a class="back-home" href="../4e/">← Toutes les applications</a><h1><span>Chapitre 1 : Nombres relatifs</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours">Cours</button><button type="button" data-page="add">1. Additionner</button><button type="button" data-page="sub">2. Soustraire</button><button type="button" data-page="sum">3. Sommes algébriques</button><button type="button" data-page="mul">4. Multiplier et diviser</button><button type="button" data-page="prio">5. Priorités</button><button type="button" data-page="ds">6. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 4<sup>e</sup></footer></div><template id="course-source"><section data-mod="add"><h3>1. Additionner deux nombres relatifs</h3>
<p>La distance à zéro d’un nombre relatif, c’est le nombre sans son signe. La distance à zéro de −7 est 7, celle de +3 est 3.</p>
<div class="retenir"><b>Deux nombres de même signe</b><ol><li>On additionne les distances à zéro.</li><li>On donne au résultat le signe commun aux deux nombres.</li></ol></div>
<div class="seyes"><h4>Exemples</h4><p>(−4) + (−2) = −(4 + 2) = (−6)</p><p>(+3) + (+7) = +(3 + 7) = (+10)</p></div>
<div class="retenir"><b>Deux nombres de signes contraires</b><ol><li>On soustrait les distances à zéro, la plus grande moins la plus petite.</li><li>On donne au résultat le signe du nombre qui a la plus grande distance à zéro.</li></ol></div>
<div class="seyes"><h4>Exemples</h4><p>(+3) + (−7) = −(7 − 3) = (−4)</p><p>(−5) + (+8) = +(8 − 5) = (+3)</p></div>
<p>La somme de deux nombres opposés est égale à 0. Par exemple, (−7) + (+7) = 0.</p></section>
<section data-mod="sub"><h3>2. Soustraire un nombre relatif</h3>
<div class="retenir"><b>Règle</b>Pour soustraire un nombre relatif, on ajoute son opposé.</div>
<div class="seyes"><h4>Exemples</h4><p>(+7) − (−4) = (+7) + (+4) = (+11)</p><p>(−8) − (+5) = (−8) + (−5) = (−13)</p></div>
<h3>3. Simplifier l’écriture</h3>
<ol><li>On transforme les soustractions en additions.</li><li>On supprime les signes + des additions et les parenthèses autour des nombres.</li><li>On supprime le signe + d’un nombre placé en début de calcul.</li></ol>
<div class="seyes"><h4>Exemples</h4><p>(−5) + (+3) = −5 + 3 = −2</p><p>(−7) − (+2) = (−7) + (−2) = −7 − 2 = −9</p><p>(+4) − (−6) = (+4) + (+6) = 4 + 6 = 10</p></div>
<p>Dans une écriture simplifiée, 7 − 13 signifie (+7) + (−13), et −4 − 5 signifie (−4) + (−5).</p></section>
<section data-mod="sum"><h3>4. Calculer une somme algébrique</h3>
<p>Une somme algébrique est une suite d’additions et de soustractions.</p>
<ol><li>On transforme les soustractions en additions et on écrit l’expression sans parenthèses.</li><li>On regroupe les nombres positifs d’un côté et les nombres négatifs de l’autre.</li><li>On calcule chaque groupe, puis on termine le calcul.</li></ol>
<div class="seyes"><h4>Exemple</h4><p>A = (−7) + (+5) − (−9) + (+2) − (+6)</p><p>A = −7 + 5 + 9 + 2 − 6</p><p>A = 5 + 9 + 2 − 7 − 6</p><p>A = (5 + 9 + 2) − (7 + 6)</p><p>A = 16 − 13</p><p>A = 3</p></div>
<p>Si l’expression contient deux nombres opposés, on peut les barrer, car leur somme est égale à 0.</p></section>
<section data-mod="mul"><h3>5. Multiplier et diviser deux nombres relatifs</h3>
<div class="retenir"><b>Règle des signes</b>On multiplie (ou on divise) les distances à zéro, puis on applique la règle des signes.<ul><li>Deux nombres de même signe donnent un résultat positif.</li><li>Deux nombres de signes contraires donnent un résultat négatif.</li></ul></div>
<div class="seyes"><h4>Exemples</h4><p>(−4) × (−2,5) = +(4 × 2,5) = 10</p><p>0,2 × (−14) = −(0,2 × 14) = −2,8</p><p>65 : (−5) = −(65 : 5) = −13</p></div>
<p>La division se note avec le signe : ou le signe ÷. On ne divise jamais par 0.</p>
<h3>6. Produit de plusieurs facteurs</h3>
<div class="retenir"><b>Méthode</b>On compte les facteurs négatifs. Si leur nombre est pair, le produit est positif. Si leur nombre est impair, le produit est négatif.</div>
<div class="seyes"><h4>Exemple</h4><p>H = (−6) × 7 × (−8) × (−9)</p><p>H contient 3 facteurs négatifs.</p><p>3 est impair, donc H est négatif.</p></div>
<p>Pour trouver un nombre manquant, on trouve d’abord son signe avec la règle des signes, puis sa distance à zéro. Par exemple, dans 4 × … = −20, le nombre manquant est négatif et sa distance à zéro est 20 : 4 = 5. C’est −5.</p></section>
<section data-mod="prio"><h3>7. Priorités opératoires</h3>
<div class="retenir"><b>Dans quel ordre calculer ?</b><ol><li>Les calculs entre parenthèses ou entre crochets, en commençant par les plus intérieurs.</li><li>Les carrés.</li><li>Les multiplications et les divisions, de gauche à droite.</li><li>Les additions et les soustractions, de gauche à droite.</li></ol></div>
<div class="seyes"><h4>Exemples</h4><p>14 − 10 × 2</p><p>= 14 − 20</p><p>= −6</p><p>[9 − (2 + 4)] × (−3)</p><p>= [9 − 6] × (−3)</p><p>= 3 × (−3)</p><p>= −9</p></div>
<p>Le carré d’un nombre négatif est positif. (−6)² = (−6) × (−6) = 36.</p></section>
</template><script>(() => {

const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=R(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Modelage : toutes les étapes, avec la réponse et l'explication. Pratique guidée : les mêmes étapes, avec l'aide affichée.
   Pratique autonome : la question finale seulement. Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul';
 if(alone)parent.append(dom('p','small','Écris les étapes du calcul sur ton cahier, puis saisis seulement ta réponse.'));

 const tasks=alone?[ex.tasks.at(-1)]:ex.tasks;
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=alone&&t.qAlone?t.qAlone:t.q;const single=tasks.length===1;const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+`<div class="step-q">${q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);let input;
  if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of (t.options.length>2?shuffle(t.options):t.options))input.append(new Option(o,o));}
  else {input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.inputMode='text';input.placeholder='Nombre';}
  input.setAttribute('aria-label','Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   if(!t.options&&parseNum(input.value)===null){feedback.className='fb warn';feedback.textContent='Écris un nombre, par exemple −7 ou 2,5. Le signe moins se tape avec la touche -.';return;}
   const ok=correct(input.value,t.a);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Vérifie tes calculs et tes signes, puis fais un deuxième essai.';input.classList.add('bad');return;}
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);
 }
 next();
}

  const corr=dom('div','seyes ds-corr');corr.hidden=true;corr.innerHTML=`<h4>Correction de l’exercice ${ei+1}</h4>`+ex.items.map((t,qi)=>(ex.items.length>1?`<p><b class="no-math">${LET[qi]})</b></p>`:'')+t.corr).join('');block.append(corr);corrs.push(corr);
 });
 const clear=dsKeep(paper,'relatifs-ds-'+variant);
 const end=button('Vérifier mes résultats et afficher la correction',()=>{let score=0,note=0;setTimeout(()=>SUIVI.ds(variant,note,total));for(const{t,ans,get,fields,w}of controls){const ok=correct(get(),t.a);if(ok){score++;note+=w;}fields.forEach(f=>f.disabled=true);if(t.options)ans.querySelectorAll('label').forEach(l=>{if(l.querySelector('input').value===t.a)l.classList.add('good');});ans.append(dom('span',ok?'okm':'kom',ok?' Juste.':' La bonne réponse est '+answer(t)+'.'));}corrs.forEach(c=>c.hidden=false);
  const sum=dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} résultat${score>1?'s':''} juste${score>1?'s':''} sur ${controls.length}).<p>Cette note ne compte que tes résultats. Ta vraie note dépend aussi de ta rédaction : chaque étape du calcul écrite, signes justes et justification des signes. Compare ta feuille avec la correction de chaque exercice.</p>`);sum.append(button('Effacer mes réponses et recommencer',()=>{clear();render();window.scrollTo({top:0});},'btn light'));end.replaceWith(sum);paper.prepend(dom('div','corrige',`<b>Note provisoire : ${dsNote(note,total)}</b> (${score} sur ${controls.length} résultats justes). La correction est sous chaque exercice, et le détail en bas de la page.`));});
 paper.append(end);
}
function render(){
 const main=$('#app');main.innerHTML='';document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===VIEW.page));
 if(VIEW.page==='cours'){main.append(dom('h2','ttl','<span>Cours · Nombres relatifs</span>'),dom('div','card',$('#course-source').innerHTML));return;}
 if(VIEW.page==='ds'){renderDS();return;}
 if(VIEW.page==='home'){main.append(dom('div','retenir','<b>À retenir</b>Pour chaque opération, on s’occupe d’abord du signe du résultat, puis de sa distance à zéro. Dans un long calcul, on respecte les priorités opératoires.'));const grid=dom('div','home');for(const[k,m]of Object.entries(MODULES)){const card=dom('section','card',`<h2>${m.title}</h2><p>${m.desc}</p>`);card.append(dom('p','suivi-st',SUIVI.status(k)),button('Commencer',()=>go(k)));grid.append(card);}const ds=dom('section','card','<h2>6. D.S. blanc</h2><p>Deux sujets différents sur le modèle du D.S. : tu rédiges sur une feuille, puis tu vérifies tes résultats et tu lis la correction.</p>');ds.append(button('Commencer',()=>go('ds')));grid.append(ds);main.append(grid,SUIVI.box());return;}
 const mod=MODULES[VIEW.page];main.append(dom('h2','ttl','<span>'+mod.title+'</span>'));modeBar(main);
 if(VIEW.mode!=='seul'){const part=$('#course-source').content.querySelector(`[data-mod="${VIEW.page}"]`);if(part){const det=dom('details','cours-part','<summary>Relire le cours de cette partie</summary>');det.append(part.cloneNode(true));main.append(det);}main.append(dom('div','retenir','<b>À retenir</b>'+mod.retain));}
 if(mod.levels){const levels=dom('div','levels');for(const[n,label]of mod.levels)levels.append(button(label,()=>{VIEW.level=n;render();},VIEW.level===n?'on':''));main.append(levels);}
 const panel=dom('div','card');main.append(panel);renderExercise(panel,mod.gen(VIEW.level,VIEW.mode==='exemple'));
}
document.querySelectorAll('nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
})();

</script><script>
/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
