</style></head><body><div class="wrap"><header><a class="back-home" href="../4e/">← Toutes les applications</a><h1><span>Chapitre 4 : Pythagore et racine carrée</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours">Cours</button><button type="button" data-page="sq">1. Carrés et racines</button><button type="button" data-page="voc">2. Hypoténuse</button><button type="button" data-page="hyp">3. Calculer l’hypoténuse</button><button type="button" data-page="side">4. Calculer un côté</button><button type="button" data-page="ds">5. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 4<sup>e</sup></footer></div><template id="course-source"></template><script>(() => {
'use strict';
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=R(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fix=n=>Math.round(n*1e6)/1e6;
const fmt=n=>String(Math.abs(n)<1e-12?0:fix(n)).replace('.',',').replace('-','−');
/* Réponse saisie : on accepte « 13 », « 13 cm », « ≈ 5,4 », « 5,4 cm ». */
function parseNum(v){let s=v.trim().replace(/\s/g,'').replace(/−/g,'-').replace(',','.').replace(/^(≈|=)/,'').replace(/(mm|cm|dm|km|m)(²|2)?$/,'');while(/^\(.*\)$/.test(s))s=s.slice(1,-1);if(!s)return null;return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):null;}
function correct(v,a){if(typeof a==='number'){const n=parseNum(v);return n!==null&&Math.abs(n-a)<1e-8;}return v.trim().toLocaleLowerCase('fr')===String(a).toLocaleLowerCase('fr');}
const answer=t=>t.answerHtml||(typeof t.a==='number'?fmt(t.a):esc(t.a));
function dom(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!==undefined)n.innerHTML=html;return n;}
function button(label,fn,cls='btn'){const b=dom('button',cls,esc(label));b.type='button';b.addEventListener('click',fn);return b;}
const lines=a=>a.map(l=>`<p>${l}</p>`).join('');

/* Outils du chapitre */
const rad=x=>`<span class="rac">√<span>${x}</span></span>`;
const box=s=>`<span class="box">${s}</span>`;
const isSq=n=>{const r=Math.round(Math.sqrt(n));return r*r===n;};
const r1=x=>Math.round(x*10)/10;
const dec3=x=>(Math.floor(x*1000)/1000).toFixed(3).replace('.',',');
const U=['cm','m','km','mm'];
const NAMES=['ABC','DEF','EFG','KLM','MNP','RST','IJK','PQR','UVW','GHI','LMN','XYZ','BCD','HIJ'];
const seg=(u,v)=>[u,v].sort().join('');
/* Un triangle rectangle : r est le sommet de l'angle droit, [RP] et [RQ] les côtés de l'angle droit, H l'hypoténuse. */
function tri(name,ri,swap){const L=[...name],r=L[ri];let [p,q]=L.filter((_,i)=>i!==ri);if(swap)[p,q]=[q,p];return {name,r,p,q,RP:seg(r,p),RQ:seg(r,q),H:seg(p,q)};}
/* Les trois égalités possibles (une seule est juste). L'inconnue, quand elle est à gauche, est écrite en premier, comme dans le cahier. */
function eqFor(t,h,unk){const left=[t.RP,t.RQ,t.H].filter(s=>s!==h).sort();if(unk&&left[1]===unk)left.reverse();return `${left[0]}² + ${left[1]}² = ${h}²`;}
const eqOpts=(t,unk)=>[t.RP,t.RQ,t.H].map(h=>eqFor(t,h,unk));
const hypOpts=t=>[t.RP,t.RQ,t.H].sort().map(s=>`[${s}]`);

/* Figure : triangle rectangle à main levée, angle droit codé, longueurs écrites sur les côtés. */
function triFig(t,lab={},l1=3,l2=4,o={}){
 let k=Math.max(.5,Math.min(2,l2/l1));const th=(o.th??R(0,23)*15)*Math.PI/180,mir=o.mir??R(0,1);
 let pts=[[0,0],[1,0],[0,mir?-k:k]].map(([x,y])=>[x*Math.cos(th)-y*Math.sin(th),-(x*Math.sin(th)+y*Math.cos(th))]);
 const W=300,H=210,M=40,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0;
 const s=Math.min((W-2*M)/w,(H-2*M)/h),dx=(W-s*w)/2,dy=(H-s*h)/2;pts=pts.map(([x,y])=>[dx+(x-x0)*s,dy+(y-y0)*s]);
 const [Rp,Pp,Qp]=pts,G=[(Rp[0]+Pp[0]+Qp[0])/3,(Rp[1]+Pp[1]+Qp[1])/3];
 const out=(p,d)=>{const vx=p[0]-G[0],vy=p[1]-G[1],n=Math.hypot(vx,vy)||1;return [p[0]+d*vx/n,p[1]+d*vy/n];};
 const unit=(a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],n=Math.hypot(vx,vy);return [vx/n,vy/n];};
 const u1=unit(Rp,Pp),u2=unit(Rp,Qp),c=13,mk=[[Rp[0]+c*u1[0],Rp[1]+c*u1[1]],[Rp[0]+c*(u1[0]+u2[0]),Rp[1]+c*(u1[1]+u2[1])],[Rp[0]+c*u2[0],Rp[1]+c*u2[1]]];
 const f=n=>n.toFixed(1),txt=(p,s,cls)=>`<text x="${f(p[0])}" y="${f(p[1])}" class="${cls}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
 const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
 let g=`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="#f6f8fe" stroke="#1d3a8a" stroke-width="2" stroke-linejoin="round"/><polyline points="${mk.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="#1d3a8a" stroke-width="1.6"/>`;
 [[Rp,t.r],[Pp,t.p],[Qp,t.q]].forEach(([p,n])=>{g+=txt(out(p,17),n,'pt');});
 [[Rp,Pp,t.RP],[Rp,Qp,t.RQ],[Pp,Qp,t.H]].forEach(([a,b,sg])=>{if(lab[sg])g+=txt(out(mid(a,b),o.d??20),lab[sg],'lg');});
 return `<svg class="fig tri" viewBox="0 0 ${W} ${H}" role="img" aria-label="Triangle ${t.name} rectangle en ${t.r}">${g}</svg>`;
}
const figNote='<p class="small">La figure n’est pas en vraie grandeur.</p>';

/* Rédaction « comme dans le cahier » : la phrase, l'égalité de Pythagore, les calculs avec les unités, la conclusion encadrée. */
function redac(P){
 const {t,u,kind,a,b,c}=P,unk=kind==='hyp'?t.H:t.RQ,eq=eqFor(t,t.H,unk),val=s=>s===t.RP?a:s===t.RQ?b:c;
 const [s1,s2]=eq.split(' = ')[0].split(' + ').map(s=>s.replace('²',''));
 const mm=s=>`${fmt(val(s))} ${u} × ${fmt(val(s))} ${u}`,sqv=s=>fmt(fix(val(s)**2));
 const L=[`<span class="mg">Pythagore</span>Je sais que ${t.name} est un triangle rectangle en ${t.r}.`,`Le théorème de Pythagore me permet d’écrire que : ${eq}`];
 let N;
 if(kind==='hyp'){N=fix(a*a+b*b);L.push(`<span class="mg">Calcul</span>${mm(s1)} + ${mm(s2)} = ${t.H}²`,`${sqv(s1)} ${u}² + ${sqv(s2)} ${u}² = ${t.H}²`,`${fmt(N)} ${u}² = ${t.H}²`);}
 else{N=fix(c*c-a*a);L.push(`<span class="mg">Calcul</span>${unk}² + ${mm(s2)} = ${mm(t.H)}`,`${unk}² + ${sqv(s2)} ${u}² = ${fmt(fix(c*c))} ${u}²`,`donc ${unk}² = ${fmt(fix(c*c))} ${u}² − ${sqv(s2)} ${u}²`,`${unk}² = ${fmt(N)} ${u}²`);}
 const v=Math.sqrt(N),v2=Math.round(v*100)/100,exact=Math.abs(fix(v2*v2)-N)<1e-9;
 L.push(`${unk} est une longueur, donc ${unk} est positif et la seule solution est ${unk} = ${rad(fmt(N)+' '+u+'²')}.`);
 if(exact)L.push(box(`${unk} = ${fmt(v2)} ${u}`));
 else L.push(`La valeur exacte est ${unk} = ${rad(fmt(N))} ${u}.`,`À la calculatrice : ${rad(fmt(N))} ≈ ${dec3(v)}…`,box(`${unk} ≈ ${fmt(r1(v))} ${u}`)+' <span class="small">(arrondi au dixième)</span>');
 return {lines:L,html:lines(L),N,v,exact,unk,eq,s1,s2,val};
}

/* 1. Carrés et racines carrées. Niveau 1 : carré ; niveau 2 : racine d'un carré parfait ; niveau 3 : valeur approchée. */
function sqExercise(level=1,example=false){
 if(level===1){
  const n=example?8:(R(0,2)?R(2,20):pick([1.5,2.5,3.5,6.5,7.5,8.5,9.5,0.5,0.3,0.4,0.6,0.7,0.9,1.2,1.1,1.3])),N=fix(n*n);
  const ops=[`${fmt(n)} × ${fmt(n)}`,`${fmt(n)} × 2`,`${fmt(n)} + ${fmt(n)}`];
  return {head:`<p>Calcule <span class="m">${fmt(n)}²</span>.</p>`,tasks:[
   {q:`Pour calculer ${fmt(n)}², quel calcul fais-tu ?`,options:ops,a:ops[0],hint:'Le carré d’un nombre, c’est ce nombre multiplié par lui-même. Ce n’est pas le double.',corr:`${fmt(n)}² = ${fmt(n)} × ${fmt(n)}. Attention, ${fmt(n)} × 2 serait le double de ${fmt(n)}.`},
   {q:`Combien vaut ${fmt(n)}² ?`,a:N,hint:`Calcule ${fmt(n)} × ${fmt(n)}.`,corr:`${fmt(n)} × ${fmt(n)} = ${fmt(N)}.`}],
   correction:lines([`${fmt(n)}² = ${fmt(n)} × ${fmt(n)} = ${fmt(N)}`])};
 }
 if(level===2){
  const k=example?7:(R(0,3)?R(2,20):pick([0.5,1.5,2.5,3.5,4.5,0.3,0.6,0.8,1.2])),N=fix(k*k);
  const def=[`le nombre positif dont le carré est ${fmt(N)}`,`la moitié de ${fmt(N)}`,`le nombre positif dont le double est ${fmt(N)}`];
  return {head:`<p>Calcule <span class="m">${rad(fmt(N))}</span>.</p>`,tasks:[
   {q:`Que cherche-t-on quand on calcule ${rad(fmt(N))} ?`,options:def,a:def[0],hint:'Relis la définition de la racine carrée dans le cours.',corr:`${rad(fmt(N))} est le nombre positif dont le carré est ${fmt(N)}.`},
   {q:`Combien vaut ${rad(fmt(N))} ?`,a:k,hint:`Cherche le nombre qui, multiplié par lui-même, donne ${fmt(N)}. Essaie plusieurs nombres, ou utilise la touche √ de la calculatrice.`,corr:`${fmt(k)} × ${fmt(k)} = ${fmt(N)}, donc ${rad(fmt(N))} = ${fmt(k)}.`}],
   correction:lines([`${rad(fmt(N))} = ${rad(fmt(k)+' × '+fmt(k))} = ${fmt(k)}`])};
 }
 let N;if(example)N=30;else if(!R(0,3))N=R(2,15)**2;else do N=R(2,150);while(isSq(N));
 const sq=isSq(N),a=Math.floor(Math.sqrt(N)),v=Math.sqrt(N);
 const why=sq?`${a} × ${a} = ${N}, donc ${N} est un carré parfait.`:`${a}² = ${a*a} et ${a+1}² = ${(a+1)*(a+1)}. Aucun nombre entier n’a pour carré ${N}, donc ${N} n’est pas un carré parfait.`;
 return {head:`<p>On veut la racine carrée de <span class="m">${N}</span>. Si elle ne tombe pas juste, donne la valeur arrondie au dixième.</p>`,tasks:[
  {q:`${N} est-il un carré parfait ?`,options:['oui','non'],a:sq?'oui':'non',hint:'Un carré parfait est le carré d’un nombre entier. Calcule 2², 3², 4², 5²… et regarde si tu tombes sur '+N+'.',corr:why},
  sq?{q:`Combien vaut ${rad(N)} ?`,qAlone:`Combien vaut ${rad(N)} ? Si le résultat ne tombe pas juste, arrondis au dixième.`,a:a,hint:`Cherche le nombre entier dont le carré est ${N}.`,corr:`${a} × ${a} = ${N}, donc ${rad(N)} = ${a}.`}
    :{q:`À la calculatrice, donne ${rad(N)} arrondi au dixième.`,qAlone:`Combien vaut ${rad(N)} ? Si le résultat ne tombe pas juste, arrondis au dixième.`,a:r1(v),hint:'Tape la touche √ puis le nombre. Pour arrondir au dixième, regarde le chiffre des centièmes : s’il vaut 5 ou plus, on augmente le chiffre des dixièmes.',corr:`La calculatrice affiche ${dec3(v)}…, donc ${rad(N)} ≈ ${fmt(r1(v))}.`}],
  correction:lines(sq?[`${rad(N)} = ${rad(a+' × '+a)} = ${a}`]:[`${N} n’est pas un carré parfait, donc ${rad(N)} ne tombe pas juste.`,`À la calculatrice : ${rad(N)} ≈ ${dec3(v)}…`,box(`${rad(N)} ≈ ${fmt(r1(v))}`)])};
}

/* 2. Hypoténuse et égalité de Pythagore. Niveau 1 : avec la figure codée ; niveau 2 : avec l'énoncé seul. */
function vocExercise(level=1,example=false){
 const t=example?tri('RST',1):tri(pick(NAMES),R(0,2)),eq=eqFor(t,t.H),hy=`[${t.H}]`;
 const fig=level===1?triFig(t,{},3,R(2,5),example?{th:20,mir:0}:{}):'';

 if(level===1)tasks.push({q:`En quel sommet le triangle ${t.name} est-il rectangle ?`,options:[...t.name],a:t.r,hint:'Cherche le petit carré qui code l’angle droit sur la figure.',corr:`Le petit carré est au sommet ${t.r}, donc le triangle ${t.name} est rectangle en ${t.r}.`});
 tasks.push({q:`Quelle est l’hypoténuse du triangle ${t.name} ?`,options:hypOpts(t),a:hy,hint:`L’hypoténuse est le côté opposé à l’angle droit, donc le côté qui ne passe pas par ${t.r}.`,corr:`Le côté opposé à l’angle droit en ${t.r} est ${hy}. C’est le plus long des trois côtés.`},
  {q:'Quelle égalité le théorème de Pythagore permet-il d’écrire ?',options:eqOpts(t),a:eq,hint:`Le carré de l’hypoténuse ${t.H}² est seul d’un côté du signe =.`,corr:`L’hypoténuse est ${hy}, donc ${t.H}² est seul : ${eq}.`});
 return {head:level===1?`<p>Observe la figure codée du triangle ${t.name}.</p>${fig}`:`<p>Le triangle ${t.name} est rectangle en ${t.r}.</p>`,tasks,

/* 3 et 4. Calculer une longueur. Niveau 1 : le résultat tombe juste ; niveau 2 : valeur exacte puis arrondi au dixième. */
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25],[9,12,15],[12,16,20],[20,21,29],[9,40,41],[15,20,25],[10,24,26],[1.5,2,2.5],[0.6,0.8,1],[2.4,3.2,4],[4.5,6,7.5],[30,40,50]];
function pythData(kind,level,example){
 let t,u,a,b,c,o={};
 if(example){u='cm';o={th:0,mir:0};
  if(kind==='hyp'){t=tri('EFG',1);[a,b]=level===2?[3,7]:[6,8];c=Math.sqrt(a*a+b*b);}
  else{t=tri('MNP',2);u='m';if(level===2){c=9;a=4;}else{c=26;a=10;}b=Math.sqrt(c*c-a*a);o={th:90,mir:1};}}
 else{t=tri(pick(NAMES),R(0,2));u=pick(U);
  if(level===1){const tr=pick(TRIPLES),sw=R(0,1);a=tr[sw];b=tr[1-sw];c=tr[2];}
  else if(kind==='hyp'){do{a=R(2,12);b=R(2,12);}while(isSq(a*a+b*b));c=Math.sqrt(a*a+b*b);}
  else{do{c=R(5,15);a=R(2,c-1);}while(isSq(c*c-a*a));b=Math.sqrt(c*c-a*a);}}
 return {t,u,a,b,c,kind,o};
}
function pythExercise(kind,level,example){
 const P=pythData(kind,level,example),{t,u,a,b,c}=P,d=redac(P),unk=d.unk,hy=`[${t.H}]`;
 const lab={[t.RP]:fmt(a)+' '+u};
 if(kind==='hyp'){lab[t.RQ]=fmt(fix(b))+' '+u;lab[t.H]='?';}else{lab[t.H]=fmt(c)+' '+u;lab[t.RQ]='?';}
 const given=kind==='hyp'?`${t.RP} = ${fmt(a)} ${u} et ${t.RQ} = ${fmt(b)} ${u}`:`${t.H} = ${fmt(c)} ${u} et ${t.RP} = ${fmt(a)} ${u}`;
 const asked=d.exact?`Calcule la longueur ${unk}.`:`Calcule la longueur ${unk}. Donne la valeur exacte, puis la valeur arrondie au dixième.`;
 const k=d.s2,kv=fmt(fix(d.val(k)**2)),cv=fmt(fix(c*c));
 const tasks=[
  {q:`Le triangle ${t.name} est rectangle en ${t.r}. Quelle est son hypoténuse ?`,options:hypOpts(t),a:hy,hint:`L’hypoténuse est le côté opposé à l’angle droit, donc le côté qui ne passe pas par ${t.r}.`,corr:`L’angle droit est en ${t.r}. Le côté opposé est ${hy} : c’est l’hypoténuse.`},
  {q:'Quelle égalité le théorème de Pythagore permet-il d’écrire ?',options:eqOpts(t,unk),a:d.eq,hint:`Le carré de l’hypoténuse ${t.H}² est seul d’un côté du signe =.`,corr:`L’hypoténuse est ${hy}, donc ${t.H}² est seul : ${d.eq}.`},
  kind==='hyp'
   ?{q:`Remplace les longueurs connues et calcule. Combien vaut ${unk}², en ${u}² ?`,a:d.N,hint:`Calcule ${fmt(d.val(d.s1))} × ${fmt(d.val(d.s1))} et ${fmt(d.val(d.s2))} × ${fmt(d.val(d.s2))}, puis additionne les deux résultats.`,corr:`${fmt(d.val(d.s1))} × ${fmt(d.val(d.s1))} + ${fmt(d.val(d.s2))} × ${fmt(d.val(d.s2))} = ${fmt(fix(d.val(d.s1)**2))} + ${fmt(fix(d.val(d.s2)**2))} = ${fmt(d.N)}, donc ${unk}² = ${fmt(d.N)} ${u}².`}
   :{q:`Remplace les longueurs connues : ${unk}² + ${kv} = ${cv}. Combien vaut ${unk}², en ${u}² ?`,a:d.N,hint:`Il faut ajouter ${unk}² à ${kv} pour obtenir ${cv}. Calcule donc ${cv} − ${kv}.`,corr:`${unk}² = ${cv} − ${kv} = ${fmt(d.N)}, donc ${unk}² = ${fmt(d.N)} ${u}².`},
  d.exact
   ?{q:`Combien mesure ${unk}, en ${u} ?`,qAlone:`Combien mesure ${unk} ? Donne ta réponse en ${u}.`,a:Math.round(d.v*100)/100,hint:`${unk} est le nombre positif dont le carré est ${fmt(d.N)}. Utilise la touche √ de la calculatrice.`,corr:`${unk} = ${rad(fmt(d.N))} = ${fmt(Math.round(d.v*100)/100)} ${u}.`}
   :{q:`La valeur exacte est ${unk} = ${rad(fmt(d.N))} ${u}. Donne ${unk} arrondi au dixième, en ${u}.`,qAlone:`Combien mesure ${unk} ? Donne la valeur arrondie au dixième, en ${u}.`,a:r1(d.v),hint:'Tape la touche √ puis le nombre. Pour arrondir au dixième, regarde le chiffre des centièmes.',corr:`À la calculatrice, ${rad(fmt(d.N))} ≈ ${dec3(d.v)}…, donc ${unk} ≈ ${fmt(r1(d.v))} ${u}.`}];
 return {head:`<p>Le triangle ${t.name} est rectangle en ${t.r}. On donne ${given}.</p><p>${asked}</p>${triFig(t,lab,a,b,P.o)}${figNote}`,tasks,correction:d.html};
}
const hypExercise=(l=1,e=false)=>pythExercise('hyp',l,e),sideExercise=(l=1,e=false)=>pythExercise('side',l,e);

 const ex1=redac({t:tri('ABC',1),u:'cm',kind:'hyp',a:12,b:5,c:13}),ex2=redac({t:tri('ABC',2),u:'m',kind:'side',a:15,b:8,c:17}),ex3=redac({t:tri('ABC',1),u:'cm',kind:'hyp',a:2,b:5,c:Math.sqrt(29)});

 return `<section data-mod="sq"><h3>1. Carrés parfaits et racine carrée</h3>
<div class="retenir"><b>Carré parfait</b>On appelle carré parfait le carré d’un nombre entier.</div>
<p>Exemples : 9 = 3² ; 4 = 2² ; 16 = 4² ; 121 = 11².</p>
<div class="retenir"><b>Racine carrée</b>Soit <i class="m">a</i> un nombre positif. La racine carrée de <i class="m">a</i>, notée ${rad('<i class="m">a</i>')}, est l’unique nombre positif dont le carré est <i class="m">a</i>.</div>
<div class="seyes"><h4>Exemples</h4><p>${rad('36')} = ${rad('6²')} = 6</p><p>${rad('196')} = ${rad('14²')} = 14</p><p>${rad('10')} ne tombe pas juste : ${rad('10')} ≈ 3,2</p></div>
<p>La racine carrée d’un carré parfait est un nombre entier. En général, une racine carrée ne tombe pas juste : on utilise alors une valeur approchée, avec la touche √ de la calculatrice.</p></section>
<section data-mod="voc"><h3>2. Hypoténuse et théorème de Pythagore</h3>

<section data-mod="side"><h3>4. Calculer un côté de l’angle droit</h3>

/* Mon travail : suivi léger, enregistré dans le navigateur (clé propre à l'app).
   On compte les exercices finis dans « Je m'entraîne seul » (et ceux réussis sans erreur),
   et la dernière note provisoire de chaque D.S. blanc. Le code résume ce travail pour le professeur. */
function makeSuivi(app,prefix,modules){
 const KEY=app+'-suivi',B36=n=>Math.max(0,Math.min(1295,n|0)).toString(36).toUpperCase().padStart(2,'0');
 let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
 st.m=st.m||{};st.ds=st.ds||{};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
 const sum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h;};
 const nf=x=>String(x).replace('.',',');
 const fait=(f,r)=>f?`${f} exercice${f>1?'s':''} fait${f>1?'s':''} seul, dont ${r} sans erreur`:'pas commencé';
 function code(){const day=Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);let b=B36(day);
  modules.forEach(([k],i)=>{const r=st.m[k];if(r&&r[0])b+=String(i)+'M'+B36(r[0])+B36(r[1]);});
  Object.keys(st.ds).sort().forEach(s=>{const d=st.ds[s];b+='D'+s+B36(Math.round(d.n*2))+B36(Math.round(d.max*2));});
  return (prefix+b+B36(sum(b))).match(/.{1,6}/g).join('-');}
 function decode(str){const s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');if(!s.startsWith(prefix)||s.length<prefix.length+4)return null;
  const b=s.slice(prefix.length,-2);if(sum(b)!==parseInt(s.slice(-2),36))return null;
  const out={date:new Date(Date.UTC(2026,0,1)+parseInt(b.slice(0,2),36)*864e5),m:{},ds:{}};
  for(let i=2;i+6<=b.length;i+=6){const e=b.slice(i,i+6);
   if(e[0]==='D')out.ds[e[1]]={n:parseInt(e.slice(2,4),36)/2,max:parseInt(e.slice(4,6),36)/2};
   else{const mod=modules[+e[0]];if(!mod||e[1]!=='M')return null;out.m[mod[0]]=[parseInt(e.slice(2,4),36),parseInt(e.slice(4,6),36)];}}
  return out;}
 function table(d){const rows=modules.map(([k,l])=>{const r=d.m[k]||[0,0];return `<tr><td>${l}</td><td>${r[0]?r[0]:'—'}</td><td>${r[0]?r[1]:'—'}</td></tr>`;}).join('');
  const ds=Object.keys(d.ds).sort().map(s=>`Sujet ${s === 'R' ? 'tiré au hasard' : s} : ${nf(d.ds[s].n)} / ${nf(d.ds[s].max)}`).join(' ; ');
  return `<table class="suivi-t"><tr><th>Partie</th><th>Exercices faits seul</th><th>Sans erreur</th></tr>${rows}</table><p>Dernière note provisoire au D.S. blanc : ${ds||'pas encore de D.S. vérifié'}.</p>`;}

function renderExercise(parent,ex){

  input.setAttribute('aria-label','Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   if(!t.options&&parseNum(input.value)===null){feedback.className='fb warn';feedback.textContent='Écris un nombre, par exemple −7 ou 2,5. Le signe moins se tape avec la touche -.';return;}

  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);
 }
 next();
}

  opt(`Le triangle ${t[1].name} est rectangle en ${t[1].r}. Quelle est son hypoténuse ?`,hypOpts(t[1]),`[${t[1].H}]`,[`Le côté opposé à l’angle droit en ${t[1].r} est [${t[1].H}].`],1)]});
 const calc=(title,P,pts,lab,o)=>{const d=redac(P),u=P.u,given=P.kind==='hyp'?`${P.t.RP} = ${fmt(P.a)} ${u} et ${P.t.RQ} = ${fmt(P.b)} ${u}`:`${P.t.H} = ${fmt(P.c)} ${u} et ${P.t.RP} = ${fmt(P.a)} ${u}`;
  return {title,pts,head:`<p>Le triangle ${P.t.name} est rectangle en ${P.t.r}. On donne ${given}. Calcule ${d.unk}${d.exact?'':' : donne la valeur exacte, puis la valeur arrondie au dixième'}.</p>${triFig(P.t,lab,P.a,P.b,o)}`,items:[

   vocI(t2,triFig(t2[0],{},4,2.5,{th:200,mir:0})),

   calc('Calculer un côté de l’angle droit',P4,3,{EF:'41 cm',DE:'9 cm',DF:'?'},{th:105,mir:1}),
   calc('Valeur exacte et valeur approchée',P5,3,{MN:'5 cm',NO:'7 cm',MO:'?'},{th:150,mir:0}),
   {title:'Problème',pts:5,head:`<p>Un terrain de sport a la forme d’un rectangle ABCD, avec AB = 60 m et BC = 25 m. Léo traverse le terrain en ligne droite de A à C. Quelle distance parcourt-il ?</p><svg class="fig" viewBox="0 0 300 160" role="img" aria-label="Rectangle ABCD et sa diagonale [AC]"><rect x="40" y="35" width="220" height="92" fill="#f6f8fe" stroke="#1d3a8a" stroke-width="2"/><line x1="40" y1="127" x2="260" y2="35" stroke="#1d3a8a" stroke-width="2" stroke-dasharray="7 5"/><polyline points="247,127 247,114 260,114" fill="none" stroke="#1d3a8a" stroke-width="1.6"/><text x="28" y="140" class="pt">A</text><text x="268" y="140" class="pt">B</text><text x="268" y="30" class="pt">C</text><text x="28" y="30" class="pt">D</text><text x="150" y="146" class="lg" text-anchor="middle">60 m</text><text x="282" y="84" class="lg" text-anchor="middle">25 m</text></svg>`,items:[

 }

/* D.S. blanc : les réponses restent enregistrées dans le navigateur (une clé par sujet),

function dsKeep(paper,key){const els=()=>[...paper.querySelectorAll('input,select,textarea')].filter(e=>!['button','hidden','submit'].includes(e.type));
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v))els().forEach((e,i)=>{if(i>=v.length)return;if(e.type==='radio'||e.type==='checkbox')e.checked=!!v[i];else e.value=v[i]==null?'':v[i];});}catch(e){}
 let dead=false;const save=()=>setTimeout(()=>{if(dead)return;try{localStorage.setItem(key,JSON.stringify(els().map(e=>e.type==='radio'||e.type==='checkbox'?e.checked:e.value)));}catch(e){}},0);
 ['input','change','click'].forEach(ev=>paper.addEventListener(ev,save));
 return ()=>{dead=true;try{localStorage.removeItem(key);}catch(e){}};}
function dsNote(n,total){return String(Math.round(n*2)/2).replace('.',',')+' / '+total;}
function renderDS(){
 const main=$('#app');main.append(dom('h2','ttl','<span>5. D.S. blanc</span>'));const bar=dom('div','subtabs');const variant=VIEW.variant||'A';for(const v of ['A','B'])bar.append(button('Sujet '+v,()=>{VIEW.variant=v;render();},variant===v?'on':''));bar.append(button('Imprimer le sujet',()=>window.print(),'btn light'));main.append(bar);

  const block=dom('section','ds-exo',`<h3>Exercice ${ei+1} · ${ex.title} <span class="small">(${ex.pts} points)</span></h3>${ex.head}`);paper.append(block);

   const letter=ex.items.length>1?`<span class="no-math">${LET[qi]})</span> `:'',id=`ds-${ei}-${qi}`,row=dom('div','ds-item'),ans=dom('div','ds-ans');row.append(dom('div','ds-q',letter+t.q),ans);block.append(row);let get,fields;

   else{const lab=dom('label','ds-lab','Résultat'),input=dom('input','eq-input');input.type='text';input.id=id;input.autocomplete='off';input.placeholder='Nombre';lab.htmlFor=input.id;ans.append(lab,input);get=()=>input.value;fields=[input];}

  });

}

<script>
/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
</body></html>
