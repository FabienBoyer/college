</style></head><body><div class="wrap"><header><a class="back-home" href="../">← Toutes les applications</a><h1><span>Chapitre 1 : Arithmétique</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours" class="">Cours</button><button type="button" data-page="multiples" class="">1. Divisibilité</button><button type="button" data-page="primes" class="">2. Nombres premiers</button><button type="button" data-page="gcd" class="">3. PGCD / PPCM</button><button type="button" data-page="fractions" class="">4. Fractions</button><button type="button" data-page="problems" class="">5. Problèmes</button><button type="button" data-page="ds" class="">6. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 3<sup>e</sup></footer></div><template id="course-source"><h3>1. Multiple, diviseur et division euclidienne</h3>
<div class="retenir"><b>Définition</b>Soient a un entier naturel et b un entier naturel non nul. On dit que a est divisible par b s’il existe un entier naturel k tel que a = b × k. Alors a est un multiple de b et b est un diviseur de a.</div>
<p>Dans la division euclidienne <span class="m">a = bq + r</span>, avec <span class="m">0 ≤ r &lt; b</span>, la divisibilité correspond au cas <span class="m">r = 0</span>.</p>
<div class="seyes"><h4>Exemple</h4><p>72 = 24 × 3.</p><p>72 est un multiple de 24 ; 24 est un diviseur de 72.</p></div>
<p>0 est un multiple de tout entier naturel non nul. 1 divise tous les entiers naturels. On ne divise pas par 0.</p>
<h3>2. Critères de divisibilité</h3>
<div class="table-scroll"><table class="tab"><tr><th>Par</th><th>Critère</th></tr><tr><td>2</td><td>Le dernier chiffre est 0, 2, 4, 6 ou 8.</td></tr><tr><td>3</td><td>La somme des chiffres est divisible par 3.</td></tr><tr><td>4</td><td>Le nombre formé par les deux derniers chiffres est divisible par 4.</td></tr><tr><td>5</td><td>Le dernier chiffre est 0 ou 5.</td></tr><tr><td>6</td><td>Le nombre est divisible à la fois par 2 et par 3.</td></tr><tr><td>9</td><td>La somme des chiffres est divisible par 9.</td></tr></table></div>
<p>Par exemple, <span class="m">2 + 5 + 2 = 9</span>, donc 252 est divisible par 9 et par 3.</p>
<h3>3. Nombres pairs et impairs</h3>
<div class="retenir"><b>Définitions</b>Un entier naturel n est pair s’il existe un entier naturel k tel que n = 2k. Il est impair s’il existe un entier naturel k tel que n = 2k + 1.</div>
<p>Pour démontrer une propriété portant sur tous les nombres pairs ou impairs, on utilise ces écritures.</p>
<details><summary>Exemple de démonstration : le carré d’un impair est impair</summary><div class="seyes"><h4>Démonstration</h4><p>Soit n = 2k + 1 avec k entier naturel.</p><p>n² = (2k + 1)² = 4k² + 4k + 1.</p><p>Donc n² = 2(2k² + 2k) + 1.</p><p>Comme 2k² + 2k est un entier naturel, n² est impair.</p></div></details>
<h3>4. Chercher les diviseurs d’un entier positif</h3>
<p>On cherche toutes les paires de facteurs. Chaque paire fournit un ou deux diviseurs.</p>
<div class="seyes"><h4>Exemple · Diviseurs de 56</h4><p>56 = 1 × 56 = 2 × 28 = 4 × 14 = 7 × 8.</p><p>Ses diviseurs positifs sont 1 ; 2 ; 4 ; 7 ; 8 ; 14 ; 28 ; 56.</p></div>
<h3>5. Nombres premiers</h3>
<div class="retenir"><b>Définition</b>Un nombre premier est un entier naturel supérieur ou égal à 2 qui possède exactement deux diviseurs positifs distincts : 1 et lui-même.</div>
<p>1 n’est pas premier. 2 est le seul nombre premier pair. Pour vérifier qu’un entier n ≥ 2 est premier, il suffit de tester les diviseurs premiers inférieurs ou égaux à √n.</p>

<h3>6. Décomposer en produit de facteurs premiers</h3>
<div class="retenir"><b>Propriété</b>Tout entier naturel supérieur ou égal à 2 s’écrit comme un produit de nombres premiers. Cette décomposition est unique à l’ordre des facteurs près.</div>
<p>On divise successivement par des nombres premiers jusqu’à obtenir 1. Le dernier produit ne doit contenir que des facteurs premiers.</p>
<div class="seyes"><h4>Exemple</h4><p>324 = 2 × 162 = 2 × 2 × 81.</p><p>324 = 2 × 2 × 3 × 3 × 3 × 3 = 2² × 3⁴.</p></div>
<h3>7. PGCD et PPCM de deux entiers positifs</h3>
<p>Le <strong>PGCD</strong> est leur plus grand diviseur commun. Dans les décompositions, on conserve les facteurs premiers communs avec les plus petits exposants.</p>
<p>Le <strong>PPCM</strong> est leur plus petit multiple commun <strong>strictement positif</strong>. On conserve tous les facteurs premiers nécessaires avec les plus grands exposants.</p>
<div class="seyes"><h4>Exemples</h4><p>162 = 2 × 3⁴ et 108 = 2² × 3³.</p><p>PGCD(162 ; 108) = 2 × 3³ = 54.</p><p>12 = 2² × 3 et 28 = 2² × 7.</p><p>PPCM(12 ; 28) = 2² × 3 × 7 = 84.</p></div>
<h3>8. Fraction irréductible</h3>
<p>Une fraction d’entiers est irréductible lorsque le numérateur et le dénominateur n’ont pas de diviseur commun positif autre que 1. Pour l’obtenir, on peut diviser les deux termes par leur PGCD.</p>
<div class="seyes"><h4>Exemple</h4><p>198 = 2 × 3² × 11 et 84 = 2² × 3 × 7.</p><p>PGCD(198 ; 84) = 6.</p><p>198/84 = (198 ÷ 6)/(84 ÷ 6) = 33/14.</p><p>33 et 14 sont premiers entre eux : 33/14 est irréductible.</p></div>
<h3>9. Choisir la bonne méthode dans un problème</h3>
<ul><li><strong>Partage maximal :</strong> pour faire le plus grand nombre de lots identiques sans reste, on cherche le PGCD des quantités. On divise ensuite chaque quantité par ce nombre pour obtenir la composition d’un lot.</li><li><strong>Phénomènes périodiques :</strong> pour trouver la première rencontre après un départ commun, on cherche le PPCM des durées.</li></ul>
<div class="seyes"><h4>Exemples</h4><p>Avec 175 objets rouges et 105 bleus, on fait au maximum 35 lots.</p><p>Chaque lot contient 175 ÷ 35 = 5 rouges et 105 ÷ 35 = 3 bleus.</p><p>Deux circuits de 280 s et 350 s reviennent ensemble au départ après 1400 s.</p><p>1400 = 23 × 60 + 20 : soit 23 min 20 s.</p></div>
<details><summary>Pour réfléchir : existe-t-il un nombre premier parfait ?</summary><p>Un entier positif est parfait si la somme de tous ses diviseurs positifs est égale à son double. Si p est premier, ses seuls diviseurs sont 1 et p. S’il était parfait, on aurait 1 + p = 2p, donc p = 1. Or 1 n’est pas premier. Il n’existe donc aucun nombre premier parfait.</p></details>

function correct(v,a){return checkArithmetic(v,a);}
let problemKind="sharing";
const VIEW={page:'home',mode:'exemple',level:1};
function go(id){VIEW.page=id;render();window.scrollTo({top:0});}
function modeBar(parent){const bar=dom('div','subtabs');for(const[key,label]of[['exemple','Je regarde un exemple'],['aide','Je m’entraîne avec de l’aide'],['seul','Je m’entraîne seul']])bar.append(button(label,()=>{VIEW.mode=key;render();},VIEW.mode===key?'on':''));parent.append(bar);}
function renderExercise(parent,ex){
 parent.append(dom('div','exo-head',ex.head));const box=dom('div','steps');parent.append(box);
 const tasks=VIEW.mode==='seul'&&VIEW.page==='solve'?[ex.tasks.at(-1)]:ex.tasks;
 if(VIEW.mode==='seul')parent.prepend(dom('p','small','Rédige les calculs et les justifications sur ton cahier avant de saisir tes réponses. Sépare les listes par des points-virgules. Pour les produits, écris par exemple 2*2*3 ou 2^2*3 ; pour les fractions, écris a/b.'));
 let step=0;
 function next(){
  if(step>=tasks.length){parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step],i=step++;const row=dom('div','step',`<div class="step-n">Étape ${step} sur ${tasks.length}</div><div class="step-q">${t.q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);let input;
  if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of t.options)input.append(new Option(o,o));}
  else {input=dom('input');input.type='text';input.className='eq-input';input.placeholder=typeof t.a==='number'?'Nombre ou fraction':'Réponse';if(typeof t.a==='number')input.inputMode='text';}
  input.setAttribute('aria-label','Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   const ok=correct(input.value,t.a);tries++;
   if(!ok&&VIEW.mode==='aide'&&tries<2){feedback.className='fb warn';feedback.innerHTML='Pas encore. '+(t.hint||'Relis la méthode et réessaie.');return;}
   input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?"C’est juste.":'Réponse attendue : '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small',t.hint));
 }
 next();
}
function renderDS(){
 const main=$('#app');main.append(dom('h2','ttl','<span>6. D.S. blanc</span>'));const bar=dom('div','subtabs');let variant=VIEW.variant||'A';for(const v of ['A','B'])bar.append(button('Sujet '+v,()=>{VIEW.variant=v;render();},variant===v?'on':''));bar.append(button('Imprimer le sujet',()=>window.print(),'btn light'));main.append(bar);
 const paper=dom('div','card ds');paper.append(dom('h3','','Sujet '+variant),dom('p','','Travaille sur une feuille. Chaque réponse vaut 1 point. Rédige aussi les critères utilisés, les décompositions, les calculs et la conclusion. Pour les produits, utilise * ou × et éventuellement les puissances, comme 2^3*5. Sépare les listes par des points-virgules.'));main.append(paper);const controls=[];
 dsData(variant).forEach((ex,ei)=>{const block=dom('section','ds-exo',`<h3>${ex.title} <span class="small">(4 points)</span></h3>${ex.head}`);paper.append(block);ex.tasks.forEach((t,qi)=>{const row=dom('div','step');const lab=dom('label','step-q',t.q);const input=dom('input','eq-input');input.type='text';input.id=`ds-${ei}-${qi}`;input.autocomplete='off';lab.htmlFor=input.id;row.append(lab,input);block.append(row);controls.push({t,row,input});});});
 const end=button('Vérifier mes réponses et afficher la correction',()=>{let score=0;for(const{t,row,input}of controls){const ok=correct(input.value,t.a);if(ok)score++;input.disabled=true;row.append(dom('div','fb '+(ok?'ok':'ko'),`<b>${ok?'Réponse juste.':'Réponse attendue : '+answer(t)+'.'}</b> ${t.corr}`));}end.replaceWith(dom('div','corrige',`<b>${score} réponse${score===1?'':'s'} juste${score===1?'':'s'} sur 20.</b><p>Vérifie aussi ta rédaction : critère de divisibilité, décompositions, choix du PGCD ou du PPCM, calculs et phrase de conclusion avec l’unité.</p>`));});paper.append(end);
}
function render(){
 const main=$('#app');main.innerHTML='';document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===VIEW.page));
 if(VIEW.page==='cours'){main.append(dom('h2','ttl','<span>Cours · Arithmétique</span>'),dom('div','card',$('#course-source').innerHTML));return;}

 const mod=MODULES[VIEW.page];main.append(dom('h2','ttl','<span>'+mod.title+'</span>'));modeBar(main);main.append(dom('div','retenir','<b>À retenir</b>'+mod.retain));if(VIEW.page==='solve'){const levels=dom('div','levels');for(const[n,label]of[[1,'1. Simples'],[2,'2. Deux membres'],[3,'3. Parenthèses']])levels.append(button(label,()=>{VIEW.level=n;render();},VIEW.level===n?'on':''));main.append(levels);}
 if(VIEW.page==='problems'){const choices=dom('div','levels');for(const[k,l]of[['sharing','Partage maximal'],['period','Cycles et périodicité']])choices.append(button(l,()=>{problemKind=k;render();},problemKind===k?'on':''));main.append(choices);}const panel=dom('div','card');main.append(panel);renderExercise(panel,VIEW.page==='problems'?(problemKind==='sharing'?sharingExercise(VIEW.mode==='exemple'):periodExercise(VIEW.mode==='exemple')):mod.gen(VIEW.mode==='exemple'));
}
document.querySelectorAll('nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
})();
</script><script>
/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
