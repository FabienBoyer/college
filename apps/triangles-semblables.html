<body>
<div class="wrap">
  <header>
    <h1><span>Chapitre 3 : Triangles semblables</span></h1>
    <p>Je prépare mon D.S. de fin de chapitre.</p>
    <nav id="tabs"></nav>
  </header>
  <main id="app"></main>
  <footer>Collège La Rochefoucauld · Mathématiques 3<sup>e</sup></footer>
</div>
<script>
"use strict";
/* ================= Outils ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const POOL="ABCDEFGHJKLMNPRSTUVWXYZ".split("");
const letters=n=>shuffle(POOL).slice(0,n);
const round=(x,d=2)=>Number((x+(x>=0?1e-9:-1e-9)).toFixed(d));
const fr=(x,d=2)=>String(round(x,d)).replace(".",",");
const isDec=(x,d)=>Math.abs(x*10**d-Math.round(x*10**d))<1e-6;
const norm=s=>s.split("").sort().join("");
const m=s=>`<span class="m">${s}</span>`;
const A3=s=>`<span class="ang">${s}</span>`;
const A1=s=>`<span class="ang one">${s}</span>`;
const F=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const SEG=s=>m(`[${s}]`);
const angName=(T,i)=>{const o=[0,1,2].filter(j=>j!==i).map(j=>T[j]);return o[0]+T[i]+o[1];};
const oppSide=(T,i)=>[0,1,2].filter(j=>j!==i).map(j=>T[j]).join("");
const sortedAngles=A=>A.slice().sort((x,y)=>y-x).map(x=>x+"°");
const listFr=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" et "+a[a.length-1];
function parseNum(s){s=String(s).replace(/\s/g,"").replace(/(cm|m|°)$/i,"").replace(",",".");return /^-?\d+(\.\d+)?$/.test(s)?Number(s):null;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function mkBtn(label,fn,cls="btn"){const b=el("button",cls,label);b.type="button";b.onclick=fn;return b;}

/* ================= Géométrie ================= */
const rad=x=>x*Math.PI/180;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]);
const unit=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l];};
const rot=(p,t)=>[p[0]*Math.cos(t)-p[1]*Math.sin(t),p[0]*Math.sin(t)+p[1]*Math.cos(t)];
const dir=t=>[Math.cos(t),Math.sin(t)];
function triAngles(A){return [[0,0],[Math.sin(rad(A[2])),0],mul(dir(rad(A[0])),Math.sin(rad(A[1])))];}
function triSides(d01,d02,d12){const x=(d01*d01+d02*d02-d12*d12)/(2*d01);return [[0,0],[d01,0],[x,Math.sqrt(Math.max(0,d02*d02-x*x))]];}
function transform(pts,o={}){const t=o.t||0,k=o.k||1;return pts.map(p=>{let q=o.flip?[p[0],-p[1]]:p;q=rot(q,t);return [q[0]*k+(o.dx||0),q[1]*k+(o.dy||0)];});}
function bbox(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const b={minx:Math.min(...xs),maxx:Math.max(...xs),miny:Math.min(...ys),maxy:Math.max(...ys)};b.w=b.maxx-b.minx;b.h=b.maxy-b.miny;return b;}
function sideBySide(p1,p2,gap=.35){const b1=bbox(p1),b2=bbox(p2);const s=Math.max(b1.w,b1.h,b2.w,b2.h);const dx=b1.maxx-b2.minx+gap*s,dy=(b1.miny+b1.maxy)/2-(b2.miny+b2.maxy)/2;return p2.map(p=>[p[0]+dx,p[1]+dy]);}
function triangleAnglesFromSides(a01,a02,a12){const c=(x,y,z)=>Math.acos((x*x+y*y-z*z)/(2*x*y))*180/Math.PI;return [c(a01,a02,a12),c(a01,a12,a02),c(a02,a12,a01)];}

/* ================= Figures SVG ================= */
const COLS=["#2e9e5b","#d64541","#7d5bbf"];
const INK="#1f2a44";
const pt=p=>p[0].toFixed(1)+","+p[1].toFixed(1);
function fig(spec){
  const W=spec.W||600,H=spec.H||270,pad=spec.pad||38;
  const P=spec.points,names=Object.keys(P);
  const b=bbox(names.map(n=>P[n]));
  const dx=b.w||1,dy=b.h||1,s=Math.min((W-2*pad)/dx,(H-2*pad)/dy);
  const ox=(W-dx*s)/2,oy=(H-dy*s)/2;
  const Q={};names.forEach(n=>{Q[n]=[ox+(P[n][0]-b.minx)*s,H-oy-(P[n][1]-b.miny)*s];});
  const edges=[];
  (spec.polys||[]).forEach(pl=>{for(let i=0;i<pl.length;i++)edges.push([pl[i],pl[(i+1)%pl.length],{}]);});
  (spec.segs||[]).forEach(sg=>edges.push([sg[0],sg[1],sg[2]||{}]));
  const nb={};edges.forEach(([a,c,o])=>{if(o.noLabel)return;(nb[a]=nb[a]||[]).push(c);(nb[c]=nb[c]||[]).push(a);});
  const hidden=new Set(spec.hidden||[]);
  const cen=(()=>{const vis=names.filter(n=>!hidden.has(n));return [vis.reduce((t,n)=>t+Q[n][0],0)/vis.length,vis.reduce((t,n)=>t+Q[n][1],0)/vis.length];})();
  let out=`<svg viewBox="0 0 ${W} ${H}" class="fig" role="img" aria-label="${spec.aria||"Figure de géométrie"}">`;
  const labels=[];
  (spec.fills||[]).forEach(f=>{out+=`<polygon points="${f.pts.map(n=>pt(Q[n])).join(" ")}" fill="${f.fill}" stroke="none"/>`;});
  (spec.angles||[]).forEach(a=>{
    const V=Q[a.v],A=Q[a.p],B=Q[a.q];
    const r0=Math.min(a.r||28,.42*Math.min(len(sub(A,V)),len(sub(B,V))));
    const u=unit(sub(A,V)),w=unit(sub(B,V));
    const sw=(u[0]*w[1]-u[1]*w[0])>0?1:0;const col=a.color||COLS[0];
    const p1=add(V,mul(u,r0)),p2=add(V,mul(w,r0));
    out+=`<path d="M${pt(V)} L${pt(p1)} A${r0.toFixed(1)} ${r0.toFixed(1)} 0 0 ${sw} ${pt(p2)} Z" fill="${col}" fill-opacity=".25" stroke="none"/>`;
    for(let i=0;i<(a.arcs||1);i++){const r=Math.max(6,r0-i*5);const q1=add(V,mul(u,r)),q2=add(V,mul(w,r));
      out+=`<path d="M${pt(q1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 ${sw} ${pt(q2)}" fill="none" stroke="${col}" stroke-width="1.8"/>`;}
    if(a.label){const bi=unit(add(u,w));const L=add(V,mul(bi,r0+15));labels.push(`<text x="${L[0].toFixed(1)}" y="${L[1].toFixed(1)}" font-size="14" text-anchor="middle" dominant-baseline="central" fill="${col}" style="paint-order:stroke;stroke:#fffefa;stroke-width:4px">${a.label}</text>`);}
  });
  edges.forEach(([a,c,o])=>{
    const A=Q[a],C=Q[c];
    const st=o.ground?`stroke="#8a6b3d" stroke-width="3"`:`stroke="${o.color||INK}" stroke-width="${o.w||1.8}"`;
    out+=`<line x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${C[0].toFixed(1)}" y2="${C[1].toFixed(1)}" ${st} ${o.dash?'stroke-dasharray="7 5"':""} stroke-linecap="round"/>`;
  });
  (spec.rights||[]).forEach(([v,p,q])=>{
    const V=Q[v],u=unit(sub(Q[p],V)),w=unit(sub(Q[q],V));
    const k=Math.min(11,.3*Math.min(len(sub(Q[p],V)),len(sub(Q[q],V))));
    out+=`<path d="M${pt(add(V,mul(u,k)))} L${pt(add(add(V,mul(u,k)),mul(w,k)))} L${pt(add(V,mul(w,k)))}" fill="none" stroke="${INK}" stroke-width="1.5"/>`;
  });
  (spec.ticks||[]).forEach(([a,c,n])=>{
    const A=Q[a],C=Q[c],mid=mul(add(A,C),.5),t=unit(sub(C,A)),nr=[-t[1],t[0]];
    for(let i=0;i<n;i++){const o=add(mid,mul(t,(i-(n-1)/2)*5));out+=`<line x1="${(o[0]-nr[0]*6).toFixed(1)}" y1="${(o[1]-nr[1]*6).toFixed(1)}" x2="${(o[0]+nr[0]*6).toFixed(1)}" y2="${(o[1]+nr[1]*6).toFixed(1)}" stroke="${COLS[1]}" stroke-width="2"/>`;}
  });
  (spec.sides||[]).forEach(sd=>{
    const A=Q[sd.a],C=Q[sd.b],mid=mul(add(A,C),.5),t=unit(sub(C,A));let nr=[-t[1],t[0]];
    const ref=sd.ref?(()=>{const r=sd.ref.map(n=>Q[n]);return [r.reduce((x,p)=>x+p[0],0)/r.length,r.reduce((x,p)=>x+p[1],0)/r.length];})():cen;
    if((mid[0]-ref[0])*nr[0]+(mid[1]-ref[1])*nr[1]<0)nr=mul(nr,-1);
    const L=add(mid,mul(nr,13));
    labels.push(`<text x="${L[0].toFixed(1)}" y="${L[1].toFixed(1)}" font-size="15" text-anchor="middle" dominant-baseline="central" fill="${sd.color||COLS[1]}" style="paint-order:stroke;stroke:#fffefa;stroke-width:4px">${sd.text}</text>`);
  });
  names.forEach(n=>{
    if(hidden.has(n))return;
    const V=Q[n];let d=[0,0];
    (nb[n]||[]).forEach(o=>{d=add(d,unit(sub(Q[o],V)));});
    d=mul(d,-1);
    if(spec.labelDir&&spec.labelDir[n]){const ld=spec.labelDir[n];d=[ld[0],-ld[1]];}
    else if(len(d)<.3)d=sub(V,cen);
    const L=add(V,mul(unit(d),15));
    out+=`<circle cx="${V[0].toFixed(1)}" cy="${V[1].toFixed(1)}" r="2" fill="${INK}"/>`;
    labels.push(`<text x="${L[0].toFixed(1)}" y="${L[1].toFixed(1)}" font-size="17" text-anchor="middle" dominant-baseline="central" fill="${INK}" style="paint-order:stroke;stroke:#fffefa;stroke-width:4px">${n}</text>`);
  });
  return out+labels.join("")+"</svg>";
}

function runSteps(box,steps,mode,maxTries,onEnd){
  let idx=0,errors=0;
  const next=()=>{
    if(idx>=steps.length){onEnd(errors);return;}
    const st=steps[idx];idx++;
    const s=el("div","step",`<div class="step-n">Étape ${idx} sur ${steps.length}</div><div class="step-q">${st.prompt}</div>`);
    box.append(s);
    if(mode==="model"){
      s.append(el("div","model-a",st.answerHtml));
      if(st.explain)s.append(el("div","model-e",st.explain));
      s.classList.add("done");
      const b=mkBtn(idx<steps.length?"Étape suivante":"Voir la fin",()=>{b.remove();next();});s.append(b);
    }else{
      const area=el("div","step-a"),fb=el("div","fb");s.append(area,fb);
      let tries=0,over=false;
      const finish=err=>{over=true;area.querySelectorAll("button,input,select").forEach(x=>x.disabled=true);s.classList.add(err?"missed":"done");errors+=err;};
      const api={
        over:()=>over,
        warn:msg=>{if(over)return;fb.className="fb warn";fb.innerHTML=msg;},
        complete:err=>{fb.className="fb ok";fb.innerHTML=`<b>C'est terminé.</b> ${st.explain||""}`;finish(err);next();},
        judge:ok=>{
          if(over)return;
          if(ok){fb.className="fb ok";fb.innerHTML=`<b>C'est juste.</b> ${st.explain||""}`;finish(tries>0?1:0);next();return;}
          tries++;
          if(tries<maxTries){fb.className="fb warn";fb.innerHTML=`<b>Pas encore.</b> ${st.hint||"Relis la consigne et réessaie."}`;return;}
          fb.className="fb ko";fb.innerHTML=`<b>Réponse attendue :</b> ${st.answerHtml}${st.explain?`<div>${st.explain}</div>`:""}`;finish(1);
          const b=mkBtn("Continuer",()=>{b.remove();next();});fb.append(b);
        }
      };
      RENDER[st.type](area,st,api);
    }
    try{s.scrollIntoView({behavior:"smooth",block:"nearest"});}catch(e){}
  };
  next();
}

const RANG=["le plus petit côté","le côté moyen","le plus grand côté"],RANG_AU=["au plus petit côté","au côté moyen","au plus grand côté"];
function genM1(kind){
  const L=letters(6),T1=L.slice(0,3),T2=L.slice(3);
  if(kind==="lengths"){
    let s;do{const a=R(3,7),b=a+R(1,3),c=b+R(1,3);s=[a,b,c];}while(s[0]+s[1]<=s[2]+.8);
    const k=pick([1.5,2,2.5,.5]),big=s.map(x=>round(x*k,2));
    const pr=shuffle([0,1,2]);                       // rang du côté opposé au sommet i
    const o1=pr.map(r=>s[r]),o2=pr.map(r=>big[r]);   // longueur du côté opposé au sommet i
    const p1=transform(triSides(o1[2],o1[1],o1[0]),{t:rad(R(-20,20)),flip:Math.random()<.5});
    let p2=transform(triSides(o2[2],o2[1],o2[0]),{t:rad(R(0,359)),flip:Math.random()<.5,k:(k>1?Math.min(1.5,k):Math.max(.7,k))/k});
    p2=sideBySide(p1,p2);
    const points={};T1.forEach((n,i)=>points[n]=p1[i]);T2.forEach((n,i)=>points[n]=p2[i]);
    const sides=[];[[T1,o1],[T2,o2]].forEach(([T,o])=>[0,1,2].forEach(i=>{const n=oppSide(T,i);sides.push({a:n[0],b:n[1],text:fr(o[i]),ref:T});}));
    return {kind,T1,T2,pr,o1,o2,svg:fig({points,polys:[T1,T2],sides,aria:"Deux triangles semblables avec les longueurs de leurs côtés"})};
  }
  let A;do{A=[R(35,85),R(35,85)];A.push(180-A[0]-A[1]);}while(A[2]<30||A[2]>100||Math.abs(A[0]-A[1])<12||Math.abs(A[0]-A[2])<12||Math.abs(A[1]-A[2])<12);
  const p1=transform(triAngles(A),{t:rad(R(-25,25))});
  let p2=transform(triAngles(A),{t:rad(R(0,359)),flip:Math.random()<.5,k:pick([.6,.7,.75,1.3,1.4,1.5])});
  p2=sideBySide(p1,p2);
  const points={};T1.forEach((n,i)=>points[n]=p1[i]);T2.forEach((n,i)=>points[n]=p2[i]);
  // code[t][i] = style de l'angle i dans le triangle t (-1 : pas codé)
  const st=shuffle([0,1,2]),code=[[-1,-1,-1],[-1,-1,-1]];
  let i0=-1,i1=-1,i2=-1;
  if(kind==="full")[0,1,2].forEach(i=>{code[0][i]=code[1][i]=st[i];});
  else if(kind==="two"){const h=R(0,2);[0,1,2].forEach(i=>{if(i!==h)code[0][i]=code[1][i]=st[i];});}
  else{[i0,i1,i2]=shuffle([0,1,2]);code[0][i0]=code[1][i0]=st[0];code[0][i1]=st[1];code[1][i2]=st[2];}
  const angles=[];
  [T1,T2].forEach((T,t)=>[0,1,2].forEach(i=>{const c=code[t][i];if(c<0)return;const o=[0,1,2].filter(x=>x!==i);angles.push({v:T[i],p:T[o[0]],q:T[o[1]],arcs:c+1,color:COLS[c]});}));
  return {kind,T1,T2,code,i0,i1,i2,svg:fig({points,polys:[T1,T2],angles,aria:"Deux triangles semblables avec des angles codés"})};
}
function whyVertex(ex,X,Y,i){
  const fwd=X===ex.T1,cx=ex.code?ex.code[fwd?0:1]:null,cy=ex.code?ex.code[fwd?1:0]:null;
  if(ex.kind==="lengths"){const r=ex.pr[i];
    return `Le sommet ${m(X[i])} est opposé au côté ${SEG(oppSide(X,i))}, ${RANG[r]} de son triangle. Le sommet homologue est opposé ${RANG_AU[r]} de l'autre triangle, ${SEG(oppSide(Y,i))} : c'est ${m(Y[i])}.`;}
  const others=[0,1,2].filter(j=>j!==i);
  if(cx[i]>=0&&cy[i]>=0)return `Les angles en ${m(X[i])} et en ${m(Y[i])} sont codés de la même façon : ces sommets sont homologues.`;
  if(cx[i]>=0){const j=others.find(j=>cy[j]>=0&&cy[j]!==cx[i]&&cx[j]<0);
    return `L'angle en ${m(X[i])} n'est pas codé comme l'angle en ${m(Y[j])} : ils ne sont pas homologues. Le sommet ${m(X[i])} correspond donc au sommet dont l'angle n'est pas codé, ${m(Y[i])}.`;}
  return `L'angle en ${m(X[i])} n'est pas codé. Les deux autres sommets sont déjà associés : ${m(X[others[0]])} avec ${m(Y[others[0]])} et ${m(X[others[1]])} avec ${m(Y[others[1]])}. Il reste ${m(Y[i])}.`;
}

      explain:`Le triangle ${m(n1)} est isocèle en ${m(T1[0])}, donc ses deux angles à la base ont la même mesure : (180° − ${p}°) : 2 = ${q}°.`}],
    eqs:[e1,e2],

  const inv=j=>T1[corr.indexOf(j)];
  const fromT1=o.tableFrom!=="T2",Fr=fromT1?T1:T2,To=fromT1?T2:T1;
  const h=x=>T1.includes(x)?homo(T1.indexOf(x)):inv(T2.indexOf(x)),other=x=>T1.includes(x)?T2:T1;
  const [sa,sb]=o.side,sideHom=h(sa)+h(sb),So=other(sa);
  const otherSides=[[So[0],So[1]],[So[1],So[2]],[So[0],So[2]]].map(p=>p.join(""));
  const sideOpts=otherSides.map(x=>SEG(x)),sideOk=otherSides.findIndex(x=>norm(x)===norm(sideHom));
  const [a1,av,a2]=o.angle,angHom=h(a1)+h(av)+h(a2),Ao=other(av);
  const angOpts=[0,1,2].map(i=>angName(Ao,i)),angOk=angOpts.findIndex(x=>x[1]===h(av));
  const tab=`<table class="tab"><tr><th>Sommets de ${m(Fr.join(""))}</th>${Fr.map(x=>`<td>${m(x)}</td>`).join("")}</tr><tr><th>Sommets de ${m(To.join(""))}</th>${Fr.map(()=>"<td>…</td>").join("")}</tr></table>`;
  const tabC=`<table class="tab"><tr><th>Sommets de ${m(Fr.join(""))}</th>${Fr.map(x=>`<td>${m(x)}</td>`).join("")}</tr><tr><th>Sommets de ${m(To.join(""))}</th>${Fr.map(x=>`<td>${m(h(x))}</td>`).join("")}</tr></table>`;
  const pairs=listFr(T1.map((x,i)=>`(${m(x)} ; ${m(homo(i))})`));
  return {title:o.title||"Exercice 3",pts:3,
    head:P(`Les triangles ${m(T1.join(""))} et ${m(T2.join(""))} ci-dessous sont semblables. Les couples de sommets homologues sont ${pairs}.`)+svg+
      P("1. Compléter le tableau des sommets homologues. (1,5 point)")+tab+
      P(`2. Quel côté est homologue du côté ${SEG(sa+sb)} ? (0,5 point)`)+P(`3. Quel angle est homologue de l'angle ${A3(o.angle.join(""))} ? (1 point)`),
    answers:[{label:"1.",kind:"selects",from:Fr,choices:To.slice().sort(),correct:Fr.map(h)},
      {label:"2.",kind:"radio",opts:sideOpts,correct:sideOk},{label:"3.",kind:"radio",opts:angOpts.map(A3),correct:angOk}],
    corr:P("1. On recopie les couples donnés dans l'énoncé :")+tabC+
      P(`2. Le côté ${SEG(sa+sb)} relie les sommets ${m(sa)} et ${m(sb)}. Leurs homologues sont ${m(h(sa))} et ${m(h(sb))}, donc le côté homologue est <b>${SEG(h(sa)+h(sb))}</b>.`)+
      P(`3. Le sommet de l'angle ${A3(o.angle.join(""))} est ${m(av)}. Son homologue est ${m(h(av))}, donc l'angle homologue est <b>${A3(angHom)}</b>.`)};
}
// --- Exercice : papillon (angles opposés par le sommet + une égalité d'angles donnée) ---
function exoPapillon(o){
  // triangle ABC (A,B,C), droites (AE) et (DC) sécantes en B ; angle BAC = angle BDE ; D homologue de A, E homologue de C
  const {AB,AC,BC,BD}=o,k=BD/AB,DE=k*AC,BE=k*BC;
  let tri=triSides(AB,AC,BC).map(p=>[p[0],-p[1]]);
  const A_=tri[0],B_=tri[1],C_=tri[2];
  const E_=add(B_,mul(unit(sub(B_,A_)),BE)),D_=add(B_,mul(unit(sub(B_,C_)),BD));
  const sides=o.labels.map(([a,b,t])=>({a,b,text:t,color:INK}));
  const svg=fig({H:280,points:{A:A_,B:B_,C:C_,D:D_,E:E_},polys:[["A","B","C"],["D","B","E"]],sides,labelDir:{B:[0,-1]},aria:"Deux triangles opposés par le sommet B"});
  const ans=o.ask==="AC"?AC:DE;
  const known=o.ask==="AC"
    ?{eq:`${F(fr(AB),fr(BD))} = ${F(m("AC"),fr(DE))}`,prod:`${fr(BD)} × AC = ${fr(AB)} × ${fr(DE)}`,calc:`AC = ${F(`${fr(AB)} × ${fr(DE)}`,fr(BD))}`}
    :{eq:`${F(fr(AB),fr(BD))} = ${F(fr(AC),m("DE"))}`,prod:`${fr(AB)} × DE = ${fr(BD)} × ${fr(AC)}`,calc:`DE = ${F(`${fr(BD)} × ${fr(AC)}`,fr(AB))}`};
  return {title:"Exercice 4",pts:4,grid:GRID_ANG,
    head:P(`Sur la figure ci-dessous, qui n'est pas en vraie grandeur, les droites (AE) et (DC) se coupent au point B. ${o.donnees}`)+P(`On sait que les angles ${A3("BAC")} et ${A3("BDE")} ont la même mesure.`)+svg+
      P("1. Démontrer que les triangles ABC et DBE sont semblables. (2 points)")+P(`2. ${o.ask==="AC"?`Sachant que DE = ${fr(DE)} cm, calculer la longueur AC.`:"Calculer la longueur DE."} (2 points)`),
    answers:[{label:`2. ${m(o.ask)} =`,kind:"num",unit:"cm",correct:round(ans,2)}],
    corr:P(`1. Les droites (AE) et (DC) se coupent en B, donc les angles ${A3("ABC")} et ${A3("DBE")} sont opposés par le sommet : ${A3("ABC")} = ${A3("DBE")}.`)+
      P(`De plus, ${A3("BAC")} = ${A3("BDE")} d'après l'énoncé.`)+
      P(`Les triangles ABC et DBE ont deux paires d'angles de même mesure : <b>ils sont semblables</b>.`)+
      P(`2. Les sommets homologues sont : A et D, B et B, C et E.`)+
      P(`Les longueurs des côtés homologues sont proportionnelles : ${F("AB","DB")} = ${F("BC","BE")} = ${F("AC","DE")}.`)+
      P(`On utilise : ${known.eq}.`)+P(`Donc ${known.prod}.`)+P(`${known.calc} = ${fr(ans)}`)+P(`<span class="box">${o.ask} = ${fr(ans)} cm</span>`)};
}
// --- Exercice : longueurs données sans figure ---
function exoListe(o){
  // o.T1,o.T2 : lettres ; o.L1,o.L2 : {côté: longueur}
  const s1=Object.entries(o.L1).sort((a,b)=>a[1]-b[1]),s2=Object.entries(o.L2).sort((a,b)=>a[1]-b[1]);
  const big2=s2[2][1]>s1[2][1],G=big2?s2:s1,Pt=big2?s1:s2,Gn=big2?o.T2:o.T1,Pn=big2?o.T1:o.T2;
  const q=G.map((x,i)=>x[1]/Pt[i][1]),sim=Math.abs(q[0]-q[1])<1e-9&&Math.abs(q[1]-q[2])<1e-9;
  const li=(L)=>Object.entries(L).map(([k,v])=>`${m(k)} = ${fr(v)} cm`).join(" ; ");
  const tab=`<table class="tab"><tr><th></th><th>petit</th><th>moyen</th><th>grand</th></tr>${[[o.T1,s1],[o.T2,s2]].map(([n,s])=>`<tr><th>${m(n)}</th>${s.map(([k,v])=>`<td>${m(k)} = ${fr(v)}</td>`).join("")}</tr>`).join("")}</table>`;
  const ql=G.map((x,i)=>`${F(fr(x[1]),fr(Pt[i][1]))} ${isDec(q[i],2)?"=":"≈"} ${fr(q[i])}`).join(" ; ");
  return {title:"Exercice 5",pts:3,grid:GRID_LEN,
    head:P(`On considère deux triangles ${m(o.T1)} et ${m(o.T2)} tels que :`)+`<ul><li>${li(o.L1)} ;</li><li>${li(o.L2)}.</li></ul>`+P("Ces deux triangles sont-ils semblables ? Justifier la réponse."),
    answers:[{label:"Réponse :",kind:"radio",opts:YESNO,correct:sim?0:1}],
    corr:P("On range les longueurs des côtés de chaque triangle dans l'ordre croissant :")+tab+
      P(`On calcule les quotients (triangle ${m(Gn)} divisé par triangle ${m(Pn)}) : ${ql}.`)+
      (sim?P(`Les quotients sont égaux : les longueurs des côtés sont proportionnelles. <b>Les triangles ${m(o.T1)} et ${m(o.T2)} sont semblables.</b>`)
          :P(`Les quotients ne sont pas tous égaux : les longueurs des côtés ne sont pas proportionnelles. <b>Les triangles ${m(o.T1)} et ${m(o.T2)} ne sont pas semblables.</b>`))};
}
// --- Exercice type brevet 2018 : Pythagore, similitude par les longueurs, angle droit ---
function exoDNB18(o){
  // triangle BCD rectangle en B ; triangle BFE avec FE = k·BD, BF = k·BC, BE = k·CD ; C, B, E alignés
  const {BC,CD,k}=o,BD=Math.sqrt(CD*CD-BC*BC),FE=round(k*BD,2),BF=round(k*BC,2),BE=round(k*CD,2);
  const t=triSides(BE,BF,FE).map(p=>[-p[0],-p[1]]);
  const points={B:[0,0],C:[BC,0],D:[0,BD],E:t[1],F:t[2]};
  const sides=[{a:"C",b:"D",t:CD},{a:"B",b:"C",t:BC},{a:"E",b:"B",t:BE},{a:"B",b:"F",t:BF},{a:"E",b:"F",t:FE}].map(s=>({a:s.a,b:s.b,text:fr(s.t)+" cm",color:INK,ref:s.a==="C"&&s.b==="D"||s.a==="B"&&s.b==="C"?["B","C","D"]:["B","E","F"]}));
  const svg=fig({H:270,points,polys:[["B","C","D"],["B","F","E"]],rights:[["B","C","D"]],sides,labelDir:{B:[.25,-1]},aria:"Deux triangles de part et d'autre du point B"});
  const sq=x=>round(x*x,4);
  return {title:"Exercice 6 (d'après le brevet, Métropole 2018)",pts:5,
    grid:["Question 1 : j'ai cité le théorème de Pythagore et j'ai écrit l'égalité.","Question 1 : j'ai calculé BD² puis BD, avec l'unité.","Question 2 : j'ai rangé les côtés et calculé les trois quotients.","Question 2 : j'ai conclu que les triangles sont semblables.","Question 3 : j'ai trouvé l'angle homologue de l'angle droit.","Question 3 : j'ai conclu par une phrase sur l'affirmation de Sophie."],
    head:P("La figure ci-dessous n'est pas représentée en vraie grandeur. Les points C, B et E sont alignés. Le triangle BCD est rectangle en B.")+svg+
      P(`On donne les longueurs suivantes : BC = ${fr(BC)} cm ; CD = ${fr(CD)} cm ; BF = ${fr(BF)} cm ; BE = ${fr(BE)} cm ; FE = ${fr(FE)} cm.`)+
      P(`1. Dans le triangle BCD rectangle en B, montrer par le calcul que la longueur BD est égale à ${fr(BD)} cm. (1 point)`)+
      P("2. Démontrer que les triangles CBD et BFE sont semblables. (2 points)")+
      P(`3. Sophie affirme que l'angle ${A3("BFE")} est un angle droit. A-t-elle raison ? Justifier la réponse. (2 points)`),
    answers:[{label:"3.",kind:"radio",opts:["Oui, Sophie a raison.","Non, Sophie a tort."],correct:0}],
    note:"Les questions 1 et 2 sont des démonstrations : compare ta rédaction avec la correction.",
    corr:P(`1. Le triangle BCD est rectangle en B. D'après le théorème de Pythagore : CD² = BC² + BD².`)+
      P(`Donc BD² = CD² − BC² = ${fr(CD)}² − ${fr(BC)}² = ${fr(sq(CD),4)} − ${fr(sq(BC),4)} = ${fr(sq(BD),4)}.`)+
      P(`BD = √${fr(sq(BD),4)} = ${fr(BD)}, donc <b>BD = ${fr(BD)} cm</b>.`)+
      P(`2. On range les longueurs des côtés dans l'ordre croissant : BD = ${fr(BD)}, BC = ${fr(BC)}, CD = ${fr(CD)} pour CBD et FE = ${fr(FE)}, BF = ${fr(BF)}, BE = ${fr(BE)} pour BFE.`)+
      P(`${F(fr(FE),fr(BD))} = ${fr(k)} ; ${F(fr(BF),fr(BC))} = ${fr(k)} ; ${F(fr(BE),fr(CD))} = ${fr(k)}.`)+
      P(`Les quotients sont égaux : les longueurs des côtés sont proportionnelles, donc <b>les triangles CBD et BFE sont semblables</b>.`)+
      P(`3. Les côtés homologues sont [CD] et [BE], [BC] et [BF], [BD] et [FE]. Donc les sommets homologues sont B et F (opposés à [CD] et [BE]), C et B, D et E.`)+
      P(`Les angles ${A3("CBD")} et ${A3("BFE")} sont homologues, donc ils ont la même mesure. Comme ${A3("CBD")} = 90°, on a ${A3("BFE")} = 90° : <b>Sophie a raison</b>.`)};
}
// --- Sujets ---
function sujet2025(v){
  if(v==="A")return {title:"D.S. 303 – Triangles semblables – Sujet A",parts:[
    {title:"Partie 1 : Automatismes (10 minutes)",info:"L'usage de la calculatrice est interdit pour cette partie.",total:5,exos:[exoEquations(eqAffine(5,-3,2,6),eqAffine(-3,7,0,28)),exoFormules(["cercle","triangle","cylindre"])]},
    {title:"Partie 2 : Triangles semblables (45 minutes)",info:"L'usage de la calculatrice est autorisé pour cette partie.",total:15,exos:[
      exoHomoTexte({T1:["A","B","C"],T2:["R","S","T"],corr:[2,1,0],A:[65,45,70],t2:150,flip:true,side:["A","C"],angle:["B","C","A"]}),
      exoPapillon({AB:2.5,AC:3,BC:3,BD:2,ask:"AC",donnees:"On donne AB = 2,5 cm, BC = 3 cm et BD = 2 cm.",labels:[["A","B","2,5 cm"],["B","C","3 cm"],["B","D","2 cm"]]}),
      exoListe({T1:"GHI",T2:"JKL",L1:{GH:8,GI:11,HI:6},L2:{JK:10,JL:13.5,KL:7.5}}),
      exoDNB18({BC:7.5,CD:8.5,k:.8})]}]};
  return {title:"D.S. 303 – Triangles semblables – Sujet B",parts:[
    {title:"Partie 1 : Automatismes (10 minutes)",info:"L'usage de la calculatrice est interdit pour cette partie.",total:5,exos:[exoEquations(eqAffine(4,-2,1,7),eqAffine(-2,5,0,21)),exoFormules(["disque","rectP","cone"])]},
    {title:"Partie 2 : Triangles semblables (45 minutes)",info:"L'usage de la calculatrice est autorisé pour cette partie.",total:15,exos:[
      exoHomoTexte({T1:["A","B","C"],T2:["R","S","T"],corr:[2,1,0],A:[65,45,70],t2:150,flip:true,tableFrom:"T2",side:["A","B"],angle:["B","A","C"]}),
      exoPapillon({AB:3,AC:4.5,BC:4,BD:2,ask:"DE",donnees:"On donne AB = 3 cm, AC = 4,5 cm et BD = 2 cm.",labels:[["A","B","3 cm"],["A","C","4,5 cm"],["B","D","2 cm"]]}),
      exoListe({T1:"MNO",T2:"PQR",L1:{MN:10,MO:12,NO:15},L2:{PQ:8,PR:9.6,QR:12}}),
      exoDNB18({BC:8,CD:10,k:1.5})]}]};
}
function sujetAleatoire(){
  // homologues
  let A;do{A=[R(40,80),R(40,80)];A.push(180-A[0]-A[1]);}while(A[2]<35||Math.abs(A[0]-A[1])<10||Math.abs(A[0]-A[2])<10||Math.abs(A[1]-A[2])<10);
  const L=letters(6),T1=L.slice(0,3),T2=L.slice(3),corr=shuffle([0,1,2]),[i,j]=shuffle([0,1,2]);
  const ex3=exoHomoTexte({T1,T2,corr,A,t2:R(0,359),flip:Math.random()<.5,tableFrom:pick(["T1","T2"]),side:[T1[i],T1[j]].sort(),angle:(()=>{const v=R(0,2),o=[0,1,2].filter(x=>x!==v);return [T2[o[0]],T2[v],T2[o[1]]];})()});
  // papillon
  let AB,AC,BC,BD;
  do{AB=R(2,6);AC=R(3,7);BC=R(3,7);BD=round(AB*pick([.5,.8,1.2,1.5,2]),2);}
  while(AB+AC<=BC+.5||AB+BC<=AC+.5||AC+BC<=AB+.5||Math.min(...triangleAnglesFromSides(AB,AC,BC))<30||!isDec(BD/AB*AC,2)||!isDec(BD/AB*BC,2)||BD>6);
  const ask=pick(["AC","DE"]);
  const ex4=exoPapillon({AB,AC,BC,BD,ask,donnees:ask==="AC"?`On donne AB = ${fr(AB)} cm, BC = ${fr(BC)} cm et BD = ${fr(BD)} cm.`:`On donne AB = ${fr(AB)} cm, AC = ${fr(AC)} cm et BD = ${fr(BD)} cm.`,
    labels:ask==="AC"?[["A","B",fr(AB)+" cm"],["B","C",fr(BC)+" cm"],["B","D",fr(BD)+" cm"]]:[["A","B",fr(AB)+" cm"],["A","C",fr(AC)+" cm"],["B","D",fr(BD)+" cm"]]});
  // liste de longueurs
  let s,t;const sim5=Math.random()<.5,kk=pick([1.25,1.5,2,2.5]);
  do{const a=R(4,9),b=a+R(1,3),c=b+R(1,3);s=[a,b,c];t=s.map(x=>round(x*kk,2));
    if(!sim5){const jj=R(0,2);t[jj]=round(t[jj]+pick([-1,-.5,.5,1]),2);}
  }while(s[0]+s[1]<=s[2]+1||new Set(t).size<3||(()=>{const u=t.slice().sort((x,y)=>x-y);return u[0]+u[1]<=u[2]+1||(!sim5&&u.every((v,x)=>Math.abs(v/s[x]-kk)<1e-9));})());
  const L5=letters(6),n1=L5.slice(0,3).join(""),n2=L5.slice(3).join("");
  const mk=(n,vals)=>{const sd=shuffle([n[0]+n[1],n[0]+n[2],n[1]+n[2]]),o={};sd.forEach((x,q)=>o[x]=vals[q]);return o;};
  const ex5=exoListe({T1:n1,T2:n2,L1:mk(n1,shuffle(s)),L2:mk(n2,shuffle(t))});
  // type brevet 2018
  let tr,mm,k6;
  do{tr=pick([[4,5],[8,10],[6,10],[12,13],[15,17]]);mm=pick([.5,1,1.5]);k6=pick([.8,1.2,1.25,1.5,2]);}
  while(tr[1]*mm>13||tr[1]*mm<5||tr[1]*mm*k6>16||!isDec(k6*tr[0]*mm,2)||!isDec(k6*tr[1]*mm,2));
  const ex6=exoDNB18({BC:round(tr[0]*mm,2),CD:round(tr[1]*mm,2),k:k6});
  return {title:"D.S. blanc – Triangles semblables – Sujet tiré au hasard",parts:[
    {title:"Partie 1 : Automatismes (10 minutes)",info:"L'usage de la calculatrice est interdit pour cette partie.",total:5,exos:[exoEquations(randEq1(),randEq2()),exoFormules(shuffle(Object.keys(FORMULES)).slice(0,3))]},
    {title:"Partie 2 : Triangles semblables (45 minutes)",info:"L'usage de la calculatrice est autorisé pour cette partie.",total:15,exos:[ex3,ex4,ex5,ex6]}]};
}
function renderDS(){
  DSN++;const ds=DSCHOICE==="A"||DSCHOICE==="B"?sujet2025(DSCHOICE):sujetAleatoire();
  const c=el("section","card ds");
  c.innerHTML=`<h2 class="ttl"><span>5. D.S. blanc</span></h2>`;
  const ch=el("div","levels",`<span class="lab">Sujet :</span>`);
  [["A","D.S. 2025 – sujet A"],["B","D.S. 2025 – sujet B"],["R","Nouveau sujet"]].forEach(([v,l])=>ch.append(mkBtn(l,()=>{DSCHOICE=v;render();},DSCHOICE===v?"on":"")));
  c.append(ch);
  c.append(el("p","consigne small",`Fais le D.S. sur ta feuille, comme en classe, en respectant les durées. Ensuite, écris tes résultats dans les cadres « Mes réponses » et affiche la correction.`));
  const tools=el("div","ds-tools");tools.append(mkBtn(DSCHOICE==="R"?"Tirer un autre sujet":"Recommencer ce sujet",()=>render()),mkBtn("Imprimer le sujet",()=>window.print(),"btn light"));c.append(tools);
  c.append(el("h3","ds-title",ds.title));
  const blocks=[];let n=0;
  ds.parts.forEach(part=>{
    c.append(el("div","ds-part",`<h3>${part.title}</h3><p class="ds-info"><i>${part.info}</i><span>Total : ${part.total} points</span></p>`));
    part.exos.forEach(ex=>{n++;const id=`ds${DSN}-${n}`;
      const title=ex.title.replace(/^Exercice \d+/,`Exercice ${n}`);
      const b=el("div","ds-exo",`<h3>${title} <span class="small">(${ptsTxt(ex.pts)})</span></h3>${ex.head}`);
      const ans=el("div","ds-ans",`<b>Mes réponses</b>${ex.note?`<div class="small">${ex.note}</div>`:""}`);
      ex.answers.forEach((a,j)=>{const row=el("div","ds-row");const nm=`${id}-${j}`;
        let inner="";
        if(a.kind==="radio")inner=radios(nm,a.opts);
        else if(a.kind==="num")inner=`<span class="numf"><input type="text" inputmode="decimal" autocomplete="off" name="${nm}">${a.unit?`<span class="unit">${a.unit}</span>`:""}</span>`;
        else inner=a.from.map(x=>`<span class="homorow">${m(x)} ↔ <select><option value="">…</option>${a.choices.map(cc=>`<option>${cc}</option>`).join("")}</select></span>`).join("");
        row.innerHTML=`<span class="ds-lab">${a.label}</span>${inner}<span class="ds-mark"></span>`;a.row=row;ans.append(row);});
      b.append(ans);const cz=el("div","ds-corr");b.append(cz);c.append(b);blocks.push({ex,cz});
    });
  });
  const fin=mkBtn("J'ai fini : afficher la correction",()=>{
    blocks.forEach(({ex,cz})=>{
      ex.answers.forEach(a=>{let ok;
        if(a.kind==="radio"){const r=a.row.querySelector("input:checked");ok=!!r&&Number(r.value)===a.correct;a.row.querySelectorAll("label").forEach((l,i)=>{if(i===a.correct)l.classList.add("good");});}
        else if(a.kind==="num"){const v=parseNum(a.row.querySelector("input").value);ok=v!==null&&Math.abs(v-a.correct)<=.011;}
        else{const ss=[...a.row.querySelectorAll("select")];ok=ss.every((s,i)=>s.value===a.correct[i]);ss.forEach((s,i)=>s.classList.toggle("bad",s.value!==a.correct[i]));}
        a.row.querySelectorAll("input,select").forEach(i=>i.disabled=true);
        a.row.querySelector(".ds-mark").innerHTML=ok?`<span class="okm">✓ juste</span>`:`<span class="kom">✗ à revoir</span>`;
      });
      cz.innerHTML=seyesBox(ex.corr);if(ex.grid)cz.append(gridEl(ex.grid));
    });
    fin.remove();
  },"btn");
  c.append(fin);app.append(c);
}

render();
