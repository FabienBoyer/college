</style></head><body><div class="wrap"><header><a class="back-home" href="../6e/">← Toutes les applications</a><h1><span>Chapitre 1 : Nombres entiers et décimaux</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours">Cours</button><button type="button" data-page="lire">1. Lire et écrire</button><button type="button" data-page="chiffres">2. Chiffres</button><button type="button" data-page="zeros">3. Zéros et virgule</button><button type="button" data-page="fractions">4. Fractions</button><button type="button" data-page="decomp">5. Décomposer</button><button type="button" data-page="ds">6. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 6<sup>e</sup></footer></div><template id="course-source"><section data-mod="lire"><h3>1. Chiffres et nombres</h3>
<div class="retenir"><b>À retenir</b>Les dix chiffres 0, 1, 2, 3, 4, 5, 6, 7, 8 et 9 permettent d’écrire tous les nombres, comme les lettres permettent d’écrire tous les mots.</div>
<p>Pour lire facilement un grand nombre entier, on regroupe ses chiffres par <strong>classes de trois</strong>, en partant du chiffre des unités. On laisse un petit espace entre deux classes.</p>
<div class="seyes"><h4>Exemple · 1252342532</h4><p>1 252 342 532</p><p>un-milliard-deux-cent-cinquante-deux-millions-trois-cent-quarante-deux-mille-cinq-cent-trente-deux</p></div>
<h3>2. Écrire un nombre en lettres</h3>
<div class="retenir"><b>Orthographe</b><ul><li>On relie tous les mots du nombre par des traits d’union.</li><li>Le mot « mille » ne prend jamais de s.</li><li>« Vingt » et « cent » prennent un s quand ils sont multipliés et qu’ils sont à la fin du nombre : quatre-vingts, trois-cents, mais quatre-vingt-deux et trois-cent-un.</li><li>« Million » et « milliard » prennent un s au pluriel : deux-millions.</li></ul></div>
<p>Pour écrire un nombre décimal en lettres, on lit la partie entière en unités, puis la partie décimale avec le rang de son dernier chiffre.</p>
<div class="seyes"><h4>Exemples</h4><p>2,8 : deux unités et huit dixièmes</p><p>19,34 : dix-neuf unités et trente-quatre centièmes</p><p>4,687 : quatre unités et six-cent-quatre-vingt-sept millièmes</p></div></section>
<section data-mod="chiffres"><h3>3. Le tableau de numération</h3>
<p>Dans le tableau, on place un seul chiffre par colonne. La colonne d’un chiffre donne son rang. Le chiffre des unités est juste avant la virgule, et le chiffre des dixièmes est juste après.</p>
<div class="tabwrap"><table class="num"><tr><th class="cl" colspan="3">Classe des mille</th><th class="cl" colspan="3">Classe des unités</th><th class="cl vg" colspan="3">Partie décimale</th></tr><tr><th>centaines de mille</th><th>dizaines de mille</th><th>milliers</th><th>centaines</th><th>dizaines</th><th>unités</th><th class="vg">dixièmes</th><th>centièmes</th><th>millièmes</th></tr><tr><td></td><td></td><td>7</td><td>4</td><td>2</td><td>5</td><td class="vg">3</td><td>9</td><td>5</td></tr></table></div>
<h3>4. Chiffre des, nombre de</h3>
<div class="retenir"><b>À retenir</b><ul><li>Le <strong>chiffre</strong> des centaines est un seul chiffre : celui de la colonne des centaines.</li><li>Le <strong>nombre</strong> de centaines s’obtient en gardant tous les chiffres jusqu’à la colonne des centaines, et en supprimant les autres.</li></ul></div>
<div class="seyes"><h4>Exemple · 7 425,395</h4><p>Partie entière : 7 425</p><p>Partie décimale : 0,395</p><p>Chiffre des centaines : 4</p><p>Nombre de centaines : 74</p><p>Chiffre des dixièmes : 3</p><p>Nombre de dixièmes : 74 253</p></div></section>
<section data-mod="zeros"><h3>5. Les zéros inutiles</h3>
<div class="retenir"><b>À retenir</b>Un zéro est inutile s’il est au début de la partie entière, ou à la fin de la partie décimale. On peut le supprimer sans changer le nombre.</div>
<div class="seyes"><h4>Exemples</h4><p>05,0 = 5</p><p>17 500,500 = 17 500,5</p><p>15,40 = 15,4</p><p>17,02 ≠ 17,2</p></div>
<p>Dans 17,02, le zéro n’est pas inutile : il indique qu’il n’y a aucun dixième. Dans 17 500, les zéros ne sont pas inutiles non plus.</p>
<h3>6. Placer la virgule</h3>
<p>Pour qu’un chiffre soit à un rang donné, on cherche d’abord quel chiffre sera le chiffre des unités, puis on place la virgule juste après lui.</p>
<div class="seyes"><h4>Exemple · 1572068</h4><p>7 doit être le chiffre des centaines.</p><p>15 720,68</p></div></section>
<section data-mod="fractions"><h3>7. Dixièmes, centièmes, millièmes</h3>
<div class="retenir"><b>Définitions</b>Quand on partage une unité en 10 parts égales, chaque part est un dixième : <span class="frac"><span>1</span><span>10</span></span> = 0,1.<br>En 100 parts égales, chaque part est un centième : <span class="frac"><span>1</span><span>100</span></span> = 0,01.<br>En 1 000 parts égales, chaque part est un millième : <span class="frac"><span>1</span><span>1 000</span></span> = 0,001.</div>
<p>Il y a 10 dixièmes dans une unité, 10 centièmes dans un dixième, et 10 millièmes dans un centième.</p>
<h3>8. Fractions décimales</h3>
<div class="retenir"><b>À retenir</b>Une fraction décimale a pour dénominateur 10, 100, 1 000… Le nombre de zéros du dénominateur est égal au nombre de chiffres après la virgule.</div>
<div class="seyes"><h4>Exemples</h4><p>19,34 = <span class="frac"><span>1 934</span><span>100</span></span></p><p><span class="frac"><span>4 687</span><span>1 000</span></span> = 4,687</p><p>2 + <span class="frac"><span>8</span><span>10</span></span> + <span class="frac"><span>8</span><span>100</span></span> + <span class="frac"><span>6</span><span>1 000</span></span> = 2,886</p></div></section>
<section data-mod="decomp"><h3>9. Décomposer un nombre</h3>
<p>On peut écrire un même nombre de plusieurs façons. Chaque chiffre est remplacé par la valeur qu’il représente.</p>
<div class="seyes"><h4>Exemple · 15,42</h4><p>15,42 = 10 + 5 + 0,4 + 0,02</p><p>15,42 = (1 × 10) + (5 × 1) + (4 × 0,1) + (2 × 0,01)</p><p>15,42 = 15 + <span class="frac"><span>4</span><span>10</span></span> + <span class="frac"><span>2</span><span>100</span></span></p><p>15,42 = 15 + <span class="frac"><span>42</span><span>100</span></span></p></div>
<p>Dans une décomposition, on n’écrit pas les chiffres 0 : 24,608 = 20 + 4 + 0,6 + 0,008.</p></section>

function makeInput(t,label){let input;
 if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of (t.options.length>2&&!t.keep?shuffle(t.options):t.options))input.append(new Option(o,o));}
 else{input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.spellcheck=false;const k=t.kind||'num';input.placeholder=PH[k];if(k==='num'||k==='exact')input.inputMode='decimal';if(k==='sum')input.style.width='16em';}
 input.setAttribute('aria-label',label);return input;}
/* Modelage : toutes les étapes, réponse et explication. Pratique guidée : les mêmes étapes, avec l'aide et le tableau.
   Pratique autonome : les étapes intermédiaires (guide) disparaissent. Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul';
 if(alone)parent.append(dom('p','small','Fais le travail sur ton cahier, puis saisis seulement ta réponse. Les espaces entre les classes sont facultatifs.'));
 parent.append(dom('div','exo-head',ex.head));if(ex.table&&!alone)parent.append(dom('div','',ex.table));const box=dom('div','steps');parent.append(box);
 const tasks=alone?ex.tasks.filter(t=>!t.guide):ex.tasks;
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=alone&&t.qAlone?t.qAlone:t.q;const single=tasks.length===1;const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+`<div class="step-q">${q}</div>`);box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);
  const input=makeInput(t,'Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   const ok=correct(input.value,t);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Vérifie ton travail, puis fais un deuxième essai.';input.classList.add('bad');return;}
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);
 }
 next();
}

/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
