</style></head><body><div class="wrap"><header><a class="back-home" href="../">← Toutes les applications</a><h1><span>Chapitre 2 : Équations</span></h1><p>Je prépare mon D.S. de fin de chapitre.</p><nav aria-label="Parcours du chapitre"><button type="button" data-page="home" class="on">Sommaire</button><button type="button" data-page="cours" class="">Cours</button><button type="button" data-page="test" class="">1. Tester</button><button type="button" data-page="rules" class="">2. Règles</button><button type="button" data-page="solve" class="">3. Résoudre</button><button type="button" data-page="problems" class="">4. Problèmes</button><button type="button" data-page="ds" class="">5. D.S. blanc</button></nav></header><main id="app"></main><footer>Collège La Rochefoucauld · Mathématiques 3<sup>e</sup></footer></div><template id="course-source"><section data-mod="test"><h3>1. Équation et solution</h3>
<div class="retenir"><b>Définitions</b>Une équation est une égalité qui contient un nombre inconnu, désigné par une lettre, souvent x. Une solution est un nombre qui rend l’égalité vraie quand on le met à la place de la lettre. Résoudre une équation, c’est trouver toutes ses solutions.</div>
<p>Une équation peut avoir une seule solution, aucune solution, ou bien tous les nombres peuvent être solutions.</p>
<h3>2. Tester une solution</h3>
<ol><li>Remplacer l’inconnue par le nombre proposé dans le membre de gauche.</li><li>Faire le même remplacement dans le membre de droite.</li><li>Comparer les deux résultats, puis conclure.</li></ol>
<div class="seyes"><h4>Exemple · −3x + 5 = −7x + 1</h4><p>Pour x = −1, on calcule chacun des deux membres.</p><p>G = −3 × (−1) + 5 = 8.</p><p>D = −7 × (−1) + 1 = 8.</p><p>Les deux membres sont égaux, donc −1 est une solution.</p><p>Pour x = 2, on obtient G = −1 et D = −13.</p><p>Les deux membres sont différents, donc 2 n’est pas une solution.</p></div></section>
<section data-mod="rules"><h3>3. Conserver les mêmes solutions</h3>
<div class="retenir"><b>Règle R1</b>On obtient une équation qui a les mêmes solutions en ajoutant ou en soustrayant la même expression aux deux membres.</div>
<div class="retenir"><b>Règle R2</b>On obtient une équation qui a les mêmes solutions en multipliant ou en divisant les deux membres par un même nombre <strong>non nul</strong>.</div>
<p>Une opération faite sur un seul membre change en général les solutions. On ne divise jamais par 0.</p></section>
<section data-mod="solve"><h3>4. Résoudre une équation</h3>
<ol><li>Développer et réduire si nécessaire.</li><li>Regrouper les termes en x dans un membre, en faisant la même opération sur les deux membres.</li><li>Regrouper les nombres sans x dans l’autre membre.</li><li>Diviser les deux membres par le nombre qui multiplie x.</li><li>Conclure, puis vérifier dans l’équation de départ.</li></ol>
<div class="seyes"><h4>Exemple · 6x − 5 = 4x + 9</h4><p>On soustrait 4x aux deux membres. On obtient 2x − 5 = 9.</p><p>On ajoute 5 aux deux membres. On obtient 2x = 14.</p><p>On divise les deux membres par 2. On obtient x = 7.</p><p>La solution est 7.</p><p>Vérification : 6 × 7 − 5 = 37 et 4 × 7 + 9 = 37.</p></div>
<h3>5. Parenthèses et fractions</h3>
<p>Un nombre ou un signe moins devant des parenthèses multiplie tous les termes de la parenthèse. Si la solution n’est pas un nombre décimal, on l’écrit sous forme de fraction.</p>
<div class="seyes"><h4>Exemple · 13 + 4x = 2(10x + 6)</h4><p>On développe. On obtient 13 + 4x = 20x + 12.</p><p>On soustrait 20x aux deux membres. On obtient 13 − 16x = 12.</p><p>On soustrait 13 aux deux membres. On obtient −16x = −1.</p><p>On divise les deux membres par −16. On obtient x = <span class="frac"><span>1</span><span>16</span></span>.</p><p>La solution est <span class="frac"><span>1</span><span>16</span></span>.</p></div>
<h3>6. Quand les x disparaissent</h3>
<p><span class="m">2x + 3 = 2x + 1</span> conduit à <span class="m">3 = 1</span>, qui est faux : l’équation n’a aucune solution.</p>
<p><span class="m">2x + 3 = 2x + 3</span> est vraie quel que soit le nombre x : tous les nombres sont solutions.</p></section>
<section data-mod="problems"><h3>7. Mettre un problème en équation</h3>
<ol><li>Choisir l’inconnue et l’écrire avec une phrase.</li><li>Exprimer les quantités à l’aide de cette inconnue.</li><li>Traduire l’information du problème par une égalité.</li><li>Résoudre l’équation.</li><li>Vérifier que la solution convient au problème, puis répondre par une phrase, avec l’unité.</li></ol>
<p>Pour trois entiers consécutifs, si n est le plus petit, les deux suivants sont n + 1 et n + 2.</p>
<p>Pour deux programmes de calcul qui donnent le même résultat, on note x le nombre choisi, on écrit le résultat de chaque programme avec x, puis on écrit que ces deux résultats sont égaux.</p></section>
</template><script>(() => {
'use strict';
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=R(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.abs(n)<1e-12?0:+n.toFixed(6)).replace('.',',').replace('-','−');
const par=n=>n<0?'('+fmt(n)+')':fmt(n);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function ratio(a,b){if(!b)throw Error('Division par zéro');if(b<0){a=-a;b=-b;}const g=gcd(a,b);return [a/g,b/g];}
const ratHtml=(a,b)=>{const [n,d]=ratio(a,b);return d===1?fmt(n):`<span class="frac"><span>${fmt(n)}</span><span>${d}</span></span>`;};
/* Quotient a/b : fraction irréductible, suivie de l'écriture décimale quand elle existe (−21/6 = −7/2 = −3,5). */
function decimal(d){while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;}
const valHtml=(a,b)=>{const [n,d]=ratio(a,b);return d===1?fmt(n):ratHtml(a,b)+(decimal(d)?' = '+fmt(n/d):'');};
function lin(a,b){let s=a===0?'':a===1?'x':a===-1?'−x':fmt(a)+'x';if(b)s+=(s?(b<0?' − ':' + '):b<0?'−':'')+fmt(Math.abs(b));return s||'0';}
function parseNum(v){let s=v.trim().replace(/\s/g,'').replace(/−/g,'-').replace(',','.');if(!s)return null;if(/^[+-]?\d+(?:\.\d+)?\/[+-]?\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b?a/b:null;}return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):null;}
function correct(v,a){if(typeof a==='number'){const n=parseNum(v);return n!==null&&Math.abs(n-a)<1e-8;}return v.trim().toLocaleLowerCase('fr')===String(a).toLocaleLowerCase('fr');}
const answer=t=>t.answerHtml|| (typeof t.a==='number'?fmt(t.a):esc(t.a));
function dom(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!==undefined)n.innerHTML=html;return n;}
function button(label,fn,cls='btn'){const b=dom('button',cls,esc(label));b.type='button';b.addEventListener('click',fn);return b;}
/* Résolution de ax + b = cx + d. On n'écrit que les étapes utiles :
   pas de « soustraire 0x » si le membre de droite n'a pas de x, pas de « soustraire 0 », pas de « diviser par 1 ». */
function solveData(a,b,c,d,shown){
 const A=a-c,B=d-b,equation=shown||lin(a,b)+' = '+lin(c,d);
 if(!A)return {equation,a,b,c,d,A,B,all:B===0,solution:B===0?'tous':'aucune',correction:B===0?`<p>Les deux membres se réduisent à la même expression. Tous les nombres sont solutions.</p>`:`<p>On obtient ${fmt(b)} = ${fmt(d)}, ce qui est faux. Cette équation n’a aucune solution.</p>`};
 const [num,den]=ratio(B,A),solution=num/den,lines=[`<p>${equation}</p>`];
 if(shown)lines.push(`<p>On développe et on réduit. On obtient ${lin(a,b)} = ${lin(c,d)}.</p>`);
 if(c)lines.push(`<p>On ${c<0?'ajoute '+lin(-c,0):'soustrait '+lin(c,0)} aux deux membres. On obtient ${lin(A,b)} = ${fmt(d)}.</p>`);
 if(b)lines.push(`<p>On ${b<0?'ajoute '+fmt(-b):'soustrait '+fmt(b)} aux deux membres. On obtient ${lin(A,0)} = ${fmt(B)}.</p>`);
 if(A!==1)lines.push(`<p>On divise les deux membres par ${par(A)}. On obtient x = ${valHtml(B,A)}.</p>`);
 lines.push(`<p>La solution est ${ratHtml(B,A)}.</p>`);
 if(den===1){const s=solution;lines.push(shown?`<p>Vérification : pour x = ${fmt(s)}, les deux membres valent ${fmt(a*s+b)}.</p>`:`<p>Vérification : ${fmt(a)} × ${par(s)}${b?(b<0?' − ':' + ')+fmt(Math.abs(b)):''} = ${fmt(a*s+b)} et ${c?fmt(c)+' × '+par(s)+(d?(d<0?' − ':' + ')+fmt(Math.abs(d)):'')+' = ':''}${fmt(c*s+d)}.</p>`);}
 else lines.push('<p>On peut vérifier en remplaçant x par cette fraction dans l’équation de départ.</p>');
 return {equation,a,b,c,d,A,B,num,den,solution,correction:lines.join('')};
}
function equationExercise(level=1,example=false){
 let data,dev=null;
 if(level===3){
   if(example){data=solveData(4,13,20,12,'13 + 4x = 2(10x + 6)');dev={side:'de droite',from:'2(10x + 6)',a:'20x + 12',options:['20x + 12','20x + 6','12x + 12']};}
   else{const p=pick([-4,-3,-2,2,3,4,5]),q=pick([-5,-4,-3,-2,-1,1,2,3,4,5]),r=R(-15,20),from=`${fmt(p)}(${lin(1,q)})`;data=solveData(p,p*q,0,r,`${from} = ${fmt(r)}`);dev={side:'de gauche',from,a:lin(p,p*q),options:[lin(p,p*q),lin(p,q),lin(p,-p*q)]};}
 }else if(example)data=level===2?solveData(6,-5,4,9):solveData(5,-7,0,9);
 else{const a=pick([-7,-5,-4,-3,-2,2,3,4,5,6,7]);let c=0;if(level===2)do c=pick([-5,-3,-2,1,2,3,4]);while(c===a);data=solveData(a,R(-12,12)||5,c,R(-15,15));}
 const {a,b,c,d,A,B}=data,tasks=[];
 if(dev)tasks.push({q:`Développe le membre ${dev.side}, <span class="m">${dev.from}</span>. Quelle expression obtiens-tu ?`,a:dev.a,options:dev.options,hint:'Multiplie le nombre placé devant la parenthèse par chacun des deux termes de la parenthèse, en faisant attention aux signes.',corr:`${dev.from} = ${dev.a}. L’équation devient ${lin(a,b)} = ${lin(c,d)}.`});
 if(c)tasks.push({q:`On part de <span class="m">${lin(a,b)} = ${lin(c,d)}</span>. Regroupe les termes en x dans le membre de gauche. Quel est le nombre qui multiplie x à gauche ?`,a:A,hint:c<0?`Ajoute ${lin(-c,0)} aux deux membres. À gauche, il reste ${fmt(a)} + ${fmt(-c)} fois x.`:`Soustrais ${lin(c,0)} aux deux membres. À gauche, il reste ${fmt(a)} − ${fmt(c)} fois x.`,corr:`${fmt(a)} ${c<0?'+ '+fmt(-c):'− '+fmt(c)} = ${fmt(A)}. L’équation devient ${lin(A,b)} = ${fmt(d)}.`});
 if(b)tasks.push({q:`On a maintenant <span class="m">${lin(A,b)} = ${fmt(d)}</span>. Regroupe les nombres sans x dans le membre de droite. Quel nombre obtiens-tu à droite ?`,a:B,hint:b<0?`Ajoute ${fmt(-b)} aux deux membres. À droite, calcule ${fmt(d)} + ${fmt(-b)}.`:`Soustrais ${fmt(b)} aux deux membres. À droite, calcule ${fmt(d)} − ${fmt(b)}.`,corr:`${fmt(d)} ${b<0?'+ '+fmt(-b):'− '+fmt(b)} = ${fmt(B)}. L’équation devient ${lin(A,0)} = ${fmt(B)}.`});
 tasks.push({q:`On a maintenant <span class="m">${lin(A,0)} = ${fmt(B)}</span>. Quelle est la solution de l’équation ?`,qAlone:'Quelle est la solution de cette équation ?',a:data.solution,answerHtml:ratHtml(B,A),hint:A===1?'Le nombre qui multiplie x vaut 1 : la solution se lit directement.':`Divise les deux membres par ${par(A)}. Si le quotient n’est pas un nombre décimal, écris une fraction, par exemple 2/3.`,corr:A===1?`x = ${fmt(B)}.`:`On divise les deux membres par ${par(A)}. On obtient x = ${valHtml(B,A)}.`});
 return {data,head:`<p>Résous l’équation <span class="m">${data.equation}</span>.</p>`,tasks,correction:data.correction};
}
function testExercise(example=false){
 let a,b,c,d,x;if(example){a=-3;b=5;c=-7;d=1;x=-1;}else{a=R(-6,6)||2;c=R(-6,6)||-3;if(a===c)c++;if(!c)c=2;b=R(-9,9)||4;const s=R(-5,5);d=(a-c)*s+b;x=Math.random()<.5?s:s+pick([-2,-1,1,2]);}
 const G=a*x+b,D=c*x+d,equation=lin(a,b)+' = '+lin(c,d),term=(k,m)=>`${fmt(k)} × ${par(x)}${m?(m<0?' − ':' + ')+fmt(Math.abs(m)):''}`;
 return {data:{a,b,c,d,x,G,D},head:`<p>On considère l’équation <span class="m">${equation}</span>. Le nombre <span class="m">${fmt(x)}</span> est-il une solution ?</p>`,tasks:[
 {q:`Calcule le membre de gauche pour x = ${fmt(x)}.`,a:G,hint:'Remplace x par le nombre proposé. Mets-le entre parenthèses s’il est négatif.',corr:`G = ${term(a,b)} = ${fmt(G)}.`},
 {q:`Calcule le membre de droite pour x = ${fmt(x)}.`,a:D,hint:'Remplace x par le même nombre dans le membre de droite.',corr:`D = ${term(c,d)} = ${fmt(D)}.`},
 {q:'Le nombre proposé est-il une solution ?',a:G===D?'oui':'non',options:['oui','non'],hint:'Compare les deux résultats : le nombre est une solution seulement s’ils sont égaux.',corr:`On a ${fmt(G)} ${G===D?'=':'≠'} ${fmt(D)}, donc ${fmt(x)} ${G===D?'est':'n’est pas'} une solution.`}],correction:`<p>On remplace x par ${par(x)} dans chacun des deux membres.</p><p>G = ${term(a,b)} = ${fmt(G)}.</p><p>D = ${term(c,d)} = ${fmt(D)}.</p><p>${fmt(x)} ${G===D?'est':'n’est pas'} une solution, car les deux membres ${G===D?'sont égaux':'ne sont pas égaux'}.</p>`};
}
function ruleExercise(example=false){
 const type=example?0:R(0,3);
 const cases=[
  {head:'On part de <span class="m">x − 8 = 12</span>.',q:'Quelle opération permet d’obtenir x = 20 ?',a:'Ajouter 8 aux deux membres',options:['Ajouter 8 aux deux membres','Ajouter 8 seulement à gauche','Soustraire 8 aux deux membres'],corr:'On ajoute le même nombre aux deux membres. On obtient x − 8 + 8 = 12 + 8, donc x = 20.'},
  {head:'On part de <span class="m">−4x = 11</span>.',q:'Par quel nombre faut-il diviser les deux membres pour trouver x ?',a:-4,corr:'On divise les deux membres par −4, qui n’est pas nul. On obtient x = −11/4.'},
  {head:'On part de <span class="m">4x = 2</span>.',q:'Quelle opération est interdite ?',a:'Diviser les deux membres par 0',options:['Multiplier les deux membres par 5','Diviser les deux membres par 4','Diviser les deux membres par 0'],corr:'On ne peut pas diviser par 0. On peut multiplier ou diviser les deux membres par un même nombre, à condition qu’il ne soit pas nul.'},
  {head:'On part de <span class="m">6x − 5 = 4x + 9</span>.',q:'Quelle opération permet de regrouper les x à gauche ?',a:'Soustraire 4x aux deux membres',options:['Soustraire 4x aux deux membres','Soustraire 4x seulement à droite','Ajouter 4x seulement à gauche'],corr:'On soustrait la même expression 4x aux deux membres, puis on réduit. On obtient 2x − 5 = 9.'}

 const N=' ';
 const problems=[

  {q:'Regroupe les x à gauche et les nombres à droite. Quelle équation obtiens-tu ?',a:'4x = −12',options:['4x = −12','10x = −4','4x = −4'],hint:'Soustrais 3x aux deux membres, puis soustrais 4 aux deux membres.',corr:'On soustrait 3x aux deux membres. On obtient 4x + 4 = −8. On soustrait 4 aux deux membres. On obtient 4x = −12.'},
  {q:'Quel nombre faut-il choisir ?',a:-3,hint:'Divise les deux membres par 4.',corr:'x = −12 ÷ 4 = −3. Vérification : 7 × (−3) + 4 = −17 et 3 × (−3) − 8 = −17.'}],
  correction:'<p>On note x le nombre choisi. Le programme A donne 7x + 4 et le programme B donne 3x − 8.</p><p>On résout 7x + 4 = 3x − 8.</p><p>On soustrait 3x aux deux membres. On obtient 4x + 4 = −8.</p><p>On soustrait 4 aux deux membres. On obtient 4x = −12.</p><p>On divise les deux membres par 4. On obtient x = −3.</p><p>Vérification : 7 × (−3) + 4 = −17 et 3 × (−3) − 8 = −17.</p><p>Il faut choisir le nombre −3.</p>'},
 {head:`La somme de trois nombres entiers consécutifs est 1${N}254. Quel est le plus petit de ces trois nombres ?`,tasks:[
  {q:'On note n le plus petit des trois nombres. Quelle équation traduit le problème ?',a:`n + (n + 1) + (n + 2) = 1${N}254`,options:[`n + (n + 1) + (n + 2) = 1${N}254`,`n + 1 + 2 = 1${N}254`,`3n = 1${N}254`],hint:'Les deux nombres qui suivent n sont n + 1 et n + 2. On additionne les trois nombres.',corr:`Les trois nombres sont n, n + 1 et n + 2, et leur somme est 1${N}254.`},
  {q:'Réduis le membre de gauche. Quelle équation obtiens-tu ?',a:`3n + 3 = 1${N}254`,options:[`3n + 3 = 1${N}254`,`3n = 1${N}254`,`n + 3 = 1${N}254`],hint:'Compte les n, puis additionne les nombres 1 et 2.',corr:`n + n + n = 3n et 1 + 2 = 3, donc 3n + 3 = 1${N}254.`},
  {q:'Quel est le plus petit des trois nombres ?',a:417,hint:'Soustrais 3 aux deux membres, puis divise les deux membres par 3.',corr:`3n = 1${N}251, donc n = 417. Les trois nombres sont 417, 418 et 419.`}],
  correction:`<p>On note n le plus petit nombre. Les deux suivants sont n + 1 et n + 2.</p><p>On résout n + (n + 1) + (n + 2) = 1${N}254.</p><p>On réduit. On obtient 3n + 3 = 1${N}254.</p><p>On soustrait 3 aux deux membres. On obtient 3n = 1${N}251.</p><p>On divise les deux membres par 3. On obtient n = 417.</p><p>Vérification : 417 + 418 + 419 = 1${N}254.</p><p>Le plus petit des trois nombres est 417.</p>`},
 {head:'Un groupe compte deux fois plus d’adultes que d’enfants. Une entrée adulte coûte 15 € et une entrée enfant coûte 7 €. Le groupe paie 740 € en tout. Combien y a-t-il d’enfants ?',tasks:[
  {q:'On note x le nombre d’enfants. Quelle équation traduit le prix total ?',a:'15 × 2x + 7x = 740',options:['15 × 2x + 7x = 740','15x + 7 × 2x = 740','15 + 7 + 2x = 740'],hint:'Il y a x enfants et 2x adultes. Les adultes paient donc 15 × 2x euros.',corr:'Il y a 2x adultes et x enfants, donc 15 × 2x + 7x = 740.'},
  {q:'Réduis le membre de gauche. Quelle équation obtiens-tu ?',a:'37x = 740',options:['37x = 740','22x = 740','30x + 7 = 740'],hint:'15 × 2x = 30x. Ajoute ensuite les 7x payés pour les enfants.',corr:'15 × 2x = 30x et 30x + 7x = 37x, donc 37x = 740.'},
  {q:'Combien y a-t-il d’enfants ?',a:20,hint:'Divise les deux membres par 37.',corr:'x = 740 ÷ 37 = 20. Il y a 20 enfants et 40 adultes.'}],
  correction:'<p>On note x le nombre d’enfants. Il y a alors 2x adultes.</p><p>On résout 15 × 2x + 7x = 740.</p><p>On réduit. On obtient 37x = 740.</p><p>On divise les deux membres par 37. On obtient x = 20.</p><p>Vérification : 40 adultes et 20 enfants paient 40 × 15 + 20 × 7 = 600 + 140 = 740 €.</p><p>Il y a 20 enfants dans le groupe.</p>'},
 {head:'Un triangle équilatéral a des côtés de longueur (x + 5) cm. Un carré a des côtés de longueur (x + 3) cm. Pour quelle valeur de x ont-ils le même périmètre ?',tasks:[
  {q:'Quelle équation faut-il résoudre ?',a:'3(x + 5) = 4(x + 3)',options:['3(x + 5) = 4(x + 3)','x + 5 = x + 3','3x + 5 = 4x + 3'],hint:'Le triangle a trois côtés de même longueur et le carré en a quatre.',corr:'Le périmètre du triangle est 3(x + 5) et celui du carré est 4(x + 3).'},
  {q:'Développe les deux membres. Quelle équation obtiens-tu ?',a:'3x + 15 = 4x + 12',options:['3x + 15 = 4x + 12','3x + 5 = 4x + 3','3x + 8 = 4x + 7'],hint:'Multiplie 3 par x et par 5, puis multiplie 4 par x et par 3.',corr:'3(x + 5) = 3x + 15 et 4(x + 3) = 4x + 12.'},
  {q:'Quelle est la valeur de x ?',a:3,hint:'Soustrais 3x aux deux membres, puis soustrais 12 aux deux membres.',corr:'On obtient 15 = x + 12, donc x = 3. Les deux périmètres valent alors 24 cm.'}],
  correction:'<p>Le périmètre du triangle est 3(x + 5) et celui du carré est 4(x + 3).</p><p>On résout 3(x + 5) = 4(x + 3).</p><p>On développe. On obtient 3x + 15 = 4x + 12.</p><p>On soustrait 3x aux deux membres. On obtient 15 = x + 12.</p><p>On soustrait 12 aux deux membres. On obtient 3 = x.</p><p>Vérification : 3 × 8 = 24 et 4 × 6 = 24.</p><p>Les deux figures ont le même périmètre pour x = 3.</p>'},
 {head:'Une place adulte coûte 5 € de plus qu’une place enfant. Trois places enfant et deux places adulte coûtent 29 € en tout. Quel est le prix d’une place enfant ?',tasks:[

  correction:'<p>On note p le prix d’une place enfant. Une place adulte coûte p + 5.</p><p>On résout 3p + 2(p + 5) = 29.</p><p>On développe et on réduit. On obtient 5p + 10 = 29.</p><p>On soustrait 10 aux deux membres. On obtient 5p = 19.</p><p>On divise les deux membres par 5. On obtient p = 3,8.</p><p>Vérification : 3 × 3,80 + 2 × 8,80 = 11,40 + 17,60 = 29 €.</p><p>Une place enfant coûte 3,80 €.</p>'}
 ];const p=problems[example?0:R(0,4)];return {...p,head:'<p>'+p.head+'</p>'};

const MODULES={test:{title:'1. Tester une solution',desc:'Calculer séparément les deux membres, puis comparer.',retain:'Un nombre est une solution si l’égalité est vraie lorsqu’on remplace l’inconnue par ce nombre.',gen:testExercise},rules:{title:'2. Règles de transformation',desc:'Faire la même opération sur les deux membres.',retain:'R1 : ajouter ou soustraire la même expression aux deux membres. R2 : multiplier ou diviser les deux membres par un même nombre non nul.',gen:ruleExercise},solve:{title:'3. Résoudre une équation',desc:'Équations simples, avec x dans les deux membres, puis avec des parenthèses.',retain:'Développer et réduire si nécessaire. Regrouper les termes en x, puis les nombres. Diviser par le nombre qui multiplie x, puis conclure.',gen:null},problems:{title:'4. Mettre en équation',desc:'Programmes de calcul, nombres, périmètres et tarifs.',retain:'Choisir l’inconnue, traduire le problème par une égalité, résoudre, puis vérifier que la réponse convient au problème.',gen:problemExercise}};
/* Mon travail : suivi léger, enregistré dans le navigateur (clé propre à l'app).
   On compte les exercices finis dans « Je m'entraîne seul » (et ceux réussis sans erreur),
   et la dernière note provisoire de chaque D.S. blanc. Le code résume ce travail pour le professeur. */
function makeSuivi(app,prefix,modules){
 const KEY=app+'-suivi',B36=n=>Math.max(0,Math.min(1295,n|0)).toString(36).toUpperCase().padStart(2,'0');
 let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
 st.m=st.m||{};st.ds=st.ds||{};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
 const sum=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h;};
 const nf=x=>String(x).replace('.',',');
 const fait=(f,r)=>f?`${f} exercice${f>1?'s':''} fait${f>1?'s':''} seul, dont ${r} sans erreur`:'pas commencé';
 function code(){const day=Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);let b=B36(day);
  modules.forEach(([k],i)=>{const r=st.m[k];if(r&&r[0])b+=String(i)+'M'+B36(r[0])+B36(r[1]);});
  Object.keys(st.ds).sort().forEach(s=>{const d=st.ds[s];b+='D'+s+B36(Math.round(d.n*2))+B36(Math.round(d.max*2));});
  return (prefix+b+B36(sum(b))).match(/.{1,6}/g).join('-');}
 function decode(str){const s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');if(!s.startsWith(prefix)||s.length<prefix.length+4)return null;
  const b=s.slice(prefix.length,-2);if(sum(b)!==parseInt(s.slice(-2),36))return null;
  const out={date:new Date(Date.UTC(2026,0,1)+parseInt(b.slice(0,2),36)*864e5),m:{},ds:{}};
  for(let i=2;i+6<=b.length;i+=6){const e=b.slice(i,i+6);
   if(e[0]==='D')out.ds[e[1]]={n:parseInt(e.slice(2,4),36)/2,max:parseInt(e.slice(4,6),36)/2};
   else{const mod=modules[+e[0]];if(!mod||e[1]!=='M')return null;out.m[mod[0]]=[parseInt(e.slice(2,4),36),parseInt(e.slice(4,6),36)];}}
  return out;}
 function table(d){const rows=modules.map(([k,l])=>{const r=d.m[k]||[0,0];return `<tr><td>${l}</td><td>${r[0]?r[0]:'—'}</td><td>${r[0]?r[1]:'—'}</td></tr>`;}).join('');
  const ds=Object.keys(d.ds).sort().map(s=>`Sujet ${s === 'R' ? 'tiré au hasard' : s} : ${nf(d.ds[s].n)} / ${nf(d.ds[s].max)}`).join(' ; ');
  return `<table class="suivi-t"><tr><th>Partie</th><th>Exercices faits seul</th><th>Sans erreur</th></tr>${rows}</table><p>Dernière note provisoire au D.S. blanc : ${ds||'pas encore de D.S. vérifié'}.</p>`;}

/* Modelage : toutes les étapes, réponse et explication. Pratique guidée : les mêmes étapes, avec l'aide affichée.
   Pratique autonome : la question finale seulement (Résoudre, Problèmes). Dans les deux pratiques : deux essais, puis la correction. */
function renderExercise(parent,ex){
 const alone=VIEW.mode==='seul';
 if(alone)parent.append(dom('p','small','Rédige les calculs et les justifications sur ton cahier, puis saisis seulement ta réponse. Si la solution n’est pas un nombre décimal, écris-la sous forme de fraction, par exemple 2/3.'));
 parent.append(dom('div','exo-head',ex.head));const box=dom('div','steps');parent.append(box);
 const tasks=alone&&(VIEW.page==='solve'||VIEW.page==='problems')?[ex.tasks.at(-1)]:ex.tasks;
 let step=0,allFirst=true;
 function next(){
  if(step>=tasks.length){if(alone)SUIVI.done(VIEW.page,allFirst);parent.append(dom('div','seyes','<h4>Correction rédigée</h4>'+ex.correction));parent.append(button('Nouvel exercice',render));return;}
  const t=tasks[step++],q=alone&&t.qAlone?t.qAlone:t.q;const single=tasks.length===1,dup=single&&/\?\s*$/.test(String(ex.head).replace(/<[^>]*>/g,''));const row=dom('div','step',(single?'':`<div class="step-n">Étape ${step} sur ${tasks.length}</div>`)+(dup?'':`<div class="step-q">${q}</div>`));box.append(row);
  if(VIEW.mode==='exemple'){row.classList.add('done');row.append(dom('div','model-a',answer(t)),dom('div','model-e',t.corr));row.append(button(step<tasks.length?'Étape suivante':'Voir la rédaction',()=>{row.querySelector('button').remove();next();}));return;}
  if(VIEW.mode==='aide'&&t.hint)row.append(dom('p','small aide','<b>Aide :</b> '+t.hint));
  const area=dom('div','step-a'),feedback=dom('div','fb');feedback.setAttribute('aria-live','polite');row.append(area,feedback);let input;
  if(t.options){input=dom('select');input.append(new Option('Choisir une réponse',''));for(const o of (t.options.length>2?shuffle(t.options):t.options))input.append(new Option(o,o));}
  else {input=dom('input');input.type='text';input.className='eq-input';input.autocomplete='off';input.placeholder=typeof t.a==='number'?'Nombre ou fraction':'Réponse';}
  input.setAttribute('aria-label','Réponse à l’étape '+step);let tries=0;
  const valid=button('Valider',()=>{
   if(!input.value.trim()){feedback.className='fb warn';feedback.textContent='Donne une réponse avant de valider.';return;}
   const ok=correct(input.value,t.a);tries++;if(!ok)allFirst=false;
   if(!ok&&tries<2){feedback.className='fb warn';feedback.textContent=VIEW.mode==='aide'&&t.hint?'Ce n’est pas encore juste. Relis l’aide, puis fais un deuxième essai.':'Ce n’est pas encore juste. Vérifie tes calculs, puis fais un deuxième essai.';input.classList.add('bad');return;}
   input.classList.remove('bad');input.disabled=true;valid.disabled=true;row.classList.add(ok?'done':'missed');feedback.className='fb '+(ok?'ok':'ko');feedback.innerHTML=`<b>${ok?'C’est juste.':'La bonne réponse est '+answer(t)+'.'}</b> ${t.corr}`;row.append(button('Continuer',()=>{row.querySelectorAll('button').forEach(b=>b.remove());next();}));
  });input.addEventListener('keydown',e=>{if(e.key==='Enter')valid.click();});area.append(input,valid);
 }
 next();
}

/* D.S. blanc : les réponses restent enregistrées dans le navigateur (une clé par app et par sujet),

function dsKeep(paper,key){const els=()=>[...paper.querySelectorAll('input,select,textarea')].filter(e=>!['button','hidden','submit'].includes(e.type));
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v))els().forEach((e,i)=>{if(i>=v.length)return;if(e.type==='radio'||e.type==='checkbox')e.checked=!!v[i];else e.value=v[i]==null?'':v[i];});}catch(e){}
 let dead=false;const save=()=>setTimeout(()=>{if(dead)return;try{localStorage.setItem(key,JSON.stringify(els().map(e=>e.type==='radio'||e.type==='checkbox'?e.checked:e.value)));}catch(e){}},0);
 ['input','change','click'].forEach(ev=>paper.addEventListener(ev,save));
 return ()=>{dead=true;try{localStorage.removeItem(key);}catch(e){}};}
function dsNote(n,total){return String(Math.round(n*2)/2).replace('.',',')+' / '+total;}
function renderDS(){
 const main=$('#app');main.append(dom('h2','ttl','<span>5. D.S. blanc</span>'));const bar=dom('div','subtabs');const variant=VIEW.variant||'A';for(const v of ['A','B'])bar.append(button('Sujet '+v,()=>{VIEW.variant=v;render();},variant===v?'on':''));bar.append(button('Imprimer le sujet',()=>window.print(),'btn light'));main.append(bar);

/* Charte : dans le texte courant, la lettre x (seule ou après un chiffre : 3x, x²),
   la lettre f seule et g, h, p suivies d'une parenthèse sont des lettres mathématiques.
   On les affiche en italique STIX pour ne pas confondre x avec le signe ×.
   Le texte déjà en italique (<i>), le SVG et les champs de saisie ne sont pas touchés. */
(() => {
  "use strict";
  const RE = /(^|[^\p{L}\p{M}])(x|f|[ghp](?=\())(?![\p{L}\p{M}])/gu;
  const SKIP = "i, em, svg, code, pre, script, style, textarea, select, option, title, [contenteditable], .no-math";
  function fix(text) {
    const parent = text.parentElement;
    if (!parent || parent.closest(SKIP)) return;
    const value = text.data;
    RE.lastIndex = 0;
    if (!RE.test(value)) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    value.replace(RE, (all, before, letter, offset) => {
      const start = offset + before.length;
      if (start > last) frag.append(value.slice(last, start));
      const i = document.createElement("i");
      i.className = "m";
      i.textContent = letter;
      frag.append(i);
      last = start + letter.length;
      return all;
    });
    if (last < value.length) frag.append(value.slice(last));
    text.replaceWith(frag);
  }
  function scan(root) {
    if (root.nodeType === Node.TEXT_NODE) { fix(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(fix);
  }
  scan(document.body);
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === "characterData") fix(r.target);
      else r.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
